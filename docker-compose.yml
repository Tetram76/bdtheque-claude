services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bdtheque}
      POSTGRES_USER: ${POSTGRES_USER:-bdtheque}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bdtheque} -d ${POSTGRES_DB:-bdtheque}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # Business logic, data access, ML.NET. Never published on the host: only
  # `frontend` can reach it, over the `frontend-net` network (see choix-implementation.md).
  api:
    image: tetram76/bdtheque-api:${BDTHEQUE_TAG:-nightly}
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # GSS encryption (Kerberos) disabled: `db` is only reachable over the internal network, with a
      # password, and its library is missing from the chiseled image (see choix-implementation.md).
      ConnectionStrings__Bdtheque: Host=db;Port=5432;Database=${POSTGRES_DB:-bdtheque};Username=${POSTGRES_USER:-bdtheque};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required};GSS Encryption Mode=Disable
      InternalApiKey__Key: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
    volumes:
      - ${VISUELS_HOST_PATH:-./data/visuels}:/app/visuels
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend-net

  # Blazor Server rendering, admin authentication (cookie), the only
  # container exposed to the user.
  frontend:
    image: tetram76/bdtheque-frontend:${BDTHEQUE_TAG:-nightly}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Api__BaseUrl: http://api:8080
      InternalApiKey__Key: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
    volumes:
      - ${VISUELS_HOST_PATH:-./data/visuels}:/app/visuels:ro
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend-net

networks:
  # db is only reachable from `api`, never from `frontend`.
  backend:
  frontend-net:

volumes:
  db-data:
