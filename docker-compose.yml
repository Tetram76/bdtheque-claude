services:
  db:
    image: postgres:18.7-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bdtheque}
      POSTGRES_USER: ${POSTGRES_USER:-bdtheque}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bdtheque} -d ${POSTGRES_DB:-bdtheque}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db

  # Business logic, data access, ML.NET. Never published on the host: only
  # `frontend` can reach it, over the `api` network (see choix-implementation/socle/transverse/authentification-mise-en-oeuvre.md).
  api:
    image: tetram76/bdtheque-api:${BDTHEQUE_TAG:-nightly}
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    # Optional: a user (`uid:gid`) that can write to the visuals folder, e.g. the NAS user who created it, so that
    # nothing has to be changed on the folder. Empty, `api` runs as the user of its image
    # (see choix-implementation/deploiement/images-de-base-des-conteneurs.md).
    user: ${API_USER:-}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # GSS encryption (Kerberos) disabled: `db` is only reachable over the internal network, with a
      # password, and its library is missing from the chiseled image (see choix-implementation/deploiement/images-de-base-des-conteneurs.md).
      ConnectionStrings__Bdtheque: Host=db;Port=5432;Database=${POSTGRES_DB:-bdtheque};Username=${POSTGRES_USER:-bdtheque};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required};GSS Encryption Mode=Disable
      InternalApiKey__Key: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
    volumes:
      - ${VISUELS_HOST_PATH:-./data/visuels}:/app/visuels
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db
      - api

  # Blazor Server rendering, admin authentication (cookie), the only
  # container exposed to the user.
  frontend:
    image: tetram76/bdtheque-frontend:${BDTHEQUE_TAG:-nightly}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Api__BaseUrl: http://api:8080
      InternalApiKey__Key: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      # The single administrator account (see choix-implementation/socle/transverse/authentification-mise-en-oeuvre.md).
      AdminAccount__Login: ${ADMIN_LOGIN:?ADMIN_LOGIN is required}
      AdminAccount__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # Behind the reverse proxy of the NAS only, which terminates TLS; empty for a deployment reached directly in HTTP
      # (see choix-implementation/deploiement/frontend-derriere-le-reverse-proxy-du-nas.md).
      PublicAddress__Url: ${PUBLIC_URL:-}
    # No visuals volume: like `db`, it is private to `api`, which serves the media
    # (see choix-implementation/domaine/visuels-stockage-et-traitement.md).
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    # The health of `api` is checked by its image (HEALTHCHECK of docker/api/Dockerfile), as is that of `frontend`:
    # without shell nor curl, the check is a .NET probe that only the image carries.
    depends_on:
      api:
        condition: service_healthy
    networks:
      - api

networks:
  # Each network is named after the container it gives access to, and only its callers join it
  # (see choix-implementation/deploiement/reseaux-des-conteneurs.md): `db` is reached from `api` only, never from `frontend`.
  db:
  api:

volumes:
  db-data:
