name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A push to a pull request makes the run of its previous commit useless: that run is cancelled rather
# than left to consume the quotas of Docker Hub and of the GitHub API (gestion-projet/depot.md
# § Intégration continue (CI)). Each push to main has a group of its own: a shared one would hold a
# second run pending, and cancel it when a third one arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & tests (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The SDK of the Dockerfiles (SdkVersionTests).
      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.402"

      # Keyed on everything that decides the restored packages, the SDK included, which brings
      # implicit ones. No fallback key: a partial cache, saved again under the new key, would keep
      # the packages of every former version.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', 'dotnet-tools.json') }}

      - name: Restore dependencies
        run: dotnet restore Bdtheque.slnx

      - name: Build (Release)
        run: dotnet build Bdtheque.slnx --configuration Release --no-restore

      # A model change committed without its migration would otherwise go unnoticed: the tests
      # run the migrations, not the model, so they would still pass against the stale schema.
      - name: Check migrations are in sync with the model
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Bdtheque.Infrastructure --configuration Release --no-build

      # The end-to-end tests drive the application in Chromium, with the system libraries it needs on
      # the runner (choix-implementation/outillage.md § Outillage de développement .NET).
      - name: Install the browser of the end-to-end tests
        run: pwsh tests/Bdtheque.EndToEnd.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # The coverage is measured by the SonarQube Cloud analysis (code-quality.yml), which reports it.
      - name: Run tests
        run: dotnet test Bdtheque.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: "**/TestResults/test-results.trx"
          if-no-files-found: warn

      # The captures that differ from their reference, each with its difference image (CaptureStore), for the
      # reviewer of a failed comparison.
      - name: Publish the captures that differ
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures
          path: tests/Bdtheque.EndToEnd.Tests/TestResults/captures
          if-no-files-found: ignore

  docker-build:
    name: Build Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The publishing token: the code of the branch and of its dependencies only runs inside the
      # build containers, which never get the registry credentials (gestion-projet/depot.md § Intégration
      # continue (CI)).
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: tetram76
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same platform as the published images (docker-publish.yml), so that a pull request
      # cannot break their publication. Loaded into the local image store for Docker Scout.
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: bdtheque-${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Find the published nightly image
        id: reference
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          digest=$(.github/scripts/registry-digest.sh "tetram76/bdtheque-${{ matrix.image }}" nightly)
          [ -n "$digest" ] && echo "published=true" >> "$GITHUB_OUTPUT" || true

      # Fails when the image adds a fixable vulnerability to the published one: a vulnerability it
      # already holds is not introduced by this change (choix-implementation/deploiement.md § Publication des
      # images Docker). Without a published image, no fixable vulnerability is accepted at all.
      - name: Check vulnerabilities of the ${{ matrix.image }} image
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84 # v1.27.0
        with:
          command: ${{ steps.reference.outputs.published == 'true' && 'compare' || 'cves' }}
          image: local://bdtheque-${{ matrix.image }}:scan
          to: registry://tetram76/bdtheque-${{ matrix.image }}:nightly
          only-fixed: true
          exit-on: vulnerability
          exit-code: ${{ steps.reference.outputs.published != 'true' }}
          write-comment: false
