name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A push to a pull request makes the run of its previous commit useless: that run is cancelled rather
# than left to consume the quotas of Docker Hub and of the GitHub API (gestion-projet/depot.md
# § Intégration continue (CI)). Each push to main has a group of its own: a shared one would hold a
# second run pending, and cancel it when a third one arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & tests (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # The SDK of the Dockerfiles (SdkVersionTests).
      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "10.0.402"

      # Keyed on everything that decides the restored packages, the SDK included, which brings
      # implicit ones. No fallback key: a partial cache, saved again under the new key, would keep
      # the packages of every former version.
      - name: Cache NuGet packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', 'dotnet-tools.json') }}

      - name: Restore dependencies
        run: dotnet restore Bdtheque.slnx

      - name: Build (Release)
        run: dotnet build Bdtheque.slnx --configuration Release --no-restore

      # A model change committed without its migration would otherwise go unnoticed: the tests
      # run the migrations, not the model, so they would still pass against the stale schema.
      - name: Check migrations are in sync with the model
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Bdtheque.Infrastructure --configuration Release --no-build

      # Coverage of the application code only: the library shared by the tests is left out.
      - name: Run tests
        run: >-
          dotnet test Bdtheque.slnx --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx" --collect "XPlat Code Coverage"
          -- "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude=[Bdtheque.Testing]*"

      - name: Publish test results and coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results
          path: |
            **/TestResults/test-results.trx
            **/TestResults/*/coverage.cobertura.xml
          if-no-files-found: warn

  docker-build:
    name: Build Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # The publishing token: the code of the branch and of its dependencies only runs inside the
      # build containers, which never get the registry credentials (gestion-projet/depot.md § Intégration
      # continue (CI)).
      - name: Log in to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: tetram76
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same platform as the published images (docker-publish.yml), so that a pull request
      # cannot break their publication. Loaded into the local image store for Docker Scout.
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: bdtheque-${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Find the published nightly image
        id: reference
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          digest=$(.github/scripts/registry-digest.sh "tetram76/bdtheque-${{ matrix.image }}" nightly)
          [ -n "$digest" ] && echo "published=true" >> "$GITHUB_OUTPUT" || true

      # Fails when the image adds a fixable vulnerability to the published one: a vulnerability it
      # already holds is not introduced by this change (choix-implementation/deploiement.md § Publication des
      # images Docker). Without a published image, no fixable vulnerability is accepted at all.
      - name: Check vulnerabilities of the ${{ matrix.image }} image
        uses: docker/scout-action@v1.27.0
        with:
          command: ${{ steps.reference.outputs.published == 'true' && 'compare' || 'cves' }}
          image: local://bdtheque-${{ matrix.image }}:scan
          to: registry://tetram76/bdtheque-${{ matrix.image }}:nightly
          only-fixed: true
          exit-on: vulnerability
          exit-code: ${{ steps.reference.outputs.published != 'true' }}
          write-comment: false
