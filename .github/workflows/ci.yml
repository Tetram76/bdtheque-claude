name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & tests (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurer .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restaurer les dépendances
        run: dotnet restore Bdtheque.slnx

      - name: Compiler (Release)
        run: dotnet build Bdtheque.slnx --configuration Release --no-restore

      - name: Exécuter les tests
        run: dotnet test Bdtheque.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publier les résultats de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/test-results.trx"
          if-no-files-found: warn

  docker-build:
    name: Build image Docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construire l'image ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          push: false
