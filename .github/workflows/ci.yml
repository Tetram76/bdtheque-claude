name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Run on main once a version is tagged: the new code period of SonarQube Cloud starts at the first analysis carrying
  # that version, which must be the one of the published commit (gestion-projet/depot/versions-et-releases.md).
  workflow_dispatch:

permissions:
  contents: read

# A push to a pull request makes the run of its previous commit useless: that run is cancelled rather
# than left to consume the quotas of Docker Hub and of the GitHub API
# (gestion-projet/depot/integration-continue-ci.md). Each push to main has a group of its own: a
# shared one would hold a
# second run pending, and cancel it when a third one arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & tests (.NET)
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.changes.outputs.sources }}
    steps:
      # The merge commit of a pull request (refs/pull/<number>/merge) and its first parent, the head of main it merges
      # into: their difference is the pull request as it would be merged.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # A pull request runs only the tests that its changes can fail; a push to main or a run on demand runs them all
      # (gestion-projet/depot/integration-continue-ci.md). Safe by default: a file that no pattern leaves out is a source,
      # and a source of the rendering; a moved file counts at both paths (--no-renames). The skipped steps leave the job,
      # hence its required check, in place.
      - name: Classify the changed files
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "sources=true" >> "$GITHUB_OUTPUT"
            echo "rendering=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd "$RUNNER_TEMP"
          git -C "$GITHUB_WORKSPACE" diff --name-only --no-renames HEAD^1 HEAD > changed.txt
          # Documentation, and tooling that no test runs: the tests of the repository check what they read of it.
          not_sources='^(\.speckit/|\.claude/|poc/|scripts/|docker/|\.github/|[^/]+\.md$|docker-compose\.yml$|\.env\.example$|\.dockerignore$|\.gitignore$)'
          { grep -vE "$not_sources" changed.txt || true; grep -xF .github/workflows/ci.yml changed.txt || true; } > sources.txt
          # The tests without a browser render no screen.
          grep -vE '^tests/Bdtheque\.(Api|Domain|Frontend|Infrastructure|ValidationData)\.Tests/' sources.txt > rendering.txt || true
          echo "sources=$([ -s sources.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "rendering=$([ -s rendering.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          for list in changed sources rendering; do
            echo "::group::$list ($(wc -l < "$list.txt"))"; cat "$list.txt"; echo "::endgroup::"
          done

      # The SDK of the Dockerfiles (SdkVersionTests).
      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.404"

      # Keyed on everything that decides the restored packages, the SDK included, which brings
      # implicit ones. No fallback key: a partial cache, saved again under the new key, would keep
      # the packages of every former version.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', 'dotnet-tools.json') }}

      - name: Restore dependencies
        run: dotnet restore Bdtheque.slnx

      - name: Build (Release)
        run: dotnet build Bdtheque.slnx --configuration Release --no-restore

      # A model change committed without its migration would otherwise go unnoticed: the tests
      # run the migrations, not the model, so they would still pass against the stale schema.
      - name: Check migrations are in sync with the model
        if: steps.changes.outputs.sources == 'true'
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Bdtheque.Infrastructure --configuration Release --no-build

      # The end-to-end tests drive the application in the headless shell of Chromium, with the system libraries it needs
      # on the runner: neither the full browser, which only a headed run uses, nor FFmpeg, which only a video does
      # (choix-implementation/outillage.md).
      - name: Install the browser of the end-to-end tests
        if: steps.changes.outputs.rendering == 'true'
        run: pwsh tests/Bdtheque.EndToEnd.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps --only-shell chromium

      # Chromium drops the requests of the pages it is loading whenever an address of the machine is added or deleted
      # (net::ERR_NETWORK_CHANGED). The kernel gives each interface that Docker creates on the runner for a container an
      # IPv6 link-local address, about a second after the container starts, and deletes it with the container, which
      # Ryuk removes ten seconds after its test process ends: the containers of the tests would change the addresses of
      # the runner at any moment of the run. Docker's interfaces, its bridge included, carry no link-local address: its
      # default bridge is IPv4 only, and nothing else of the machine changes (choix-implementation/outillage.md).
      - name: Keep the interfaces of Docker without link-local address
        if: steps.changes.outputs.rendering == 'true'
        run: sudo sysctl -w net.ipv6.conf.default.addr_gen_mode=1 net.ipv6.conf.docker0.addr_gen_mode=1

      # The links and addresses of the runner, as Chromium watches them (netlink), and the Docker events that create
      # them, over the whole run of the tests: the check of the step after the tests, and the facts of a failure.
      - name: Record the network changes of the runner
        id: network-record
        if: steps.changes.outputs.rendering == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/network"
          ip -o address > "$RUNNER_TEMP/network/initial-addresses.txt"
          nohup ip -ts monitor link address > "$RUNNER_TEMP/network/ip-monitor.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/network-ip-monitor.pid"
          nohup docker events --format '{{.TimeNano}} {{.Type}} {{.Action}} {{.Actor.ID}} {{index .Actor.Attributes "name"}}' > "$RUNNER_TEMP/network/docker-events.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/network-docker-events.pid"

      # The only run of each test, in two steps: the tests without a browser side by side, then the end-to-end tests
      # alone, which side by side with the others take twice as long for the processors of the runner, nearer to the
      # timeouts of their browser, for no shorter run. Both collect the coverage that the SonarQube Cloud analysis
      # reports, on the code of the application only, the library shared by the tests being left out
      # (choix-implementation/outillage.md).
      - name: Run tests
        if: steps.changes.outputs.sources == 'true'
        run: >-
          dotnet test Bdtheque.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
          --filter "FullyQualifiedName!~Bdtheque.EndToEnd.Tests."
          --collect "XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude=[Bdtheque.Testing]*"

      # Without a source changed, only the tests that confront the files of the repository with their rules, all in this
      # project: no container, no browser, and no coverage, since no code it measures changed.
      - name: Run the tests of the repository
        if: steps.changes.outputs.sources != 'true'
        run: >-
          dotnet test tests/Bdtheque.Infrastructure.Tests --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx" --filter "Category=Repository"

      - name: Run end-to-end tests
        if: (success() || failure()) && steps.changes.outputs.rendering == 'true'
        run: >-
          dotnet test tests/Bdtheque.EndToEnd.Tests --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude=[Bdtheque.Testing]*"

      # Fails when an interface of Docker got or lost an address during the tests, whatever their result: the pages
      # loaded meanwhile may have lost some of their requests.
      - name: Check that Docker changed no address during the tests
        if: (success() || failure()) && steps.network-record.outcome == 'success'
        run: |
          kill "$(cat "$RUNNER_TEMP/network-ip-monitor.pid")" "$(cat "$RUNNER_TEMP/network-docker-events.pid")"
          if grep -E '^\[[^]]+\] (Deleted )?[0-9]+: (veth|docker|br-)[^ ]* +inet' "$RUNNER_TEMP/network/ip-monitor.log"; then
            echo "::error::An interface of Docker got or lost an address during the tests (choix-implementation/outillage.md)."
            exit 1
          fi

      - name: Publish the coverage
        if: steps.changes.outputs.sources == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: "**/TestResults/**/coverage.opencover.xml"
          if-no-files-found: error
          retention-days: 1

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: "**/TestResults/test-results.trx"
          if-no-files-found: warn

      - name: Publish the network changes of the runner
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-changes
          path: ${{ runner.temp }}/network
          if-no-files-found: warn

      # The captures that differ from their reference, each with its difference image (CaptureStore), for the
      # reviewer of a failed comparison.
      - name: Publish the captures that differ
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures
          path: tests/Bdtheque.EndToEnd.Tests/TestResults/captures
          if-no-files-found: ignore

  # SonarQube Cloud analysis of the code, with the coverage of the tests run above, for the quality indicators of the
  # README and the pull request decoration (gestion-projet/depot/analyse-de-la-qualite-du-code.md). A job of its own: the
  # scanner switches off TreatWarningsAsErrors in the build it wraps, so it cannot stand in for the strict build above,
  # and an analysis that cannot run (service down, token missing) fails this job, never the check of non-regression. The
  # merge requires the quality gate through the check that the SonarQube Cloud app publishes after this analysis.
  sonarcloud:
    name: SonarQube Cloud analysis
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      # The full history lets the analysis tell the new code apart and blame each issue.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.404"

      # The scanner runs its analysis on Java.
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # The packages restored by the job of the tests, under the same key.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', 'dotnet-tools.json') }}

      - name: Restore tools and dependencies
        run: |
          dotnet tool restore
          dotnet restore Bdtheque.slnx

      # The reports name the files of the application by their path on the runner, the same in every job. A pull request
      # that changes no source has none, no code it measures having changed: the analysis then imports no report.
      - name: Get the coverage of the tests
        if: needs.build-and-test.outputs.sources == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage

      # The mockups of .speckit/ and the prototypes of poc/ are no product code; the migrations are generated by EF Core.
      # The PowerShell scripts of the tooling and the scripts of the frontend are analyzed, but left out of the coverage:
      # only that of the .NET tests is collected. The version is the last published one: the new code of the project is
      # what changed since that release.
      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet tool run dotnet-sonarscanner begin
          /k:"Tetram76_bdtheque-claude" /o:"tetram76"
          /v:"$(git describe --tags --abbrev=0)"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.exclusions=".speckit/**,poc/**,**/Migrations/**,coverage/**"
          /d:sonar.coverage.exclusions="**/*.ps1,src/Bdtheque.Frontend/wwwroot/**/*.js"
          ${{ needs.build-and-test.outputs.sources == 'true' && '/d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml"' || '' }}

      - name: Build
        run: dotnet build Bdtheque.slnx --configuration Release --no-restore

      - name: End analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet tool run dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  docker-build:
    name: Build Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The publishing token: the code of the branch and of its dependencies only runs inside the
      # build containers, which never get the registry credentials
      # (gestion-projet/depot/integration-continue-ci.md).
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: tetram76
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same platform as the published images (docker-publish.yml), so that a pull request
      # cannot break their publication. Loaded into the local image store for Docker Scout.
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: bdtheque-${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Find the published nightly image
        id: reference
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          digest=$(.github/scripts/registry-digest.sh "tetram76/bdtheque-${{ matrix.image }}" nightly)
          [ -n "$digest" ] && echo "published=true" >> "$GITHUB_OUTPUT" || true

      # Fails when the image adds a fixable vulnerability to the published one: a vulnerability it
      # already holds is not introduced by this change
      # (choix-implementation/deploiement/publication-des-images-docker.md). Without a published image, no
      # fixable vulnerability is accepted at all.
      - name: Check vulnerabilities of the ${{ matrix.image }} image
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84 # v1.27.0
        with:
          command: ${{ steps.reference.outputs.published == 'true' && 'compare' || 'cves' }}
          image: local://bdtheque-${{ matrix.image }}:scan
          to: registry://tetram76/bdtheque-${{ matrix.image }}:nightly
          only-fixed: true
          exit-on: vulnerability
          exit-code: ${{ steps.reference.outputs.published != 'true' }}
          write-comment: false
