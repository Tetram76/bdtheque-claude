name: PR Template Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  check-description:
    name: Check PR description
    runs-on: ubuntu-latest
    steps:
      - name: Compare description against template
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body || "").replace(/\r\n/g, "\n");

            function stripComments(text) {
              return text.replace(/<!--[\s\S]*?-->/g, "");
            }

            function extractSection(heading) {
              const lines = body.split("\n");
              const start = lines.findIndex((line) => line.trim() === heading);
              if (start === -1) {
                return null;
              }
              let end = lines.length;
              for (let i = start + 1; i < lines.length; i++) {
                if (lines[i].startsWith("## ")) {
                  end = i;
                  break;
                }
              }
              return lines.slice(start + 1, end).join("\n");
            }

            // Headings match the French PR template (.github/PULL_REQUEST_TEMPLATE.md):
            // PR descriptions become the squashed commit body, kept in French like commit messages.
            const requiredSections = ["## Résumé", "## Plan de test"];
            const problems = [];

            for (const heading of requiredSections) {
              const raw = extractSection(heading);
              if (raw === null) {
                problems.push(`missing section: "${heading}"`);
                continue;
              }
              if (stripComments(raw).trim().length === 0) {
                problems.push(`empty section, template placeholder not replaced: "${heading}"`);
              }
            }

            if (problems.length > 0) {
              core.setFailed(
                "The PR description does not follow .github/PULL_REQUEST_TEMPLATE.md:\n- " +
                  problems.join("\n- ")
              );
              return;
            }

            console.log("PR description matches the template.");
