name: Code quality

# SonarQube Cloud analysis of the code, with the test coverage, for the quality indicators of the
# README and the pull request decoration (gestion-projet/depot.md § Analyse de la qualité du code).
# It is kept out of ci.yml, whose jobs are all required checks: the scanner switches off
# TreatWarningsAsErrors in the build it wraps, so it cannot stand in for the strict build of the CI,
# and an outage of the external service must not block the merges.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Run on main once a version is tagged: the new code period of the project starts at the first
  # analysis carrying that version, which must be the one of the published commit
  # (gestion-projet/depot.md § Versions et releases).
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the analysis of its previous commit. A run on main is never
# cancelled, the one that follows the tagging of a version above all.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonarcloud:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    steps:
      # The full history lets the analysis tell the new code apart and blame each issue.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.402"

      # The scanner runs its analysis on Java.
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore tools and dependencies
        run: |
          dotnet tool restore
          dotnet restore Bdtheque.slnx

      # The mockups of .speckit/ and the prototypes of poc/ are no product code; the migrations are
      # generated by EF Core. The PowerShell scripts of the tooling are analyzed, but left out of the
      # coverage: only that of the .NET tests is collected. The version is the last published one: the
      # new code of the project is what changed since that release.
      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet tool run dotnet-sonarscanner begin
          /k:"Tetram76_bdtheque-claude" /o:"tetram76"
          /v:"$(git describe --tags --abbrev=0)"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.exclusions=".speckit/**,poc/**,**/Migrations/**"
          /d:sonar.coverage.exclusions="**/*.ps1"
          /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"

      - name: Build
        run: dotnet build Bdtheque.slnx --configuration Release --no-restore

      # Coverage of the application code only: the library shared by the tests is left out.
      - name: Run tests with coverage
        run: >-
          dotnet test Bdtheque.slnx --configuration Release --no-build --collect "XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude=[Bdtheque.Testing]*"

      - name: End analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet tool run dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
