name: Code quality

# SonarQube Cloud analysis of the code, with the test coverage, for the quality indicators of the
# README and the pull request decoration (gestion-projet/depot.md § Analyse de la qualité du code).
# It is kept out of ci.yml, whose jobs are all required checks: the scanner switches off
# TreatWarningsAsErrors in the build it wraps, so it cannot stand in for the strict build of the CI,
# and an outage of the external service must not block the merges.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    steps:
      # The full history lets the analysis tell the new code apart and blame each issue.
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: "10.0.402"

      # The scanner runs its analysis on Java.
      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore tools and dependencies
        run: |
          dotnet tool restore
          dotnet restore Bdtheque.slnx

      # The mockups of .speckit/ and the prototypes of poc/ are no product code; the migrations are
      # generated by EF Core. The version is the last published one: the new code of the project is
      # what changed since that release.
      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet tool run dotnet-sonarscanner begin
          /k:"Tetram76_bdtheque-claude" /o:"tetram76"
          /v:"$(git describe --tags --abbrev=0)"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.exclusions=".speckit/**,poc/**,**/Migrations/**"
          /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"

      - name: Build
        run: dotnet build Bdtheque.slnx --configuration Release --no-restore

      - name: Run tests with coverage
        run: dotnet test Bdtheque.slnx --configuration Release --no-build --collect "XPlat Code Coverage;Format=opencover"

      - name: End analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet tool run dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
