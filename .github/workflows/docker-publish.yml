name: Docker publish

# Publishes the application images to Docker Hub (account `tetram76`, see contraintes-techniques/architecture-deploiement/deploiement.md).
# Images are only published nightly and on demand (contraintes-techniques/architecture-deploiement/deploiement.md), never on each merge.
on:
  # Nightly images. Scheduled runs use the head of `main`.
  schedule:
    - cron: "17 3 * * *"
  # On-demand build of the branch, or of the version tag, chosen when the workflow is run.
  workflow_dispatch:

permissions:
  contents: read

# Runs share the Docker Hub tags: two overlapping nightly runs would each record the same images to
# replace, and the images pushed by the first would be left untagged and never deleted.
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  API_REPOSITORY: tetram76/bdtheque-api
  FRONTEND_REPOSITORY: tetram76/bdtheque-frontend

jobs:
  # A single job for both images: `docker-compose.yml` deploys them under the same tag, so neither
  # is pushed before both are built. A failed build then leaves the published pair untouched.
  publish:
    name: Publish Docker images
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: tetram76
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Immutable tags of an on-demand run: `sha-<commit>` and, when run on the tag of a version
      # (gestion-projet/depot/versions-et-releases.md), the version number without its `v`. Each is only
      # pushed if neither image has it yet: a new run on an already published commit or version (e.g.
      # to pick up base image updates) only moves the branch tag, if any. A registry error, or a tag
      # present for one image only, fails the job rather than letting a tag be overwritten.
      # Only a `v<major>.<minor>.<patch>` tag names a version, and 0.0.x versions have no images.
      - name: Check which immutable tags are already published
        id: immutable
        if: github.event_name == 'workflow_dispatch'
        run: |
          tags=("sha:sha-$GITHUB_SHA")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::$GITHUB_REF_NAME is not the tag of a version (v<major>.<minor>.<patch>): run on a branch or on a version tag."
              exit 1
            fi
            if [ "${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" = 0.0 ]; then
              echo "::error::Version ${GITHUB_REF_NAME#v} has no images: 0.0.x versions ship no usable application."
              exit 1
            fi
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            tags+=("version:${GITHUB_REF_NAME#v}")
          fi
          for entry in "${tags[@]}"; do
            name=${entry%%:*} tag=${entry#*:}
            api=$(.github/scripts/registry-digest.sh "$API_REPOSITORY" "$tag")
            frontend=$(.github/scripts/registry-digest.sh "$FRONTEND_REPOSITORY" "$tag")
            if [ -n "$api" ] && [ -n "$frontend" ]; then
              echo "$name-published=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$tag already exists: kept as is."
            elif [ -n "$api$frontend" ]; then
              echo "::error::$tag exists for only one image: delete it on Docker Hub, then run again."
              exit 1
            else
              new=true
            fi
          done
          # Run on a version tag, there is no branch tag: with every immutable tag already there,
          # nothing would be pushed.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ -z "${new:-}" ]; then
            echo "nothing-new=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version ${GITHUB_REF_NAME#v} is already published: nothing to publish."
          fi

      # Only one `nightly` image may exist per repository (contraintes-techniques/architecture-deploiement/deploiement.md): the images
      # the new ones replace are recorded here, then deleted once the tag has moved. A missing image
      # (first nightly) leaves nothing to delete; a registry error fails the job, since a replaced
      # image could not be deleted without its digest. When both nightly images are already built
      # from the head of `main` (revision label set by metadata-action), nothing is published.
      # An on-demand run replaces no nightly image: it reads none, reading the label of one counting
      # as a pull against the quota of the account (gestion-projet/depot/integration-continue-ci.md).
      # Every later step runs only when this one sets `publish`, which a skipped step never does.
      - name: Record the current nightly images
        id: previous
        if: steps.immutable.outputs.nothing-new != 'true'
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          up_to_date=true
          for image in api frontend; do
            variable="${image^^}_REPOSITORY"
            repository=${!variable}
            digest=$(.github/scripts/registry-digest.sh "$repository" nightly)
            if [ -z "$digest" ]; then
              echo "::notice::No $repository:nightly yet."
              up_to_date=false
              continue
            fi
            echo "$image-digest=$digest" >> "$GITHUB_OUTPUT"
            revision=$(docker buildx imagetools inspect "$repository@$digest" --format '{{json .Image}}' \
              | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty')
            [ "$revision" = "$GITHUB_SHA" ] || up_to_date=false
          done
          if [ "$up_to_date" = true ]; then
            echo "::notice::The nightly images are already built from $GITHUB_SHA: nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # A nightly build only gets `nightly`. An on-demand build gets the name of its branch, if run
      # on a branch, and those of the immutable tags probed above that are not published yet:
      # `sha-<commit>`, with the full commit hash, and the version number.
      - name: Compute tags and labels
        id: meta
        if: steps.previous.outputs.publish == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.API_REPOSITORY }}
            ${{ env.FRONTEND_REPOSITORY }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=long,enable=${{ github.event_name == 'workflow_dispatch' && steps.immutable.outputs.sha-published != 'true' }}
            type=raw,value=${{ steps.immutable.outputs.version }},enable=${{ steps.immutable.outputs.version != '' && steps.immutable.outputs.version-published != 'true' }}

      - name: Split tags by image
        id: tags
        if: steps.previous.outputs.publish == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "api<<EOF"; grep "^$API_REPOSITORY:" <<< "$TAGS"; echo "EOF"
            echo "frontend<<EOF"; grep "^$FRONTEND_REPOSITORY:" <<< "$TAGS"; echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Build and check both images before pushing either: the push steps below rebuild from the
      # builder's cache, so they only upload. Loaded into the local image store for Docker Scout.
      - name: Build api image
        if: steps.previous.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/api/Dockerfile
          platforms: linux/amd64
          load: true
          tags: bdtheque-api:scan
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build frontend image
        if: steps.previous.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/frontend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: bdtheque-frontend:scan
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # An image that holds a fixable vulnerability of a package the repository chooses is never
      # published, nor is the other image of the pair (same check as the CI, see ci.yml).
      - name: Check vulnerabilities of the api image
        if: steps.previous.outputs.publish == 'true'
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84 # v1.27.0
        with:
          command: cves
          image: local://bdtheque-api:scan
          only-fixed: true
          only-package-types: nuget
          exit-code: true
          write-comment: false

      - name: Check vulnerabilities of the frontend image
        if: steps.previous.outputs.publish == 'true'
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84 # v1.27.0
        with:
          command: cves
          image: local://bdtheque-frontend:scan
          only-fixed: true
          only-package-types: nuget
          exit-code: true
          write-comment: false

      # Without attestations each image is a single manifest, deleted in one call: an image index
      # would leave its child manifests behind, untagged.
      - name: Push api image
        id: push-api
        if: steps.previous.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/api/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.api }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Push frontend image
        id: push-frontend
        if: steps.previous.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.frontend }}
          labels: ${{ steps.meta.outputs.labels }}

      # Docker Hub registry API: only an untagged manifest can be deleted, by digest, with a token
      # holding the `delete` scope (hence a Read, Write & Delete access token).
      - name: Delete the replaced nightly images
        if: github.event_name == 'schedule' && steps.previous.outputs.publish == 'true'
        env:
          API_PREVIOUS: ${{ steps.previous.outputs.api-digest }}
          API_CURRENT: ${{ steps.push-api.outputs.digest }}
          FRONTEND_PREVIOUS: ${{ steps.previous.outputs.frontend-digest }}
          FRONTEND_CURRENT: ${{ steps.push-frontend.outputs.digest }}
        run: |
          for image in API FRONTEND; do
            repository_variable="${image}_REPOSITORY" previous_variable="${image}_PREVIOUS" current_variable="${image}_CURRENT"
            repository=${!repository_variable} previous=${!previous_variable} current=${!current_variable}
            if [ -z "$previous" ] || [ "$previous" = "$current" ]; then
              continue
            fi
            token=$(curl -fsS -u "tetram76:$DOCKERHUB_TOKEN" \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$repository:delete" | jq -er .token)
            status=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $token" \
              "https://registry-1.docker.io/v2/$repository/manifests/$previous")
            case "$status" in
              202) echo "Deleted $repository@$previous." ;;
              # Documented by Docker Hub: the deletion goes on in the background.
              500) echo "::warning::Deletion of $repository@$previous accepted, completed in the background." ;;
              *) echo "::error::Deletion of $repository@$previous failed (HTTP $status)."; exit 1 ;;
            esac
          done
