name: Docker publish

# Publishes the application images to Docker Hub (account `tetram76`, see contraintes-techniques.md).
# Images are only published nightly and on demand (contraintes-techniques.md), never on each merge.
on:
  # Nightly image. Scheduled runs use the head of `main`.
  schedule:
    - cron: "17 3 * * *"
  # On-demand build of the branch chosen when the workflow is run.
  workflow_dispatch:

permissions:
  contents: read

# Runs share the Docker Hub tags: two overlapping nightly runs would each record the same image to
# replace, and the image pushed by the first would be left untagged and never deleted.
concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: tetram76
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `sha-<commit>` is immutable: a new on-demand run on an already published commit (e.g. to
      # pick up base image updates) only moves the branch tag. A registry error fails the job
      # rather than letting the tag be overwritten.
      - name: Check whether this commit is already published
        id: commit
        if: github.event_name == 'workflow_dispatch'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPOSITORY: tetram76/bdtheque-${{ matrix.image }}
        run: |
          digest=$(.github/scripts/registry-digest.sh "$REPOSITORY" "sha-${GITHUB_SHA::7}")
          if [ -n "$digest" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$REPOSITORY:sha-${GITHUB_SHA::7} already exists: kept as is."
          fi

      # A nightly build only gets `nightly`. An on-demand build gets the name of its branch and,
      # unless already published, the `sha-<commit>` tag.
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: tetram76/bdtheque-${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' && steps.commit.outputs.published != 'true' }}

      # Only one `nightly` image may exist (contraintes-techniques.md): the image the new one
      # replaces is recorded here, then deleted once the tag has moved. A missing image (first
      # nightly) leaves nothing to delete; a registry error fails the job, since the replaced image
      # could not be deleted without its digest. A nightly image already built from the head of
      # `main` (revision label set by metadata-action) is kept as is: nothing new to publish.
      - name: Record the current nightly image
        id: previous
        if: github.event_name == 'schedule'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPOSITORY: tetram76/bdtheque-${{ matrix.image }}
        run: |
          digest=$(.github/scripts/registry-digest.sh "$REPOSITORY" nightly)
          if [ -z "$digest" ]; then
            echo "::notice::No nightly image yet: nothing to replace."
            exit 0
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          revision=$(docker buildx imagetools inspect "$REPOSITORY@$digest" --format '{{json .Image}}' \
            | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty')
          if [ "$revision" = "$GITHUB_SHA" ]; then
            echo "up-to-date=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$REPOSITORY:nightly is already built from $GITHUB_SHA: nothing to publish."
          fi

      - name: Build and push ${{ matrix.image }} image
        id: build
        if: steps.previous.outputs.up-to-date != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          # Without attestations the image is a single manifest, deleted in one call: an image
          # index would leave its child manifests behind, untagged.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Docker Hub registry API: only an untagged manifest can be deleted, by digest, with a token
      # holding the `delete` scope (hence a Read, Write & Delete access token).
      - name: Delete the replaced nightly image
        if: github.event_name == 'schedule' && steps.previous.outputs.up-to-date != 'true' && steps.previous.outputs.digest != '' && steps.previous.outputs.digest != steps.build.outputs.digest
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPOSITORY: tetram76/bdtheque-${{ matrix.image }}
          DIGEST: ${{ steps.previous.outputs.digest }}
        run: |
          token=$(curl -fsS -u "tetram76:$DOCKERHUB_TOKEN" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$REPOSITORY:delete" | jq -r .token)
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $token" \
            "https://registry-1.docker.io/v2/$REPOSITORY/manifests/$DIGEST")
          case "$status" in
            202) echo "Deleted $REPOSITORY@$DIGEST." ;;
            # Documented by Docker Hub: the deletion goes on in the background.
            500) echo "::warning::Deletion of $REPOSITORY@$DIGEST accepted, completed in the background." ;;
            *) echo "::error::Deletion of $REPOSITORY@$DIGEST failed (HTTP $status)."; exit 1 ;;
          esac
