name: Docker publish

# Publishes the application images to Docker Hub (account `tetram76`, see contraintes-techniques.md).
# Images are only published nightly and on demand (contraintes-techniques.md), never on each merge.
on:
  # Nightly image. Scheduled runs use the head of `main`.
  schedule:
    - cron: "17 3 * * *"
  # On-demand build of the branch chosen when the workflow is run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: tetram76
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A nightly build only gets `nightly`. An on-demand build gets the name of its branch and an
      # immutable `sha-<commit>` tag.
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: tetram76/bdtheque-${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
