name: Docker publish

# Publishes the application images to Docker Hub (account `tetram76`, see contraintes-techniques.md).
# Only commits already on `main` are published: they passed the required CI checks of their pull
# request, the Docker builds included.
on:
  push:
    branches: [main]
    tags: ["v*"]
  # Nightly image (contraintes-techniques.md). Scheduled runs use the head of `main`.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  publish:
    name: Publish Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: tetram76
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `nightly` is the nightly build; `main` follows the head of the main branch; a `vX.Y.Z`
      # tag gives `X.Y.Z` and `X.Y`; every image also gets an immutable `sha-<commit>` tag.
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: tetram76/bdtheque-${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
