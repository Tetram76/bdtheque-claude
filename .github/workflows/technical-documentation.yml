name: Technical documentation site

# Publishes the site of the technical documentation of main on GitHub Pages, at each push to main and on demand
# (gestion-projet/gouvernance/documentation-technique.md, site publié; choix-implementation/documentation-technique.md,
# site publié). It is no required check and never runs on a pull request, whose documentation the CI builds and checks.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A publication under way always completes: cancelling it could leave the deployment half done. The latest push waits
# for it, and replaces any older one still waiting.
concurrency:
  group: technical-documentation
  cancel-in-progress: false

jobs:
  # Built by the same script as the CI and the image of the validation environment, which writes the documented commit
  # at the foot of each page. This job runs the code of the repository: it can read it, nothing more.
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The SDK of the Dockerfiles (SdkVersionTests).
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.404"

      - name: Build the site
        shell: pwsh
        run: ./scripts/Build-TechnicalDocumentation.ps1 -Output "$env:RUNNER_TEMP/site"

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  # The only job with the rights of a deployment, which runs no code of the repository. The github-pages environment
  # accepts main alone (gestion-projet/depot/configuration-du-repository-github.md): a run on demand from another branch
  # builds its site without publishing it.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
