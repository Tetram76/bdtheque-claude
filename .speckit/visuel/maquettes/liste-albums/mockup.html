<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Albums — administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Baloo+2:wght@600;700;800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;family=DM+Serif+Display:ital@0;1&amp;family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&amp;family=Karla:wght@400;500;700&amp;family=Libre+Franklin:ital,wght@0,400;0,600;0,800;1,800&amp;family=Nunito:wght@400;600;700&amp;family=Rubik+Mono+One&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
/* A placeholder keeps the contrast of muted text rather than fading it with an opacity. */
input::placeholder{color:var(--placeholder);opacity:1}
/* The focus ring is drawn outside the control, over a band of the page colour: it stands out from the
   control, coloured or not, and from the surface around it. */
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 2px var(--focus-gap)}
/* Header: on a wide screen, search then actions on the logo's line; on a phone, the actions stay
   on the logo's line and the search takes the whole line below. */
.adm-search{flex:1 1 260px;max-width:400px;margin-left:auto}
/* A row of the list is a line of a table on a wide screen; on a phone, the album and its actions on
   one line, then what situates it, below. */
.al-row{display:grid;grid-template-columns:36px minmax(0,1fr) 108px 190px 170px 108px 150px;grid-template-areas:"cover main date eds col mod act";align-items:center;column-gap:14px}
.al-meta{display:contents}
.al-date{grid-area:date}.al-eds{grid-area:eds}.al-col{grid-area:col}.al-mod{grid-area:mod}
.al-act-label{display:inline}
@media (max-width: 1080px){
  .al-row{grid-template-columns:36px minmax(0,1fr) 108px 190px 170px 150px;grid-template-areas:"cover main date eds col act"}
  .al-mod{display:none}
}
@media (max-width: 760px){
  .al-head{display:none !important}
  .al-row{grid-template-columns:36px minmax(0,1fr) auto;grid-template-areas:"cover main act" "cover meta meta";row-gap:4px;align-items:start}
  .al-meta{grid-area:meta;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
  .al-act-label{display:none}
  .al-edit{width:34px;padding:0 !important;justify-content:center}
  .al-filters{grid-template-columns:repeat(2, minmax(0, 1fr)) !important}
}
@media (max-width: 640px){
  .adm-search{order:3;flex-basis:100%;max-width:none;margin-left:0}
  .adm-actions{margin-left:auto}
  .adm-consult-label,.adm-menu-label,.al-new-label{display:none}
  .adm-menu{width:38px;padding:0 !important;justify-content:center}
  .al-new{width:38px;padding:0 !important;justify-content:center}
  .adm-tag{padding:2px 8px !important;font-size:11px !important}
}
</style>
<script src="../shared/mockup.js"></script>
</head>
<body>
<div id="mockup"></div>
<template id="view">
<div style="--placeholder: {{t.muted}}; --focus: {{t.text}}; --focus-gap: {{t.bg}}; min-height: 100vh; background: {{t.bg}}; color: {{t.text}}; font-family: {{t.fb}}; font-size: 15px; line-height: 1.5">

  <header style="--placeholder: {{hdrMuted}}; --focus: {{t.hText}}; --focus-gap: {{hdrBg}}; position: sticky; top: 0; z-index: 20; background: {{hdrBg}}; color: {{t.hText}}; border-bottom: {{t.hLine}}">
    <div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 10px clamp(12px, 3vw, 24px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px">
      <a href="#" style="display: flex; align-items: center; gap: 10px; color: {{t.hText}}; text-decoration: none">
        <sc-if value="{{t.lgMark}}"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #E8604C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px">B</span></sc-if>
        <span style="display: inline-block; padding: {{t.lgPad}}; border-radius: {{t.lgR}}; background: {{t.lgBg}}; color: {{t.lgText}}; font: {{t.lgFont}}; line-height: 1.1; text-transform: {{t.lgTT}}; transform: rotate({{t.lgRot}}); box-shadow: {{t.lgSh}}; text-shadow: {{t.lgTSh}}">BDthèque<span style="color: {{t.lgDot}}">.</span></span>
      </a>
      <span class="adm-tag" style="padding: 4px 12px; border: {{t.tagB}}; border-radius: {{t.tagR}}; background: {{t.tagBg}}; color: {{t.tagText}}; font-weight: 700; font-size: 13px; text-transform: {{t.tagTT}}; letter-spacing: {{t.tagLS}}">Administration</span>
      <div class="adm-search" style="min-width: 0; display: flex; align-items: center; gap: 8px">
        <label for="find" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Retrouver une fiche</label>
        <input id="find" type="search" placeholder="Retrouver une fiche à modifier…" style="flex: 1 1 auto; min-width: 0; height: 38px; padding: 0 14px; box-sizing: border-box; border: {{t.hInB}}; border-radius: {{t.inR}}; background: {{t.hInBg}}; color: {{t.hInText}}; font: inherit">
        <button type="button" aria-label="Aide sur cette page" style="width: 38px; height: 38px; flex: none; border: {{t.helpB}}; border-radius: {{t.helpR}}; background: {{t.helpBg}}; color: {{t.helpText}}; font-family: {{t.fd}}; font-weight: 700; font-size: 18px; cursor: pointer">?</button>
      </div>
      <div class="adm-actions" style="display: flex; align-items: center; gap: 8px">
      <a href="#" aria-label="Aller à la consultation" style="display: inline-flex; align-items: center; gap: 6px; height: 38px; flex: none; padding: 0 6px; color: {{t.hText}}; font-weight: 700; font-size: 14px"><span class="adm-consult-label">Aller à la consultation</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7 M9 7h8v8"></path></svg></a>
      <button type="button" aria-label="Menu" aria-expanded="{{menuExpanded}}" aria-controls="admin-menu" onClick="{{toggleMenu}}" class="adm-menu" style="display: inline-flex; align-items: center; gap: 8px; height: 38px; flex: none; padding: 0 12px; border: {{t.hInB}}; border-radius: {{t.btnR}}; background: {{t.hInBg}}; color: {{t.hInText}}; font-family: {{t.fb}}; font-weight: 700; font-size: 14px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg><span class="adm-menu-label">Menu</span></button>
      </div>

      <sc-if value="{{menuOpen}}">
    <button type="button" tabindex="-1" aria-label="Fermer le menu" onClick="{{closeMenu}}" style="position: fixed; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: transparent; cursor: default"></button>
    <nav id="admin-menu" aria-label="Plan de l'administration" style="--focus: {{t.text}}; --focus-gap: {{panelBg}}; position: absolute; top: calc(100% + 8px); right: 24px; width: min(340px, calc(100% - 48px)); max-height: 80vh; overflow-y: auto; overscroll-behavior: contain; padding: 14px 14px 12px; border: {{panelB}}; border-radius: {{t.cR}}; background: {{panelBg}}; color: {{t.text}}; box-shadow: {{panelSh}}; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: {{t.rowB}}">
        <span style="padding-left: 10px; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: 16px; text-transform: {{t.fdTT}}">Menu</span>
        <button type="button" aria-label="Fermer le menu" onClick="{{toggleMenu}}" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: {{t.secB}}; border-radius: {{t.btnR}}; background: transparent; color: {{t.secText}}; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <sc-for list="{{menu}}" as="g">
        <div style="display: flex; flex-direction: column; gap: 1px">
          <span style="padding: 0 10px 2px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: {{t.muted}}">{{g.label}}</span>
          <sc-for list="{{g.items}}" as="m">
            <a href="#" aria-current="{{m.current}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; padding: 0 10px; font-size: 14px; border-radius: {{t.btnR}}; background: {{m.bg}}; color: {{m.fg}}; font-weight: {{m.fw}}">
              <span>{{m.label}}</span>
              <span style="font-size: 13px; font-variant-numeric: tabular-nums; opacity: .85">{{m.n}}</span>
            </a>
          </sc-for>
        </div>
      </sc-for>
      <div style="padding-top: 8px; border-top: {{t.rowB}}">
        <button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 0 10px; border: 0; border-radius: {{t.btnR}}; background: transparent; color: {{t.text}}; font-family: {{t.fb}}; font-weight: 700; font-size: 14px; text-align: left; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4 M10 8l-4 4 4 4 M6 12h10"></path></svg>Se déconnecter</button>
      </div>
    </nav>
      </sc-if>
    </div>
  </header>

  <div style="max-width: 1280px; margin: 0 auto; padding: 14px clamp(12px, 3vw, 24px) 32px; box-sizing: border-box">
    <main style="display: flex; flex-direction: column; gap: 18px">

      <div style="display: flex; flex-direction: column; gap: 6px">
        <nav aria-label="Fil d'Ariane" style="font-size: 13px; color: {{t.muted}}">
          <a href="#" style="color: {{t.link}}; font-weight: 700">Administration</a>
          <span aria-hidden="true" style="margin: 0 6px">›</span>
          <span aria-current="page">Albums</span>
        </nav>
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px">
          <div style="display: flex; align-items: baseline; gap: 12px; min-width: 0">
            <h1 style="margin: 0; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: {{t.h1size}}; line-height: 1.05; text-transform: {{t.fdTT}}; color: {{t.text}}">Albums</h1>
            <span style="font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: 20px; font-variant-numeric: tabular-nums; color: {{t.muted}}">2 847</span>
          </div>
          <a href="#" class="al-new" aria-label="Nouvel album" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 18px; box-sizing: border-box; border-radius: {{t.btnR}}; background: {{t.acc}}; color: {{t.onAcc}}; font-weight: 700; font-size: 15px; --focus-gap: {{t.bg}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span class="al-new-label">Nouvel album</span></a>
        </div>
      </div>

      <section aria-labelledby="l-albums" style="--focus-gap: {{cardBg}}; position: relative; padding: {{t.cPad}}; border: {{t.cB}}; border-top: {{t.cBT}}; border-radius: {{t.cR}}; background: {{t.cBg}}; box-shadow: {{t.cSh}}; display: flex; flex-direction: column; gap: 12px">
        <span style="display: {{t.kDisp}}; position: {{t.kPos}}; top: {{t.kTop}}; left: {{t.kLeft}}; width: max-content; padding: {{t.kPad}}; border-radius: {{t.kR}}; background: {{t.kBg}}; color: {{t.kText}}; font-family: {{t.kFont}}; font-weight: {{t.kW}}; font-size: {{t.kSize}}; letter-spacing: {{t.kLS}}; text-transform: {{t.kTT}}">{{kick}}</span>
        <h2 id="l-albums" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Liste des albums</h2>

        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
          <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Rechercher un album</label>
          <div style="flex: 1 1 280px; min-width: 0; position: relative">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 12px; color: {{t.muted}}"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M20 20l-4-4"></path></svg>
            <input id="q" type="search" value="{{query}}" placeholder="Titre de l'album ou de sa série…" style="width: 100%; height: 42px; padding: 0 14px 0 40px; box-sizing: border-box; border: {{t.inB}}; border-radius: {{t.inR}}; background: {{t.inBg}}; color: {{t.text}}; font: inherit">
          </div>
          <button type="button" aria-expanded="{{filtersExpanded}}" aria-controls="al-filters" onClick="{{toggleFilters}}" style="display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border: {{t.secB}}; border-radius: {{t.btnR}}; background: {{filtersBtnBg}}; color: {{filtersBtnFg}}; font-family: {{t.fb}}; font-weight: 700; font-size: 14px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 7v6l-4 2v-8z"></path></svg>Filtres<sc-if value="{{activeCount}}"><span style="min-width: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: {{t.acc}}; color: {{t.onAcc}}; font-size: 12px; line-height: 20px; text-align: center">{{activeCount}}</span></sc-if></button>
        </div>

        <sc-if value="{{filtersOpen}}">
          <div id="al-filters" style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border: {{t.tB}}; border-radius: {{t.tR}}; background: {{t.tBg}}">
            <div class="al-filters" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 12px">
              <sc-for list="{{filters}}" as="f">
                <label style="display: flex; flex-direction: column; gap: 3px; min-width: 0; font-weight: 700; font-size: 12px; color: {{t.muted}}">{{f.label}}
                  <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 36px; padding: 0 12px; box-sizing: border-box; border: {{t.inB}}; border-radius: {{t.inR}}; background: {{t.inBg}}; color: {{f.fg}}; font-weight: {{f.fw}}; font-size: 14px"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{f.value}}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{t.muted}}"><path d="{{f.icon}}"></path></svg></span>
                </label>
              </sc-for>
            </div>
            <p style="margin: 0; font-size: 12px; color: {{t.muted}}">Série, auteur, éditeur, collection, genre et univers se choisissent en tapant leur nom. Un univers retient aussi les albums de ses sous-univers ; genres et univers sont ceux qu'affiche l'album, les siens et ceux de sa série.</p>
          </div>
        </sc-if>

        <sc-if value="{{activeCount}}">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
            <sc-for list="{{active}}" as="a">
              <span style="display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 6px 0 12px; box-sizing: border-box; border-radius: {{t.btnR}}; background: {{t.nBg}}; color: {{t.nFg}}; font-size: 13px"><span><span style="opacity: .8">{{a.label}} :</span> <strong>{{a.value}}</strong></span><button type="button" aria-label="Retirer le filtre {{a.label}}" style="width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 50%; background: transparent; color: inherit; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span>
            </sc-for>
            <button type="button" style="padding: 0 6px; border: 0; background: transparent; color: {{t.link}}; font-family: {{t.fb}}; font-weight: 700; font-size: 13px; cursor: pointer">Tout effacer</button>
          </div>
        </sc-if>

        <div data-scroll-hint style="--hint-bg: {{cardBg}}; color: {{t.text}}">
          <nav data-scroll aria-label="Navigation par initiale" style="display: flex; gap: 2px; padding: 2px 0">
            <sc-for list="{{entries}}" as="e">
              <a href="#" aria-current="{{e.current}}" style="flex: none; min-width: {{e.w}}; height: 30px; padding: 0 6px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; border-radius: {{t.btnR}}; background: {{e.bg}}; color: {{e.fg}}; font-weight: 700; font-size: 13px">{{e.label}}</a>
            </sc-for>
          </nav>
        </div>

        <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; font-size: 13px; color: {{t.muted}}">
          <span><strong style="color: {{t.text}}">{{countLabel}}</strong> {{countDetail}}</span>
          <span>Triés par titre, la série tenant lieu de titre aux albums qui n'en ont pas</span>
        </div>

        <sc-if value="{{hasRows}}">
          <div role="table" aria-label="Albums" style="display: flex; flex-direction: column">
            <div role="row" class="al-row al-head" style="padding: 0 4px 6px; border-bottom: {{headB}}; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: {{t.muted}}">
              <span role="columnheader" style="grid-area: cover"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Couverture</span></span>
              <span role="columnheader" style="grid-area: main">Album</span>
              <span role="columnheader" class="al-date">Parution</span>
              <span role="columnheader" class="al-eds">Éditions</span>
              <span role="columnheader" class="al-col">Collection</span>
              <span role="columnheader" class="al-mod">Modifié</span>
              <span role="columnheader" style="grid-area: act; text-align: right"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></span>
            </div>
            <sc-for list="{{rows}}" as="r">
              <div role="row" class="al-row" style="padding: 8px 4px; border-bottom: {{t.rowB}}; font-size: 14px">
                <span role="cell" aria-hidden="true" style="grid-area: cover; width: 36px; height: 48px; box-sizing: border-box; border-radius: {{t.thR}}; background: {{r.coverBg}}; color: rgba(255,255,255,.88); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; font-weight: 800; font-size: 11px; overflow: hidden">{{r.mark}}</span>
                <span role="cell" style="grid-area: main; min-width: 0; display: flex; flex-direction: column">
                  <a href="#" style="font-weight: 700; color: {{t.text}}; overflow-wrap: anywhere">{{r.label}}</a>
                  <span style="font-size: 12px; color: {{t.muted}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.credits}}</span>
                </span>
                <span class="al-meta">
                  <span role="cell" class="al-date" style="font-variant-numeric: tabular-nums; color: {{r.dateFg}}">{{r.date}}</span>
                  <span role="cell" class="al-eds"><a href="#" title="Éditions de l'album" style="color: {{r.edsFg}}; text-decoration: underline; text-underline-offset: 3px">{{r.eds}}</a></span>
                  <span role="cell" class="al-col"><span style="display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border: {{r.badgeB}}; border-radius: {{t.btnR}}; background: {{r.badgeBg}}; color: {{r.badgeFg}}; font-weight: 700; font-size: 12px; white-space: nowrap"><sc-if value="{{r.intent}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4V3z"></path></svg></sc-if>{{r.badge}}</span></span>
                </span>
                <span role="cell" class="al-mod" style="font-size: 13px; color: {{t.muted}}; font-variant-numeric: tabular-nums">{{r.modified}}</span>
                <span role="cell" style="grid-area: act; position: relative; display: flex; align-items: center; justify-content: flex-end; gap: 4px">
                  <a href="#" class="al-edit" aria-label="Modifier {{r.label}}" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; box-sizing: border-box; border: {{t.secB}}; border-radius: {{t.btnR}}; color: {{t.secText}}; font-weight: 700; font-size: 13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z M13.5 6.5l4 4"></path></svg><span class="al-act-label">Modifier</span></a>
                  <button type="button" aria-label="Autres actions sur {{r.label}}" aria-haspopup="menu" aria-expanded="{{r.menuExpanded}}" onClick="{{r.toggle}}" style="width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: {{t.btnR}}; background: {{r.moreBg}}; color: {{r.moreFg}}; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
                  <sc-if value="{{r.menuOpen}}">
                    <span aria-hidden="true" onClick="{{closeRowMenu}}" style="position: fixed; inset: 0; z-index: 25; cursor: default"></span>
                    <div role="menu" aria-label="Actions sur {{r.label}}" style="--focus: {{t.text}}; --focus-gap: {{panelBg}}; position: absolute; top: calc(100% + 4px); right: 0; z-index: 26; width: 250px; padding: 6px; box-sizing: border-box; border: {{panelB}}; border-radius: {{t.tR}}; background: {{panelBg}}; box-shadow: {{panelSh}}; display: flex; flex-direction: column; gap: 1px">

  { label: 'Bécassine (Bécassine - T. 1)', mark: '1', credits: 'Caumery · Joseph Porphyre Pinchon', date: '1913', eds: [1, 1], state: 'own', cover: true, modified: '21 juil. 2026' },
  { label: 'Les Bijoux de la Castafiore (Tintin - T. 21)', mark: '21', credits: 'Hergé', date: '1963', eds: [2, 2], state: 'own', cover: true, modified: 'hier', genre: true },
  { label: 'Blacksad - Intégrale [1 à 5]', mark: 'INT', credits: 'Juan Díaz Canales · Juanjo Guarnido', date: 'oct. 2023', eds: [0, 0], state: 'intent', cover: false, modified: '8 oct. 2026' },
  { label: 'Blake et Mortimer - Hors-série 2', mark: 'HS', credits: 'Edgar P. Jacobs', date: '', eds: [0, 0], state: 'out', cover: false, modified: '2 févr. 2026' },
  { label: 'Le Bleu est une couleur chaude', mark: '', credits: 'Julie Maroh', date: 'mars 2010', eds: [1, 1], state: 'own', cover: true, modified: '14 mai 2026' },
  { label: 'Le Bout du monde (Undertaker - T. 8)', mark: '8', credits: 'Xavier Dorison · Ralph Meyer · Caroline Delabie', date: 'sept. 2026', eds: [1, 1], state: 'own', cover: false, modified: "aujourd'hui", genre: true },
  { label: 'Brüsel (Les Cités obscures - T. 4)', mark: '4', credits: 'Benoît Peeters · François Schuiten', date: '1992', eds: [1, 1], state: 'own', cover: true, modified: '30 juin 2026' },
  { label: 'Buddy Longway - Tome 2', mark: '2', credits: 'Derib', date: '1974', eds: [1, 0], state: 'intent', cover: true, modified: '9 oct. 2026', genre: true }
];

const EXAMPLES = {
  // The list as it opens on an entry of the navigation by initial.
  liste: { entry: 'B', query: '', active: [], rows: ALBUMS, count: '143 albums', detail: 'sous la lettre B', page: 'Albums 1 à 50 sur 143', pages: ['1', '2', '3'] },
  // A search narrowed by cross filters.
  filtree: {
    entry: '', query: '', rows: ALBUMS.filter((a) => a.state === 'own' && a.genre),
    active: [{ label: 'Genre', value: 'Aventure' }, { label: 'Collection', value: 'Dans la collection' }],
    count: '38 albums', detail: 'sur 2 847', page: 'Albums 1 à 38 sur 38', pages: ['1']
  },
  // A search that finds nothing.
  vide: { entry: '', query: 'Zorglub', active: [], rows: [], count: 'Aucun album', detail: 'sur 2 847', page: '', pages: [] }
};

const FILTERS = [
  ['Série', 'serie'], ['Auteur', 'auteur'], ['Éditeur', 'editeur'], ['Collection éditeur', 'collectionEditeur'],
  ['Genre', 'genre'], ['Univers', 'univers'], ['Collection', 'collection']
];
const CHEVRON = 'M6 9l6 6 6-6';
const SEARCH = 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M20 20l-4-4';

const TRASH = 'M4 7h16 M9 7V4h6v3 M6 7l1 13h10l1-13';
const MERGE = 'M6 4v5a5 5 0 0 0 5 5h1a5 5 0 0 1 5 5v1 M18 4v5a5 5 0 0 1-5 5 M3 7l3-3 3 3 M15 7l3-3 3 3';
const BLOCK ='M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M5.6 5.6l12.8 12.8';

// What deleting an album announces (fonctionnel.md § Suppression des entités): the records deleted
// with it, the associations it loses, or the references that block it, counted by kind of record.
const DIALOGS = {
  confirmation: (t) => ({
    title: 'Supprimer cet album ?', label: 'Les Bijoux de la Castafiore (Tintin - T. 21)',
    lead: "La suppression est définitive et emporte avec l'album :",
    lines: [
      { kind: 'Supprimés avec lui', what: '2 éditions, 9 visuels, 1 contribution' },
      { kind: 'Associations retirées', what: '2 genres, 1 univers' }
    ],
    note: "Les genres et l'univers restent : seul leur lien avec l'album disparaît.",
    cancel: 'Annuler', confirm: 'Supprimer définitivement', confirmBg: t.warn, confirmFg: t.onWarn, icon: TRASH, iconBg: t.warn, iconFg: t.onWarn
  }),
  // Merging two albums starts from one of them: the other one is chosen here. What the merge keeps
  // of each is still to be defined (fonctionnel.md § Structure de l'application, Administration).
  fusion: (t) => ({
    title: 'Fusionner deux albums', label: 'Barracuda - Tome 1',
    lead: 'Avec quel album fusionner celui-ci ?',
    lines: [],
    pick: {
      query: 'barracuda',
      items: [
        { label: 'Esclaves (Barracuda - T. 1)', detail: 'Jean Dufaux · Jérémy · nov. 2010 · 1 édition, possédée', checked: true },
        { label: 'Barracuda - Intégrale [1 à 3]', detail: 'Jean Dufaux · Jérémy · 2016 · aucune édition', checked: false }
      ].map((c) => ({ ...c, bd: c.checked ? '2px solid ' + t.acc : t.rowB }))
    },
    note: 'L’étape suivante présentera les deux albums côte à côte, avec ce que la fusion garde de chacun.',
    cancel: 'Annuler', confirm: 'Continuer', confirmBg: t.acc, confirmFg: t.onAcc, icon: MERGE, iconBg: t.nBg, iconFg: t.nFg
  }),
  refus: (t) => ({
    title: 'Suppression impossible', label: 'Blake et Mortimer - Hors-série 2',
    lead: "L'album est encore désigné ailleurs : la suppression est refusée tant que ce lien existe.",
    lines: [{ kind: 'Utilisé par', what: '1 recherche enregistrée, « Hors-séries à trouver »' }],
    note: 'Retirez d’abord l’album des critères de cette recherche, puis recommencez.',
    cancel: 'Fermer', confirm: null, icon: BLOCK, iconBg: t.nBg, iconFg: t.nFg
  })
};

class View extends Mockup {
  renderVals() {
    const t = THEMES[this.props.theme] ?? THEMES.violine;
    const x = EXAMPLES[this.props.exemple] ?? EXAMPLES.liste;
    const menuOpen = this.state?.menuOpen ?? (this.props.menuOpen ?? false);
    const filtersOpen = this.state?.filtersOpen ?? (this.props.filtres ?? false);
    const dialogKey = this.state?.dialog !== undefined ? this.state.dialog : this.props.dialogue;
    // The menu of a row's other actions: the « actions » setting opens it on the second row.
    const rowMenu = this.state?.rowMenu !== undefined ? this.state.rowMenu : (this.props.actions ? 1 : null);
    document.documentElement.style.overflow = menuOpen || DIALOGS[dialogKey] ? 'hidden' : '';
    // Themes without an opaque or bordered card still need one for a panel laid over the content.
    const panelBg = t.cBg === 'transparent' ? t.bg : t.cBg;
    const panelB = t.cB !== '0' ? t.cB : (t.cBT !== '0' ? t.cBT : '2px solid ' + t.line);
    const panelSh = t.hiSh !== 'none' && t.hiSh !== t.cSh ? t.hiSh : '0 18px 40px rgba(0,0,0,.28)';
    const hdrBg = t.hBg === 'transparent' ? t.bg : t.hBg;
    const cardBg = t.cBg === 'transparent' ? t.bg : t.cBg;
    const menuItem = (label, n, current) => ({
      label, n, current: current ? 'page' : 'false',
      bg: current ? t.acc : 'transparent', fg: current ? t.onAcc : t.text, fw: current ? '700' : '500'
    });
    const entry = (label, w) => {
      const current = label === (x.entry || 'Toutes');
      return { label, w, current: current ? 'page' : 'false', bg: current ? t.acc : 'transparent', fg: current ? t.onAcc : t.text };
    };
    const activeOf = (label) => x.active.find((a) => a.label === label);
    const filters = FILTERS.map(([label]) => {
      const set = activeOf(label === 'Collection' ? 'Collection' : label);
      return {
        label,
        value: set ? set.value : (label === 'Collection' ? 'Tous les albums' : 'Tous'),
        fg: set ? t.text : t.muted, fw: set ? '700' : '400',
        // A list of fixed values opens as a choice; the others are found by typing their name.
        icon: label === 'Collection' ? CHEVRON : SEARCH
      };
    });
    // Covers get a hue of their own, so that the list reads as a shelf; an album without a cover
    // shows the generic visual (fonctionnel.md § Visuel par défaut).
    const coverOf = (a, i) => (a.cover
      ? 'hsl(' + ((i * 47 + 200) % 360) + ', 42%, 36%)'
      : 'repeating-linear-gradient(135deg, rgba(127,127,127,.42) 0 6px, rgba(127,127,127,.24) 6px 12px)');
    const rows = x.rows.map((a, i) => {
      const [total, owned] = a.eds;
      return {
        ...a,
        coverBg: coverOf(a, ALBUMS.indexOf(a)),
        mark: a.cover ? a.mark : '',
        date: a.date || 'Non renseignée',
        dateFg: a.date ? t.text : t.muted,
        eds: total === 0 ? 'Aucune édition' : total + (total > 1 ? ' éditions' : ' édition') + (owned ? ', ' + owned + (owned > 1 ? ' possédées' : ' possédée') : ', aucune possédée'),
        edsFg: total === 0 ? t.muted : t.text,
        intent: a.state === 'intent',
        badge: a.state === 'own' ? 'Dans la collection' : (a.state === 'intent' ? "Intention d'achat" : 'Pas dans la collection'),
        badgeBg: a.state === 'own' ? t.nBg : 'transparent',
        badgeFg: a.state === 'own' ? t.nFg : t.text,
        badgeB: a.state === 'own' ? '2px solid transparent' : '2px dashed ' + t.line,
        modified: a.modified,
        menuOpen: rowMenu === i,
        menuExpanded: rowMenu === i ? 'true' : 'false',
        moreBg: rowMenu === i ? t.nBg : 'transparent',
        moreFg: rowMenu === i ? t.nFg : t.text,
        toggle: () => this.setState({ rowMenu: rowMenu === i ? null : i }),
        merge: () => this.setState({ rowMenu: null, dialog: 'fusion' }),
        remove: () => this.setState({ rowMenu: null, dialog: a.state === 'out' ? 'refus' : 'confirmation' })
      };
    });
    const dialog = DIALOGS[dialogKey] ? DIALOGS[dialogKey](t) : null;
    return {
      t,
      hdrBg,
      hdrMuted: t.hMuted ?? t.muted,
      cardBg,
      headB: t.rowB.replace(/^1px/, '2px'),
      menuOpen,
      menuExpanded: menuOpen ? 'true' : 'false',
      panelBg, panelB, panelSh,
      toggleMenu: () => this.setState({ menuOpen: !menuOpen }),
      closeMenu: () => this.setState({ menuOpen: false }),
      // A click anywhere outside an open row menu closes it.
      closeRowMenu: () => this.setState({ rowMenu: null }),
      kick: t.kPre ? t.kPre('Fiches') : 'Fiches',
      query: x.query,
      filtersOpen,
      filtersExpanded: filtersOpen ? 'true' : 'false',
      filtersBtnBg: filtersOpen ? t.nBg : 'transparent',
      filtersBtnFg: filtersOpen ? t.nFg : t.secText,
      toggleFilters: () => this.setState({ filtersOpen: !filtersOpen }),
      filters,
      active: x.active,
      activeCount: x.active.length || null,
      entries: [entry('Toutes', '58px'), ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ#@'.split('').map((l) => entry(l, '30px'))],
      countLabel: x.count,
      countDetail: x.detail,
      rows,
      hasRows: rows.length > 0,
      empty: rows.length === 0,
      pageLabel: x.page,
      pages: x.pages.map((p, i) => ({ label: p, current: i === 0 ? 'page' : 'false', bg: i === 0 ? t.acc : 'transparent', fg: i === 0 ? t.onAcc : t.text })),
      dialog,
      mergeIcon: MERGE,
      closeDialog: () => this.setState({ dialog: null }),
      menu: [
        { label: 'Accueil', items: [menuItem('Tableau de bord', '', false), menuItem('Nouvelle édition', '', false)] },
        { label: 'Collection', items: [menuItem('Albums', '2 847', true), menuItem('Séries', '412', false), menuItem('Éditions', '2 913', false), menuItem("Intentions d'achat", '18', false)] },
        { label: 'Auteurs et éditeurs', items: [menuItem('Auteurs', '1 106', false), menuItem('Éditeurs', '96', false)] },
        { label: 'Référentiels', items: [menuItem('Genres', '24', false), menuItem('Univers', '37', false)] },
        { label: 'Réglages', items: [menuItem('Paramétrage', '', false), menuItem('Statistiques privées', '', false)] }
      ]
    };
  }
}

Mockup.mount(View, {
  theme: { label: 'Thème', editor: 'enum', options: ['violine', 'mure', 'gazette', 'sommaire', 'festival', 'riso', 'librairie', 'vignettes'], default: 'violine' },
  exemple: { label: 'Exemple', editor: 'enum', options: ['liste', 'filtree', 'vide'], default: 'liste' },
  filtres: { label: 'Filtres ouverts', editor: 'boolean', default: false },
  actions: { label: 'Actions d’une ligne', editor: 'boolean', default: false },
  dialogue: { label: 'Dialogue', editor: 'enum', options: ['aucun', 'confirmation', 'refus', 'fusion'], default: 'aucun' },
  menuOpen: { label: 'Menu ouvert', editor: 'boolean', default: false }
});
</script>
</body>
</html>
