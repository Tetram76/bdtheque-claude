<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saisie d'une édition — administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Baloo+2:wght@600;700;800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;family=DM+Serif+Display:ital@0;1&amp;family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&amp;family=Karla:wght@400;500;700&amp;family=Libre+Franklin:ital,wght@0,400;0,600;0,800;1,800&amp;family=Nunito:wght@400;600;700&amp;family=Rubik+Mono+One&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
/* A placeholder keeps the contrast of muted text rather than fading it with an opacity. */
input::placeholder,textarea::placeholder{color:var(--placeholder);opacity:1}
/* The focus ring is drawn outside the control, over a band of the page colour: it stands out from the
   control, coloured or not, and from the surface around it. */
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 2px var(--focus-gap)}
.adm-search{flex:1 1 260px;max-width:400px;margin-left:auto}
/* The form on the left, the album's editions on the right; one column on a narrower screen. */
.sa-layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.sa-side{position:sticky;top:84px}
.sa-role{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 14px;align-items:start}
.sa-status-sm{display:none}
/* Volume numbering and publication date: two unrelated settings, in two blocks side by side. */
.sa-duo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:stretch}
@media (max-width: 1080px){
  .sa-layout{grid-template-columns:minmax(0,1fr)}
  .sa-side{position:static}
}
@media (max-width: 640px){
  .adm-search{order:3;flex-basis:100%;max-width:none;margin-left:0}
  .adm-actions{margin-left:auto}
  .adm-consult-label,.adm-menu-label,.sa-hide-sm{display:none}
  .adm-menu{width:38px;padding:0 !important;justify-content:center}
  .adm-tag{padding:2px 8px !important;font-size:11px !important}
  .sa-role{grid-template-columns:minmax(0,1fr)}
  .sa-duo{grid-template-columns:minmax(0,1fr)}
  /* The save bar keeps to one line: the status shrinks to a word. */
  .sa-status{display:none}
  .sa-status-sm{display:inline}
  .sa-bar{flex-wrap:nowrap !important}
}
</style>
<script src="../shared/mockup.js"></script>
</head>
<body>
<div id="mockup"></div>
<template id="view">
<div style="--placeholder: {{t.muted}}; --focus: {{t.text}}; --focus-gap: {{t.bg}}; min-height: 100vh; background: {{t.bg}}; color: {{t.text}}; font-family: {{t.fb}}; font-size: 15px; line-height: 1.5">

  <header style="--placeholder: {{hdrMuted}}; --focus: {{t.hText}}; --focus-gap: {{hdrBg}}; position: sticky; top: 0; z-index: 20; background: {{hdrBg}}; color: {{t.hText}}; border-bottom: {{t.hLine}}">
    <div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 10px clamp(12px, 3vw, 24px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px">
      <a href="#" style="display: flex; align-items: center; gap: 10px; color: {{t.hText}}; text-decoration: none">
        <sc-if value="{{t.lgMark}}"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #E8604C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px">B</span></sc-if>
        <span style="display: inline-block; padding: {{t.lgPad}}; border-radius: {{t.lgR}}; background: {{t.lgBg}}; color: {{t.lgText}}; font: {{t.lgFont}}; line-height: 1.1; text-transform: {{t.lgTT}}; transform: rotate({{t.lgRot}}); box-shadow: {{t.lgSh}}; text-shadow: {{t.lgTSh}}">BDthèque<span style="color: {{t.lgDot}}">.</span></span>
      </a>
      <span class="adm-tag" style="padding: 4px 12px; border: {{t.tagB}}; border-radius: {{t.tagR}}; background: {{t.tagBg}}; color: {{t.tagText}}; font-weight: 700; font-size: 13px; text-transform: {{t.tagTT}}; letter-spacing: {{t.tagLS}}">Administration</span>
      <div class="adm-search" style="min-width: 0; display: flex; align-items: center; gap: 8px">
        <label for="find" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Retrouver une fiche</label>
        <input id="find" type="search" placeholder="Retrouver une fiche à modifier…" style="flex: 1 1 auto; min-width: 0; height: 38px; padding: 0 14px; box-sizing: border-box; border: {{t.hInB}}; border-radius: {{t.inR}}; background: {{t.hInBg}}; color: {{t.hInText}}; font: inherit">
        <button type="button" aria-label="Aide sur cette page" style="width: 38px; height: 38px; flex: none; border: {{t.helpB}}; border-radius: {{t.helpR}}; background: {{t.helpBg}}; color: {{t.helpText}}; font-family: {{t.fd}}; font-weight: 700; font-size: 18px; cursor: pointer">?</button>
      </div>
      <div class="adm-actions" style="display: flex; align-items: center; gap: 8px">
      <a href="#" aria-label="Aller à la consultation" style="display: inline-flex; align-items: center; gap: 6px; height: 38px; flex: none; padding: 0 6px; color: {{t.hText}}; font-weight: 700; font-size: 14px"><span class="adm-consult-label">Aller à la consultation</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7 M9 7h8v8"></path></svg></a>
      <button type="button" aria-label="Menu" aria-expanded="{{menuExpanded}}" aria-controls="admin-menu" onClick="{{toggleMenu}}" class="adm-menu" style="display: inline-flex; align-items: center; gap: 8px; height: 38px; flex: none; padding: 0 12px; border: {{t.hInB}}; border-radius: {{t.btnR}}; background: {{t.hInBg}}; color: {{t.hInText}}; font-family: {{t.fb}}; font-weight: 700; font-size: 14px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg><span class="adm-menu-label">Menu</span></button>
      </div>

      <sc-if value="{{menuOpen}}">
    <button type="button" tabindex="-1" aria-label="Fermer le menu" onClick="{{closeMenu}}" style="position: fixed; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: transparent; cursor: default"></button>
    <nav id="admin-menu" aria-label="Plan de l'administration" style="--focus: {{t.text}}; --focus-gap: {{panelBg}}; position: absolute; top: calc(100% + 8px); right: 24px; width: min(340px, calc(100% - 48px)); max-height: 80vh; overflow-y: auto; overscroll-behavior: contain; padding: 14px 14px 12px; border: {{panelB}}; border-radius: {{t.cR}}; background: {{panelBg}}; color: {{t.text}}; box-shadow: {{panelSh}}; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: {{t.rowB}}">
        <span style="padding-left: 10px; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: 16px; text-transform: {{t.fdTT}}">Menu</span>
        <button type="button" aria-label="Fermer le menu" onClick="{{toggleMenu}}" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: {{t.secB}}; border-radius: {{t.btnR}}; background: transparent; color: {{t.secText}}; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <sc-for list="{{menu}}" as="g">
        <div style="display: flex; flex-direction: column; gap: 1px">
          <span style="padding: 0 10px 2px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: {{t.muted}}">{{g.label}}</span>
          <sc-for list="{{g.items}}" as="m">
            <a href="#" aria-current="{{m.current}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; padding: 0 10px; font-size: 14px; border-radius: {{t.btnR}}; background: {{m.bg}}; color: {{m.fg}}; font-weight: {{m.fw}}">
              <span>{{m.label}}</span>
              <span style="font-size: 13px; font-variant-numeric: tabular-nums; opacity: .85">{{m.n}}</span>
            </a>
          </sc-for>
        </div>
      </sc-for>
      <div style="padding-top: 8px; border-top: {{t.rowB}}">
        <button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 0 10px; border: 0; border-radius: {{t.btnR}}; background: transparent; color: {{t.text}}; font-family: {{t.fb}}; font-weight: 700; font-size: 14px; text-align: left; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4 M10 8l-4 4 4 4 M6 12h10"></path></svg>Se déconnecter</button>
      </div>
    </nav>
      </sc-if>
    </div>
  </header>


  <div style="max-width: 1280px; margin: 0 auto; padding: 14px clamp(12px, 3vw, 24px) 24px; box-sizing: border-box">
    <main style="display: flex; flex-direction: column; gap: 18px">

      <div style="display: flex; flex-direction: column; gap: 6px">
        <nav aria-label="Fil d'Ariane" style="font-size: 13px; color: {{t.muted}}; overflow-wrap: anywhere">
          <a href="#" style="color: {{t.link}}; font-weight: 700">Administration</a>
          <span aria-hidden="true" style="margin: 0 6px">›</span>
          <a href="#" style="color: {{t.link}}; font-weight: 700">Albums</a>
          <span aria-hidden="true" style="margin: 0 6px">›</span>
          <a href="#" style="color: {{t.link}}; font-weight: 700">{{x.album}}</a>
          <span aria-hidden="true" style="margin: 0 6px">›</span>
          <span aria-current="page">{{x.crumb}}</span>
        </nav>
        <div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 16px">
          <div style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <h1 style="margin: 0; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: {{t.h1size}}; line-height: 1.05; text-transform: {{t.fdTT}}; color: {{t.text}}">{{x.heading}}</h1>
            <span style="font-size: 14px; color: {{t.muted}}; overflow-wrap: anywhere"><span style="font-weight: 700; color: {{t.text}}">{{label}}</span> · de l'album <a href="#" style="color: {{t.link}}; font-weight: 700">{{x.album}}</a></span>
          </div>
          <sc-if value="{{x.existing}}">
            <div style="position: relative; display: flex; align-items: center; gap: 6px">
              <a href="#" style="display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; box-sizing: border-box; border: {{t.secB}}; border-radius: {{t.btnR}}; color: {{t.secText}}; font-weight: 700; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7 M9 7h8v8"></path></svg><span class="sa-hide-sm">Voir dans la consultation</span></a>
            </div>
          </sc-if>
        </div>
      </div>

      <sc-if value="{{err}}">
        <div role="alert" style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 2px {{err.style}} {{err.border}}; border-left-width: 8px; border-radius: {{t.tR}}; background: {{err.bg}}; color: {{err.fg}}">
          <span aria-hidden="true" style="width: 30px; height: 30px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: {{err.iconBg}}; color: {{err.iconFg}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{err.icon}}"></path></svg></span>
          <div style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase">{{err.kind}}</span>
            <strong style="font-size: 15px">{{err.title}}</strong>
            <span style="font-size: 14px">{{err.text}}</span>
            <sc-if value="{{err.action}}"><span style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px"><button type="button" style="height: 34px; padding: 0 14px; border: 2px solid currentColor; border-radius: {{t.btnR}}; background: transparent; color: inherit; font-family: {{t.fb}}; font-weight: 700; font-size: 13px; cursor: pointer">{{err.action}}</button><sc-if value="{{err.action2}}"><button type="button" style="height: 34px; padding: 0 14px; border: 0; border-radius: {{t.btnR}}; background: transparent; color: inherit; font-family: {{t.fb}}; font-weight: 700; font-size: 13px; text-decoration: underline; cursor: pointer">{{err.action2}}</button></sc-if></span></sc-if>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{x.prefill}}">
        <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: {{t.tR}}; background: {{t.nBg}}; color: {{t.nFg}}; font-size: 13px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M8 8h11v11H8z M5 16V5h11"></path></svg>
          <span>{{x.prefill}}</span>
        </div>
      </sc-if>

      <div class="sa-layout">
        <form style="min-width: 0; display: flex; flex-direction: column; gap: 22px" onSubmit="{{noSubmit}}">

          <section aria-labelledby="s-pub" style="{{block}}">
            <span style="{{kickStyle}}">{{k.pub}}</span>
            <h2 id="s-pub" style="{{h2}}"><span aria-hidden="true" style="{{mark}}"></span>L'édition</h2>
            <div style="{{row}}">
              <div style="{{col}} flex: 1 1 240px">
                <label for="f-pub" style="{{lbl}}">Éditeur <span aria-hidden="true" style="color: {{t.del}}">*</span></label>
                <div style="position: relative">
                  <input id="f-pub" type="text" value="{{x.publisher}}" placeholder="Taper le nom de l'éditeur…" required style="{{inp}} padding-right: 40px">
                  <span aria-hidden="true" style="position: absolute; right: 12px; top: 13px; color: {{t.muted}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="{{icons.search}}"></path></svg></span>
                </div>
              </div>
              <div style="{{col}} flex: 1 1 200px">
                <label for="f-coll" style="{{lbl}}">Collection</label>
                <div style="position: relative">
                  <input id="f-coll" type="text" value="{{x.collection}}" placeholder="Aucune" style="{{inp}} padding-right: 40px">
                  <span aria-hidden="true" style="position: absolute; right: 12px; top: 13px; color: {{t.muted}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="{{icons.search}}"></path></svg></span>
                </div>
                <span style="{{help}}">Parmi celles de l'éditeur.</span>
              </div>
            </div>
            <div style="{{row}}">
              <div style="{{col}}">
                <label for="f-year" style="{{lbl}}">Année d'édition</label>
                <input id="f-year" type="text" inputmode="numeric" maxlength="4" value="{{x.year}}" placeholder="aaaa" style="{{num}} width: 76px">
              </div>
              <div style="{{col}}">
                <label for="f-isbn" style="{{lbl}}">ISBN</label>
                <div style="position: relative; width: 210px">
                  <input id="f-isbn" type="text" inputmode="numeric" value="{{x.isbn}}" placeholder="978-…" aria-describedby="f-isbn-check" style="{{num}} width: 210px; text-align: left; padding: 0 34px 0 12px; border: {{isbnBorder}}">
                  <sc-if value="{{x.isbn}}"><span aria-hidden="true" style="position: absolute; right: 10px; top: 11px; color: {{isbnColor}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{isbnIcon}}"></path></svg></span></sc-if>
                </div>
                <sc-if value="{{x.isbn}}"><span id="f-isbn-check" style="{{help}} max-width: 210px; color: {{isbnColor}}; font-weight: {{isbnWeight}}">{{isbnText}}</span></sc-if>
              </div>
              <div style="{{col}}">
                <label for="f-cat" style="{{lbl}}">Catégorie</label>
                <span style="position: relative; display: block"><select id="f-cat" style="{{sel}} width: 180px"><sc-for list="{{lists.category}}" as="o"><option selected="{{o.selected}}">{{o.label}}</option></sc-for></select><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{chev}}"><path d="M6 9l6 6 6-6"></path></svg></span>
              </div>
            </div>
          </section>

          <section aria-labelledby="s-make" style="{{block}}">
            <span style="{{kickStyle}}">{{k.make}}</span>
            <h2 id="s-make" style="{{h2}}"><span aria-hidden="true" style="{{mark}}"></span>Fabrication</h2>
            <div style="{{row}}">
              <sc-for list="{{makeSelects}}" as="s">
                <div style="{{col}}">
                  <label for="{{s.id}}" style="{{lbl}}">{{s.label}}</label>
                  <span style="position: relative; display: block"><select id="{{s.id}}" style="{{sel}} width: {{s.w}}"><sc-for list="{{s.options}}" as="o"><option selected="{{o.selected}}">{{o.label}}</option></sc-for></select><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{chev}}"><path d="M6 9l6 6 6-6"></path></svg></span>
                </div>
              </sc-for>
              <div style="{{col}}">
                <label for="f-pages" style="{{lbl}}">Pages</label>
                <input id="f-pages" type="text" inputmode="numeric" maxlength="4" value="{{x.pages}}" style="{{num}} width: 64px">
              </div>
              <div style="{{col}} align-self: flex-end">
                <label style="{{check}}"><input type="checkbox" checked="{{x.color}}" style="{{box}}">En couleur</label>
              </div>
            </div>
            <span style="{{help}}">« — » laisse la donnée vide ; les valeurs proposées à la saisie ne sont jamais imposées.</span>
          </section>

          <sc-if value="{{x.owned}}">
            <section aria-labelledby="s-copy" style="{{block}}">
              <span style="{{kickStyle}}">{{k.copy}}</span>
              <h2 id="s-copy" style="{{h2}}"><span aria-hidden="true" style="{{mark}}"></span>L'exemplaire</h2>
              <div style="{{row}}">
                <div style="{{col}}">
                  <label for="f-mode" style="{{lbl}}">Mode d'acquisition <span aria-hidden="true" style="color: {{t.del}}">*</span></label>
                  <span style="position: relative; display: block"><select id="f-mode" required style="{{sel}} width: 150px"><sc-for list="{{lists.mode}}" as="o"><option selected="{{o.selected}}">{{o.label}}</option></sc-for></select><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{chev}}"><path d="M6 9l6 6 6-6"></path></svg></span>
                </div>
                <div style="{{col}}">
                  <label for="f-date" style="{{lbl}}">{{dateLabel}}</label>
                  <input id="f-date" type="text" inputmode="numeric" value="{{x.date}}" placeholder="jj/mm/aaaa" style="{{num}} width: 118px">
                </div>
                <div style="{{col}}">
                  <label for="f-state" style="{{lbl}}">État</label>
                  <span style="position: relative; display: block"><select id="f-state" style="{{sel}} width: 196px"><sc-for list="{{lists.state}}" as="o"><option selected="{{o.selected}}">{{o.label}}</option></sc-for></select><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{chev}}"><path d="M6 9l6 6 6-6"></path></svg></span>
                </div>
                <div style="{{col}} align-self: flex-end">
                  <div style="display: flex; align-items: center; gap: 18px; height: 38px">
                    <label style="{{check}}"><input type="checkbox" checked="{{x.used}}" style="{{box}}">D'occasion</label>
                    <label style="{{check}}"><input type="checkbox" checked="{{x.signed}}" style="{{box}}">Dédicacée</label>
                  </div>
                </div>
                <div style="{{col}}">
                  <label for="f-ref" style="{{lbl}}">Numérotation personnelle</label>
                  <input id="f-ref" type="text" value="{{x.ref}}" placeholder="Cote, rangement…" style="{{num}} width: 150px; text-align: left; padding: 0 12px">
                </div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 4px">
                <label for="f-notes" style="{{lbl}}">Notes personnelles</label>
                <textarea id="f-notes" rows="2" placeholder="Vos annotations sur cet exemplaire…" style="{{area}}">{{x.notes}}</textarea>
              </div>
            </section>

            <section aria-labelledby="s-value" style="{{block}}">
              <span style="{{kickStyle}}">{{k.value}}</span>
              <h2 id="s-value" style="{{h2}}"><span aria-hidden="true" style="{{mark}}"></span>Valeur</h2>
              <div style="{{row}}">
                <sc-for list="{{amounts}}" as="m">
                  <fieldset aria-describedby="{{m.helpId}}" style="margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                    <legend style="{{lbl}} padding: 0 0 4px">{{m.label}}</legend>
                    <div style="display: flex; align-items: center; gap: 6px">
                      <label for="{{m.id}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Montant</label>
                      <input id="{{m.id}}" type="text" inputmode="decimal" value="{{m.value}}" disabled="{{free}}" aria-invalid="{{m.invalid}}" style="{{num}} width: 100px; text-align: right; padding: 0 10px; border: {{m.border}}; opacity: {{freeOpacity}}">
                      <label for="{{m.id}}-cur" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Devise</label>

const ERRORS = {
  metier: (t) => ({
    kind: 'À corriger', title: 'Un prix doit être daté.', text: 'Saisissez la date d\'achat ou l\'année d\'édition : sans elles ni date de première publication de l\'album, le prix ne peut pas être converti en euros.',

  fonctionnelle: (t) => ({

// Uploads are processed one at a time: the others wait their turn, and a refused file says why.
const UPLOADS = {
  encours: [
    { name: 'planche-09.jpg', status: '62 %', progress: '62%' },
    { name: 'planche-10.jpg', status: 'En attente' }
  ],
  refus: [
    { name: 'scan-dos.tif', status: 'Refusé', failed: true, reason: 'Format non pris en charge : JPEG, PNG, WebP ou GIF.' },
    { name: 'planche-hd.png', status: 'Refusé', failed: true, reason: 'Fichier trop lourd : 30 Mio au plus.' }
  ]
};

class View extends Mockup {
  renderVals() {
    const t = THEMES[this.props.theme] ?? THEMES.violine;
    const x = EXAMPLES[this.props.exemple] ?? EXAMPLES.modification;
    const menuOpen = this.state?.menuOpen ?? (this.props.menuOpen ?? false);
    const visualMenu = this.state?.visualMenu !== undefined ? this.state.visualMenu : (this.props.visuelMenu ? 'Planche-1' : null);
    const errorKey = this.props.erreur;
    // The amount labels follow the mode of acquisition (fonctionnel.md § Libellés contextuels sur l'édition).
    const mode = this.props.mode === 'offerte' && x.owned && !x.creating ? 'Offerte' : x.mode;
    const isPurchase = mode === 'Achat';
    // A free edition has no value: its amounts are emptied and locked. A purchase is never free.
    const free = !isPurchase && Boolean(this.props.gratuite) && x.owned && !x.creating;
    document.documentElement.style.overflow = menuOpen ? 'hidden' : '';
    const panelBg = t.cBg === 'transparent' ? t.bg : t.cBg;
    const panelB = t.cB !== '0' ? t.cB : (t.cBT !== '0' ? t.cBT : '2px solid ' + t.line);
    const panelSh = '0 18px 40px rgba(0,0,0,.28)';
    const hdrBg = t.hBg === 'transparent' ? t.bg : t.hBg;
    const kick = (i, label) => (t.kPre ? t.kPre(i, label) : label);
    const menuItem = (label, n, current) => ({
      label, n, current: current ? 'page' : 'false',
      bg: current ? t.acc : 'transparent', fg: current ? t.onAcc : t.text, fw: current ? '700' : '500'
    });
    const err = ERRORS[errorKey] && !(errorKey === 'metier' && free) ? ERRORS[errorKey](t) : null;
    // A free edition has no amount, so no amount to date: its business error is the missing date of a priced one.
    const priceError = errorKey === 'metier' && !free;
    // The ISBN check warns without blocking: some publishers printed wrong ISBNs (fonctionnel.md § Validation de l'ISBN).
    const isbnWrong = this.props.isbn === 'incoherent' && Boolean(x.isbn);
    const isbn = isbnWrong && x.isbn ? x.isbn.slice(0, -1) + '7' : x.isbn;
    // The edition label is rebuilt as the form changes (fonctionnel.md § Libellé d'une édition).
    const label = x.publisher + (x.collection ? ' (' + x.collection + ')' : '') + (x.year ? ' [' + x.year + ']' : '') + (isbn ? ' - ISBN ' + isbn : '');
    const field = 'box-sizing: border-box; border: ' + t.inB + '; border-radius: ' + t.inR + '; background: ' + t.inBg + '; color: ' + t.text + '; font: inherit; font-size: 15px;';
    // One grid in the fixed order of types, each thumbnail marked with its type: a type with a
    // single visual does not take a line of its own.
    const visuals = VISUAL_TYPES.filter(([type]) => x.visuals[type]).flatMap(([type, abbr], g) => {
      const n = x.visuals[type];
      return Array.from({ length: n }, (_, i) => {
          const key = type + '-' + i;
          return {
            mark: abbr || 'Pl. ' + (i + 1),
            alt: type + (type === 'Planche' ? ' ' + (i + 1) : ''),
            bg: 'hsl(' + ((g * 70 + i * 23 + 200) % 360) + ', 38%, 38%)',
            menuOpen: visualMenu === key,
            expanded: visualMenu === key ? 'true' : 'false',
            toggle: () => this.setState({ visualMenu: visualMenu === key ? null : key }),
            types: VISUAL_TYPES.map(([other]) => ({ label: other, checked: other === type ? 'true' : 'false', mark: other === type ? '✓ ' : '', fw: other === type ? '700' : '500' }))
          };
        });
    });
    const visualCount = visuals.length + (visuals.length > 1 ? ' visuels' : ' visuel');
    const uploads = (UPLOADS[this.props.televersement] ?? []).map((u) => ({
      ...u,
      bd: u.failed ? '2px solid ' + t.del : (t.tB === '0' ? '2px solid ' + t.line : t.tB),
      fg: u.failed ? t.del : t.muted, fw: u.failed ? '800' : '700'
    }));
    const amount = (id, labelText, value, currency, help, invalid) => ({
      id, label: labelText, helpId: id + '-help',
      value: free ? '' : value,
      currencies: pick('currency', currency),
      invalid: invalid ? 'true' : 'false',
      border: invalid ? '2px solid ' + t.del : t.inB,
      help: invalid ? 'Sans date de référence, ce prix ne peut pas être enregistré.' : help,
      helpColor: invalid ? t.del : t.muted, helpWeight: invalid ? '700' : '400'
    });
    const barBg = t.cBg === 'transparent' ? t.bg : t.cBg;
    return {
      t, label,
      icons: ICONS,
      hdrBg, hdrMuted: t.hMuted ?? t.muted,
      menuOpen, menuExpanded: menuOpen ? 'true' : 'false',
      panelBg, panelB, panelSh,
      toggleMenu: () => this.setState({ menuOpen: !menuOpen }),
      closeMenu: () => this.setState({ menuOpen: false }),
      // A click anywhere outside an open menu closes it.
      closeVisualMenu: () => this.setState({ visualMenu: null }),
      noSubmit: (e) => e.preventDefault(),
      // The mention above a block title says what kind of data the block holds, never the title again.
      k: { pub: kick(1, 'Publication'), make: kick(2, 'Objet'), copy: kick(3, 'Possession'), value: kick(4, 'Montants'), vis: kick(5, 'Images') },
      block: 'position: relative; padding: ' + t.cPad + '; border: ' + t.cB + '; border-top: ' + t.cBT + '; border-radius: ' + t.cR + '; background: ' + t.cBg + '; box-shadow: ' + t.cSh + '; display: flex; flex-direction: column; gap: 14px; --focus-gap: ' + panelBg + ';',
      kickStyle: 'display: ' + t.kDisp + '; position: ' + t.kPos + '; top: ' + t.kTop + '; left: ' + t.kLeft + '; width: max-content; margin-bottom: -6px; padding: ' + t.kPad + '; border-radius: ' + t.kR + '; background: ' + t.kBg + '; color: ' + t.kText + '; font-family: ' + t.kFont + '; font-weight: ' + t.kW + '; font-size: ' + t.kSize + '; letter-spacing: ' + t.kLS + '; text-transform: ' + t.kTT + ';',
      h2: 'align-self: ' + (t.h2line !== '0' ? 'stretch' : 'flex-start') + '; margin: 0; display: flex; align-items: center; gap: 12px; padding: ' + t.h2pad + '; border-radius: ' + t.h2r + '; border-bottom: ' + t.h2line + '; background: ' + t.h2bg + '; color: ' + t.h2c + '; font-family: ' + t.fd + '; font-weight: ' + t.fdw + '; font-style: ' + t.h2fs + '; font-size: ' + t.h2size + '; line-height: 1.15; text-transform: ' + t.h2tt + '; text-shadow: ' + t.h2sh + ';',
      mark: 'display: ' + t.mkDisp + '; flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 6px solid #1B2350; background: #FFFFFF;',
      // Fields on a line that wraps when needed, each sized to what it holds.
      row: 'display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px 24px;',
      col: 'display: flex; flex-direction: column; gap: 4px; min-width: 0;',
      lbl: 'font-weight: 700; font-size: 13px;',
      help: 'font-size: 12px; color: ' + t.muted + ';',
      inp: field + ' width: 100%; height: 42px; padding: 0 14px;',
      num: field + ' height: 38px; padding: 0 8px; text-align: center; font-variant-numeric: tabular-nums;',
      sel: field + ' height: 38px; padding: 0 30px 0 12px; appearance: none; cursor: pointer;',
      chev: 'position: absolute; right: 11px; top: 13px; pointer-events: none;',
      area: field + ' width: 100%; padding: 10px 14px; resize: vertical; line-height: 1.5;',
      check: 'display: inline-flex; align-items: center; gap: 8px; height: 38px; font-size: 14px; cursor: pointer;',
      box: 'width: 18px; height: 18px; margin: 0; accent-color: ' + t.acc + '; cursor: pointer;',
      menuBtn: 'display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 10px; border: 0; border-radius: ' + t.btnR + '; background: transparent; color: ' + t.text + '; font-family: ' + t.fb + '; font-weight: 700; font-size: 14px; text-align: left; cursor: pointer;',
      err,
      isbnBorder: isbnWrong ? '2px solid ' + t.warn : t.inB,
      isbnColor: isbnWrong ? t.del : t.muted,
      isbnWeight: isbnWrong ? '700' : '400',
      isbnIcon: isbnWrong ? ICONS.warn : ICONS.check,
      isbnText: isbnWrong ? 'Chiffre de contrôle incohérent : vérifiez la saisie. L\'ISBN peut être enregistré tel quel.' : 'Chiffre de contrôle correct.',
      x: { ...x, isbn },
      lists: { category: pick('category', x.category), state: pick('state', x.state), mode: pick('mode', mode), visualType: pick('visualType', 'Couverture') },
      makeSelects: [
        { id: 'f-format', label: 'Format', w: '150px', options: pick('format', x.format) },
        { id: 'f-binding', label: 'Reliure', w: '130px', options: pick('binding', x.binding) },
        { id: 'f-orient', label: 'Orientation', w: '130px', options: pick('orientation', x.orientation) },
        { id: 'f-reading', label: 'Sens de lecture', w: '170px', options: pick('reading', x.reading) }
      ],
      dateLabel: isPurchase ? "Date d'achat" : "Date d'acquisition",
      amounts: [
        amount('f-price', isPurchase ? "Prix d'achat" : "Valeur d'acquisition", x.price, x.priceCur, 'Daté par la date d\'achat, à défaut l\'année d\'édition ou la première publication de l\'album.', priceError),
        amount('f-initial', 'Valeur initiale', x.initial, x.initialCur, 'Prix de vente à la parution.', false)
      ],
      free,
      freeOpacity: free ? '.55' : '1',
      isPurchase,
      freeLock: isPurchase ? '.55' : '1',
      freeHelp: isPurchase ? 'Une édition achetée n\'est jamais gratuite.' : (free ? 'Sans valeur : les montants sont vidés.' : 'Sans aucune valeur, ni montant ni estimation.'),
      visuals, visualCount,
      uploads,
      barBg,
      barB: t.cBT !== '0' ? t.cBT : '2px solid ' + t.line,
      menu: [
        { label: 'Accueil', items: [menuItem('Tableau de bord', '', false), menuItem('Nouvelle édition', '', false)] },
        { label: 'Collection', items: [menuItem('Albums', '2 847', true), menuItem('Séries', '412', false), menuItem('Éditions', '2 913', false), menuItem("Intentions d'achat", '18', false)] },
        { label: 'Auteurs et éditeurs', items: [menuItem('Auteurs', '1 106', false), menuItem('Éditeurs', '96', false)] },
        { label: 'Référentiels', items: [menuItem('Genres', '24', false), menuItem('Univers', '37', false)] },
        { label: 'Réglages', items: [menuItem('Paramétrage', '', false), menuItem('Statistiques privées', '', false)] }
      ]
    };
  }
}

Mockup.mount(View, {
  theme: { label: 'Thème', editor: 'enum', options: ['violine', 'mure', 'gazette', 'sommaire', 'festival', 'riso', 'librairie', 'vignettes'], default: 'violine' },
  exemple: { label: 'Exemple', editor: 'enum', options: ['modification', 'creation', 'nouvelleIntention', 'intention'], default: 'modification' },
  mode: { label: 'Mode d\'acquisition', editor: 'enum', options: ['achat', 'offerte'], default: 'achat' },
  gratuite: { label: 'Gratuite (mode offerte)', editor: 'boolean', default: false },
  isbn: { label: 'ISBN', editor: 'enum', options: ['valide', 'incoherent'], default: 'valide' },
  televersement: { label: 'Téléversement', editor: 'enum', options: ['aucun', 'encours', 'refus'], default: 'aucun' },
  visuelMenu: { label: 'Menu d\'un visuel', editor: 'boolean', default: false },
  erreur: { label: 'Erreur', editor: 'enum', options: ['aucune', 'metier', 'fonctionnelle', 'technique'], default: 'aucune' },
  menuOpen: { label: 'Menu ouvert', editor: 'boolean', default: false }
});
</script>
