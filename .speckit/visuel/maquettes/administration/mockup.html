<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Baloo+2:wght@600;700;800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;family=DM+Serif+Display:ital@0;1&amp;family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&amp;family=Karla:wght@400;500;700&amp;family=Libre+Franklin:ital,wght@0,400;0,600;0,800;1,800&amp;family=Nunito:wght@400;600;700&amp;family=Rubik+Mono+One&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
input::placeholder{color:inherit;opacity:.6}
:focus-visible{outline:3px solid currentColor;outline-offset:2px}
/* Header: on a wide screen, search then actions on the logo's line; on a phone, the actions stay
   on the logo's line and the search takes the whole line below. */
.adm-search{flex:1 1 260px;max-width:400px;margin-left:auto}
@media (max-width: 640px){
  .adm-search{order:3;flex-basis:100%;max-width:none;margin-left:0}
  .adm-actions{margin-left:auto}
  .adm-consult-label,.adm-menu-label{display:none}
  .adm-menu{width:38px;padding:0 !important;justify-content:center}
  .adm-tag{padding:2px 8px !important;font-size:11px !important}
}
</style>
<script src="../shared/mockup.js"></script>
</head>
<body>
<div id="mockup"></div>
<template id="view">
<div style="min-height: 100vh; background: {{t.bg}}; color: {{t.text}}; font-family: {{t.fb}}; font-size: 15px; line-height: 1.5">

  <header style="position: sticky; top: 0; z-index: 20; background: {{hdrBg}}; color: {{t.hText}}; border-bottom: {{t.hLine}}">
    <div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 10px clamp(12px, 3vw, 24px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px">
      <a href="#" style="display: flex; align-items: center; gap: 10px; color: {{t.hText}}; text-decoration: none">
        <sc-if value="{{t.lgMark}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #E8604C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px">B</span></sc-if>
        <span style="display: inline-block; padding: {{t.lgPad}}; border-radius: {{t.lgR}}; background: {{t.lgBg}}; color: {{t.lgText}}; font: {{t.lgFont}}; line-height: 1.1; text-transform: {{t.lgTT}}; transform: rotate({{t.lgRot}}); box-shadow: {{t.lgSh}}; text-shadow: {{t.lgTSh}}">BDthèque<span style="color: {{t.lgDot}}">.</span></span>
      </a>
      <span class="adm-tag" style="padding: 4px 12px; border: {{t.tagB}}; border-radius: {{t.tagR}}; background: {{t.tagBg}}; color: {{t.tagText}}; font-weight: 700; font-size: 13px; text-transform: {{t.tagTT}}; letter-spacing: {{t.tagLS}}">Administration</span>
      <div class="adm-search" style="min-width: 0; display: flex; align-items: center; gap: 8px">
        <label for="find" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Retrouver une fiche</label>
        <input id="find" type="search" placeholder="Retrouver une fiche à modifier…" style="flex: 1 1 auto; min-width: 0; height: 38px; padding: 0 14px; box-sizing: border-box; border: {{t.hInB}}; border-radius: {{t.inR}}; background: {{t.hInBg}}; color: {{t.hInText}}; font: inherit">
        <button type="button" aria-label="Aide sur cette page" style="width: 38px; height: 38px; flex: none; border: {{t.helpB}}; border-radius: {{t.helpR}}; background: {{t.helpBg}}; color: {{t.helpText}}; font-family: {{t.fd}}; font-weight: 700; font-size: 18px; cursor: pointer">?</button>
      </div>
      <div class="adm-actions" style="display: flex; align-items: center; gap: 8px">
      <a href="#" aria-label="Aller à la consultation" style="display: inline-flex; align-items: center; gap: 6px; height: 38px; flex: none; padding: 0 6px; color: {{t.hText}}; font-weight: 700; font-size: 14px"><span class="adm-consult-label">Aller à la consultation</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7 M9 7h8v8"></path></svg></a>
      <button type="button" aria-label="Menu" aria-expanded="{{menuExpanded}}" aria-controls="admin-menu" onClick="{{toggleMenu}}" class="adm-menu" style="display: inline-flex; align-items: center; gap: 8px; height: 38px; flex: none; padding: 0 12px; border: {{t.hInB}}; border-radius: {{t.btnR}}; background: {{t.hInBg}}; color: {{t.hInText}}; font-family: {{t.fb}}; font-weight: 700; font-size: 14px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg><span class="adm-menu-label">Menu</span></button>
      </div>

      <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
    <button type="button" tabindex="-1" aria-label="Fermer le menu" onClick="{{closeMenu}}" style="position: fixed; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: transparent; cursor: default"></button>
    <nav id="admin-menu" aria-label="Plan de l'administration" style="position: absolute; top: calc(100% + 8px); right: 24px; width: min(340px, calc(100% - 48px)); max-height: 80vh; overflow-y: auto; overscroll-behavior: contain; padding: 14px 14px 12px; border: {{panelB}}; border-radius: {{t.cR}}; background: {{panelBg}}; color: {{t.text}}; box-shadow: {{panelSh}}; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: {{t.rowB}}">
        <span style="padding-left: 10px; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: 16px; text-transform: {{t.fdTT}}">Menu</span>
        <button type="button" aria-label="Fermer le menu" onClick="{{toggleMenu}}" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: {{t.secB}}; border-radius: {{t.btnR}}; background: transparent; color: {{t.secText}}; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <sc-for list="{{menu}}" as="g" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; gap: 1px">
          <span style="padding: 0 10px 2px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: {{t.muted}}">{{g.label}}</span>
          <sc-for list="{{g.items}}" as="m" hint-placeholder-count="3">
            <a href="#" aria-current="{{m.current}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; padding: 0 10px; font-size: 14px; border-radius: {{t.btnR}}; background: {{m.bg}}; color: {{m.fg}}; font-weight: {{m.fw}}">
              <span>{{m.label}}</span>
              <span style="font-size: 13px; font-variant-numeric: tabular-nums; opacity: .85">{{m.n}}</span>
            </a>
          </sc-for>
        </div>
      </sc-for>
      <div style="padding-top: 8px; border-top: {{t.rowB}}">
        <button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 0 10px; border: 0; border-radius: {{t.btnR}}; background: transparent; color: {{t.text}}; font-family: {{t.fb}}; font-weight: 700; font-size: 14px; text-align: left; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4 M10 8l-4 4 4 4 M6 12h10"></path></svg>Se déconnecter</button>
      </div>
    </nav>
      </sc-if>
    </div>
  </header>

  <div style="max-width: 1280px; margin: 0 auto; padding: 16px clamp(12px, 3vw, 24px) 32px; box-sizing: border-box">
    <main style="display: flex; flex-direction: column; gap: 22px">

      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: {{t.h1size}}; line-height: 1.05; text-transform: {{t.fdTT}}; color: {{t.text}}">Administration</h1>
        <p style="margin: 0; font-size: 14px; color: {{t.muted}}">Saisir et corriger les fiches, tenir les référentiels, régler l'application.</p>
      </div>

      <section aria-labelledby="a-saisie" style="position: relative; padding: {{t.cPad}}; border: {{t.cB}}; border-top: {{t.cBT}}; border-radius: {{t.cR}}; background: {{t.cBg}}; box-shadow: {{t.hiSh}}; display: flex; flex-direction: column; gap: 12px">
        <span style="display: {{t.kDisp}}; position: {{t.kPos}}; top: {{t.kTop}}; left: {{t.kLeft}}; width: max-content; padding: {{t.kPad}}; border-radius: {{t.kR}}; background: {{t.kBg}}; color: {{t.kText}}; font-family: {{t.kFont}}; font-weight: {{t.kW}}; font-size: {{t.kSize}}; letter-spacing: {{t.kLS}}; text-transform: {{t.kTT}}">{{k.saisie}}</span>
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px">
          <h2 id="a-saisie" style="flex: {{t.h2grow}} 1 auto; margin: 0; display: flex; align-items: center; gap: 12px; padding: {{t.h2pad}}; border-radius: {{t.h2r}}; border-bottom: {{t.h2line}}; background: {{t.h2bg}}; color: {{t.h2c}}; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-style: {{t.h2fs}}; font-size: {{t.h2size}}; line-height: 1.15; text-transform: {{t.h2tt}}; text-shadow: {{t.h2sh}}"><span aria-hidden="true" style="display: {{t.mkDisp}}; flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 6px solid #1B2350; background: #FFFFFF"></span>Saisir à partir d'un ISBN</h2>
        </div>
        <form style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px">
          <label style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: 13px">ISBN de l'édition
            <input type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="978-2-205-08889-2" style="height: 42px; padding: 0 16px; box-sizing: border-box; border: {{t.inB}}; border-radius: {{t.inR}}; background: {{t.inBg}}; color: {{t.text}}; font: inherit; font-size: 16px; font-weight: 400; letter-spacing: .04em">
          </label>
          <button type="submit" style="height: 42px; padding: 0 20px; border: 0; border-radius: {{t.btnR}}; background: {{t.acc}}; color: {{t.onAcc}}; font-family: {{t.fb}}; font-weight: 700; font-size: 15px; cursor: pointer">Chercher dans les sources</button>
        </form>
        <p style="margin: 0; font-size: 13px; color: {{t.muted}}">Album, édition et visuels, série, auteurs, éditeur et collection : chaque fiche est créée ou complétée à partir du catalogue de la BnF et des autres sources, puis relue avant enregistrement.</p>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 12px; border-top: {{t.rowB}}">
          <span style="font-weight: 700; font-size: 13px; color: {{t.muted}}; margin-right: 4px">Ou créer directement :</span>
          <div style="flex: 1 1 320px; max-width: 520px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
            <sc-for list="{{creates}}" as="c" hint-placeholder-count="4">
              <a href="#" style="display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 34px; padding: 0 4px; box-sizing: border-box; border: {{t.secB}}; border-radius: {{t.btnR}}; color: {{t.secText}}; font-weight: 700; font-size: 13px; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>{{c.label}}</a>
            </sc-for>
          </div>
        </div>
      </section>

      <section aria-labelledby="a-fiches" style="position: relative; padding: {{t.cPad}}; border: {{t.cB}}; border-top: {{t.cBT}}; border-radius: {{t.cR}}; background: {{t.cBg}}; box-shadow: {{t.cSh}}; display: flex; flex-direction: column; gap: 12px">
        <span style="display: {{t.kDisp}}; position: {{t.kPos}}; top: {{t.kTop}}; left: {{t.kLeft}}; width: max-content; padding: {{t.kPad}}; border-radius: {{t.kR}}; background: {{t.kBg}}; color: {{t.kText}}; font-family: {{t.kFont}}; font-weight: {{t.kW}}; font-size: {{t.kSize}}; letter-spacing: {{t.kLS}}; text-transform: {{t.kTT}}">{{k.fiches}}</span>
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px">
          <h2 id="a-fiches" style="flex: {{t.h2grow}} 1 auto; margin: 0; display: flex; align-items: center; gap: 12px; padding: {{t.h2pad}}; border-radius: {{t.h2r}}; border-bottom: {{t.h2line}}; background: {{t.h2bg}}; color: {{t.h2c}}; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-style: {{t.h2fs}}; font-size: {{t.h2size}}; line-height: 1.15; text-transform: {{t.h2tt}}; text-shadow: {{t.h2sh}}"><span aria-hidden="true" style="display: {{t.mkDisp}}; flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 6px solid #1B2350; background: #FFFFFF"></span>Les fiches</h2>
          <span style="font-size: 13px; color: {{t.muted}}">Les éditions, leurs visuels et les intentions d'achat se saisissent depuis leur album.</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 10px">
          <sc-for list="{{entities}}" as="e" hint-placeholder-count="8">
            <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border: {{t.tB}}; border-radius: {{t.tR}}; background: {{t.tBg}}">
              <div style="display: flex; align-items: center; gap: 10px">
                <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: {{t.chipR}}; background: {{e.bg}}; color: {{e.fg}}; box-shadow: {{t.chipSh}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{e.icon}}"></path></svg></span>
                <a href="#" style="min-width: 0; font-weight: 700; font-size: 15px; line-height: 1.2; color: {{t.text}}">{{e.name}}</a>
                <span style="margin-left: auto; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums">{{e.n}}</span>
              </div>
              <span style="font-size: 12px; color: {{t.muted}}">{{e.sub}}</span>
              <div style="display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: auto; font-weight: 700; font-size: 13px">
                <a href="#" style="color: {{t.link}}">Gérer la liste</a>
                <sc-if value="{{e.hasNew}}" hint-placeholder-val="{{true}}"><a href="#" style="color: {{t.link}}">+ {{e.act}}</a></sc-if>
              </div>
            </div>
          </sc-for>
        </div>
      </section>

      <div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">
        <section aria-labelledby="a-controle" style="flex: 1 1 380px; min-width: 0; position: relative; padding: {{t.cPad}}; border: {{t.cB}}; border-top: {{t.cBT}}; border-radius: {{t.cR}}; background: {{t.cBg}}; box-shadow: {{t.cSh}}; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box">
          <span style="display: {{t.kDisp}}; position: {{t.kPos}}; top: {{t.kTop}}; left: {{t.kLeft}}; width: max-content; padding: {{t.kPad}}; border-radius: {{t.kR}}; background: {{t.kBg}}; color: {{t.kText}}; font-family: {{t.kFont}}; font-weight: {{t.kW}}; font-size: {{t.kSize}}; letter-spacing: {{t.kLS}}; text-transform: {{t.kTT}}">{{k.controle}}</span>
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px">
            <h2 id="a-controle" style="flex: {{t.h2grow}} 1 auto; margin: 0; display: flex; align-items: center; gap: 12px; padding: {{t.h2pad}}; border-radius: {{t.h2r}}; border-bottom: {{t.h2line}}; background: {{t.h2bg}}; color: {{t.h2c}}; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-style: {{t.h2fs}}; font-size: {{t.h2size}}; line-height: 1.15; text-transform: {{t.h2tt}}; text-shadow: {{t.h2sh}}"><span aria-hidden="true" style="display: {{t.mkDisp}}; flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 6px solid #1B2350; background: #FFFFFF"></span>À vérifier</h2>
          </div>
          <ul style="margin: 0; padding: 0; list-style: none">
            <sc-for list="{{checks}}" as="c" hint-placeholder-count="5">
              <li style="border-bottom: {{t.rowB}}">
                <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 38px; font-size: 14px; color: {{t.text}}">
                  <span style="flex: 1 1 auto; min-width: 0">{{c.label}}</span>
                  <span style="min-width: 42px; padding: 1px 8px; box-sizing: border-box; border-radius: {{t.btnR}}; background: {{c.bg}}; color: {{c.fg}}; font-weight: 700; font-size: 13px; text-align: center; font-variant-numeric: tabular-nums">{{c.n}}</span>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{t.muted}}"><path d="M9 6l6 6-6 6"></path></svg>
                </a>
              </li>
            </sc-for>
          </ul>
        </section>

        <section aria-labelledby="a-journal" style="flex: 1.4 1 460px; min-width: 0; position: relative; padding: {{t.cPad}}; border: {{t.cB}}; border-top: {{t.cBT}}; border-radius: {{t.cR}}; background: {{t.cBg}}; box-shadow: {{t.cSh}}; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box">
          <span style="display: {{t.kDisp}}; position: {{t.kPos}}; top: {{t.kTop}}; left: {{t.kLeft}}; width: max-content; padding: {{t.kPad}}; border-radius: {{t.kR}}; background: {{t.kBg}}; color: {{t.kText}}; font-family: {{t.kFont}}; font-weight: {{t.kW}}; font-size: {{t.kSize}}; letter-spacing: {{t.kLS}}; text-transform: {{t.kTT}}">{{k.journal}}</span>
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px">
            <h2 id="a-journal" style="flex: {{t.h2grow}} 1 auto; margin: 0; display: flex; align-items: center; gap: 12px; padding: {{t.h2pad}}; border-radius: {{t.h2r}}; border-bottom: {{t.h2line}}; background: {{t.h2bg}}; color: {{t.h2c}}; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-style: {{t.h2fs}}; font-size: {{t.h2size}}; line-height: 1.15; text-transform: {{t.h2tt}}; text-shadow: {{t.h2sh}}"><span aria-hidden="true" style="display: {{t.mkDisp}}; flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 6px solid #1B2350; background: #FFFFFF"></span>Dernières modifications</h2>
          </div>
          <ul style="margin: 0; padding: 0; list-style: none">
            <sc-for list="{{edits}}" as="d" hint-placeholder-count="6">
              <li style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 16px; padding: 6px 0; font-size: 14px; border-bottom: {{t.rowB}}">
                <span style="display: flex; flex-direction: column; min-width: 0">
                  <a href="#" style="font-weight: 700; color: {{t.text}}">{{d.label}}</a>
                  <span style="font-size: 12px; color: {{t.muted}}">{{d.type}} {{d.what}} {{d.when}}</span>
                </span>
                <a href="#" style="font-weight: 700; font-size: 14px; color: {{t.link}}">Modifier</a>
              </li>
            </sc-for>
          </ul>
        </section>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">
        <section aria-labelledby="a-reglages" style="flex: 1.4 1 460px; min-width: 0; position: relative; padding: {{t.cPad}}; border: {{t.cB}}; border-top: {{t.cBT}}; border-radius: {{t.cR}}; background: {{t.cBg}}; box-shadow: {{t.cSh}}; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box">
          <span style="display: {{t.kDisp}}; position: {{t.kPos}}; top: {{t.kTop}}; left: {{t.kLeft}}; width: max-content; padding: {{t.kPad}}; border-radius: {{t.kR}}; background: {{t.kBg}}; color: {{t.kText}}; font-family: {{t.kFont}}; font-weight: {{t.kW}}; font-size: {{t.kSize}}; letter-spacing: {{t.kLS}}; text-transform: {{t.kTT}}">{{k.reglages}}</span>
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px">
            <h2 id="a-reglages" style="flex: {{t.h2grow}} 1 auto; margin: 0; display: flex; align-items: center; gap: 12px; padding: {{t.h2pad}}; border-radius: {{t.h2r}}; border-bottom: {{t.h2line}}; background: {{t.h2bg}}; color: {{t.h2c}}; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-style: {{t.h2fs}}; font-size: {{t.h2size}}; line-height: 1.15; text-transform: {{t.h2tt}}; text-shadow: {{t.h2sh}}"><span aria-hidden="true" style="display: {{t.mkDisp}}; flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 6px solid #1B2350; background: #FFFFFF"></span>Paramétrage</h2>
          </div>
          <dl style="margin: 0">
