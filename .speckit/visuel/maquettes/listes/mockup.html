<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listes — administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Baloo+2:wght@600;700;800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;family=DM+Serif+Display:ital@0;1&amp;family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&amp;family=Karla:wght@400;500;700&amp;family=Libre+Franklin:ital,wght@0,400;0,600;0,800;1,800&amp;family=Nunito:wght@400;600;700&amp;family=Rubik+Mono+One&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
/* A placeholder keeps the contrast of muted text rather than fading it with an opacity. */
input::placeholder,textarea::placeholder{color:var(--placeholder);opacity:1}
/* The focus ring is drawn outside the control, over a band of the page colour: it stands out from the
   control, coloured or not, and from the surface around it. */
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 2px var(--focus-gap)}
.adm-search{flex:1 1 260px;max-width:400px;margin-left:auto}
/* A row is a line of a table on a wide screen, its columns declared by its entity; on a phone, the
   entry and its actions on one line, then what situates it, below. */
.lr-row{display:grid;grid-template-columns:var(--desk);align-items:center;column-gap:14px}
.lr-meta{display:contents}
.lr-cap{display:none}
.lr-act-label{display:inline}
@media (max-width: 1080px){
  .lr-hide-md{display:none !important}
  .lr-row{grid-template-columns:var(--mid)}
}
@media (max-width: 760px){
  .lr-head{display:none !important}
  .lr-row{grid-template-columns:var(--phone);row-gap:4px;align-items:start}
  .lr-thumb{grid-row:1 / span 2}
  .lr-main{grid-row:1;align-self:center}
  .lr-act{grid-row:1;grid-column:-2 / -1;align-self:center}
  .lr-cap{display:inline !important}
  .lr-meta{grid-row:2;grid-column:var(--meta-col);padding-left:var(--indent,0);display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
  .lr-hide-sm{display:none !important}
  .lr-act-label{display:none}
  .lr-edit{width:34px;padding:0 !important;justify-content:center}
  .lr-filters{grid-template-columns:repeat(2, minmax(0, 1fr)) !important}
}
@media (max-width: 640px){
  .adm-search{order:3;flex-basis:100%;max-width:none;margin-left:0}
  .adm-actions{margin-left:auto}
  .adm-consult-label,.adm-menu-label,.lr-new-label{display:none}
  .adm-menu{width:38px;padding:0 !important;justify-content:center}
  .lr-new{width:38px;padding:0 !important;justify-content:center}
  .adm-tag{padding:2px 8px !important;font-size:11px !important}
}
</style>
<script src="../shared/mockup.js"></script>
</head>
<body>
<div id="mockup"></div>
<template id="view">
<div style="--placeholder: {{t.muted}}; --focus: {{t.text}}; --focus-gap: {{t.bg}}; min-height: 100vh; background: {{t.bg}}; color: {{t.text}}; font-family: {{t.fb}}; font-size: 15px; line-height: 1.5">

  <header style="--placeholder: {{hdrMuted}}; --focus: {{t.hText}}; --focus-gap: {{hdrBg}}; position: sticky; top: 0; z-index: 20; background: {{hdrBg}}; color: {{t.hText}}; border-bottom: {{t.hLine}}">
    <div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 10px clamp(12px, 3vw, 24px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px">
      <a href="#" style="display: flex; align-items: center; gap: 10px; color: {{t.hText}}; text-decoration: none">
        <sc-if value="{{t.lgMark}}"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #E8604C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px">B</span></sc-if>
        <span style="display: inline-block; padding: {{t.lgPad}}; border-radius: {{t.lgR}}; background: {{t.lgBg}}; color: {{t.lgText}}; font: {{t.lgFont}}; line-height: 1.1; text-transform: {{t.lgTT}}; transform: rotate({{t.lgRot}}); box-shadow: {{t.lgSh}}; text-shadow: {{t.lgTSh}}">BDthèque<span style="color: {{t.lgDot}}">.</span></span>
      </a>
      <span class="adm-tag" style="padding: 4px 12px; border: {{t.tagB}}; border-radius: {{t.tagR}}; background: {{t.tagBg}}; color: {{t.tagText}}; font-weight: 700; font-size: 13px; text-transform: {{t.tagTT}}; letter-spacing: {{t.tagLS}}">Administration</span>
      <div class="adm-search" style="min-width: 0; display: flex; align-items: center; gap: 8px">
        <label for="find" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Retrouver une fiche</label>
        <input id="find" type="search" placeholder="Retrouver une fiche à modifier…" style="flex: 1 1 auto; min-width: 0; height: 38px; padding: 0 14px; box-sizing: border-box; border: {{t.hInB}}; border-radius: {{t.inR}}; background: {{t.hInBg}}; color: {{t.hInText}}; font: inherit">
        <button type="button" aria-label="Aide sur cette page" style="width: 38px; height: 38px; flex: none; border: {{t.helpB}}; border-radius: {{t.helpR}}; background: {{t.helpBg}}; color: {{t.helpText}}; font-family: {{t.fd}}; font-weight: 700; font-size: 18px; cursor: pointer">?</button>
      </div>
      <div class="adm-actions" style="display: flex; align-items: center; gap: 8px">
      <a href="#" aria-label="Aller à la consultation" style="display: inline-flex; align-items: center; gap: 6px; height: 38px; flex: none; padding: 0 6px; color: {{t.hText}}; font-weight: 700; font-size: 14px"><span class="adm-consult-label">Aller à la consultation</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7 M9 7h8v8"></path></svg></a>
      <button type="button" aria-label="Menu" aria-expanded="{{menuExpanded}}" aria-controls="admin-menu" onClick="{{toggleMenu}}" class="adm-menu" style="display: inline-flex; align-items: center; gap: 8px; height: 38px; flex: none; padding: 0 12px; border: {{t.hInB}}; border-radius: {{t.btnR}}; background: {{t.hInBg}}; color: {{t.hInText}}; font-family: {{t.fb}}; font-weight: 700; font-size: 14px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg><span class="adm-menu-label">Menu</span></button>
      </div>

      <sc-if value="{{menuOpen}}">
    <button type="button" tabindex="-1" aria-label="Fermer le menu" onClick="{{closeMenu}}" style="position: fixed; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: transparent; cursor: default"></button>
    <nav id="admin-menu" aria-label="Plan de l'administration" style="--focus: {{t.text}}; --focus-gap: {{panelBg}}; position: absolute; top: calc(100% + 8px); right: 24px; width: min(340px, calc(100% - 48px)); max-height: 80vh; overflow-y: auto; overscroll-behavior: contain; padding: 14px 14px 12px; border: {{panelB}}; border-radius: {{t.cR}}; background: {{panelBg}}; color: {{t.text}}; box-shadow: {{panelSh}}; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: {{t.rowB}}">
        <span style="padding-left: 10px; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: 16px; text-transform: {{t.fdTT}}">Menu</span>
        <button type="button" aria-label="Fermer le menu" onClick="{{toggleMenu}}" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: {{t.secB}}; border-radius: {{t.btnR}}; background: transparent; color: {{t.secText}}; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <sc-for list="{{menu}}" as="g">
        <div style="display: flex; flex-direction: column; gap: 1px">
          <span style="padding: 0 10px 2px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: {{t.muted}}">{{g.label}}</span>
          <sc-for list="{{g.items}}" as="m">
            <a href="#" aria-current="{{m.current}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; padding: 0 10px; font-size: 14px; border-radius: {{t.btnR}}; background: {{m.bg}}; color: {{m.fg}}; font-weight: {{m.fw}}">
              <span>{{m.label}}</span>
              <span style="font-size: 13px; font-variant-numeric: tabular-nums; opacity: .85">{{m.n}}</span>
            </a>
          </sc-for>
        </div>
      </sc-for>
      <div style="padding-top: 8px; border-top: {{t.rowB}}">
        <button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 0 10px; border: 0; border-radius: {{t.btnR}}; background: transparent; color: {{t.text}}; font-family: {{t.fb}}; font-weight: 700; font-size: 14px; text-align: left; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4 M10 8l-4 4 4 4 M6 12h10"></path></svg>Se déconnecter</button>
      </div>
    </nav>
      </sc-if>
    </div>
  </header>

  <div style="max-width: 1280px; margin: 0 auto; padding: 14px clamp(12px, 3vw, 24px) 32px; box-sizing: border-box">
    <main style="display: flex; flex-direction: column; gap: 18px">

      <div style="display: flex; flex-direction: column; gap: 6px">
        <nav aria-label="Fil d'Ariane" style="font-size: 13px; color: {{t.muted}}">
          <a href="#" style="color: {{t.link}}; font-weight: 700">Administration</a>
          <span aria-hidden="true" style="margin: 0 6px">›</span>
          <span aria-current="page">{{e.title}}</span>
        </nav>
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px">
          <div style="display: flex; align-items: baseline; gap: 12px; min-width: 0">
            <h1 style="margin: 0; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: {{t.h1size}}; line-height: 1.05; text-transform: {{t.fdTT}}; color: {{t.text}}">{{e.title}}</h1>
            <span style="font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: 20px; font-variant-numeric: tabular-nums; color: {{t.muted}}">{{e.total}}</span>
          </div>
          <sc-if value="{{e.create}}">
            <button type="button" class="lr-new" aria-label="{{e.create}}" onClick="{{create}}" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 18px; box-sizing: border-box; border: 0; border-radius: {{t.btnR}}; background: {{t.acc}}; color: {{t.onAcc}}; font-family: {{t.fb}}; font-weight: 700; font-size: 15px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span class="lr-new-label">{{e.create}}</span></button>
          </sc-if>
          <sc-if value="{{e.noCreate}}"><span style="font-size: 13px; color: {{t.muted}}">{{e.noCreate}}</span></sc-if>
        </div>
      </div>

      <section aria-labelledby="l-list" style="--focus-gap: {{cardBg}}; position: relative; padding: {{t.cPad}}; border: {{t.cB}}; border-top: {{t.cBT}}; border-radius: {{t.cR}}; background: {{t.cBg}}; box-shadow: {{t.cSh}}; display: flex; flex-direction: column; gap: 12px">
        <span style="display: {{t.kDisp}}; position: {{t.kPos}}; top: {{t.kTop}}; left: {{t.kLeft}}; width: max-content; padding: {{t.kPad}}; border-radius: {{t.kR}}; background: {{t.kBg}}; color: {{t.kText}}; font-family: {{t.kFont}}; font-weight: {{t.kW}}; font-size: {{t.kSize}}; letter-spacing: {{t.kLS}}; text-transform: {{t.kTT}}">{{kick}}</span>
        <h2 id="l-list" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Liste : {{e.title}}</h2>

        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
          <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Rechercher</label>
          <div style="flex: 1 1 280px; min-width: 0; position: relative">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 12px; color: {{t.muted}}"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M20 20l-4-4"></path></svg>
            <input id="q" type="search" placeholder="{{e.searchPh}}" style="width: 100%; height: 42px; padding: 0 14px 0 40px; box-sizing: border-box; border: {{t.inB}}; border-radius: {{t.inR}}; background: {{t.inBg}}; color: {{t.text}}; font: inherit">
          </div>
          <sc-if value="{{hasFilters}}">
            <button type="button" aria-expanded="{{filtersExpanded}}" aria-controls="lr-filters" onClick="{{toggleFilters}}" style="display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border: {{t.secB}}; border-radius: {{t.btnR}}; background: {{filtersBtnBg}}; color: {{filtersBtnFg}}; font-family: {{t.fb}}; font-weight: 700; font-size: 14px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 7v6l-4 2v-8z"></path></svg>Filtres</button>
          </sc-if>
        </div>

        <sc-if value="{{filtersOpen}}">
          <div id="lr-filters" style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border: {{t.tB}}; border-radius: {{t.tR}}; background: {{t.tBg}}">
            <div class="lr-filters" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 12px">
              <sc-for list="{{filters}}" as="f">
                <label style="display: flex; flex-direction: column; gap: 3px; min-width: 0; font-weight: 700; font-size: 12px; color: {{t.muted}}">{{f.label}}
                  <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 36px; padding: 0 12px; box-sizing: border-box; border: {{t.inB}}; border-radius: {{t.inR}}; background: {{t.inBg}}; color: {{t.muted}}; font-weight: 400; font-size: 14px"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{f.value}}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{f.icon}}"></path></svg></span>
                </label>
              </sc-for>
            </div>
            <sc-if value="{{e.filtersHelp}}"><p style="margin: 0; font-size: 12px; color: {{t.muted}}">{{e.filtersHelp}}</p></sc-if>
          </div>
        </sc-if>

        <sc-if value="{{e.initials}}">
          <div data-scroll-hint style="--hint-bg: {{cardBg}}; color: {{t.text}}">
            <nav data-scroll aria-label="Navigation par initiale" style="display: flex; gap: 2px; padding: 2px 0">
              <sc-for list="{{entries}}" as="n">
                <a href="#" aria-current="{{n.current}}" style="flex: none; min-width: {{n.w}}; height: 30px; padding: 0 6px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; border-radius: {{t.btnR}}; background: {{n.bg}}; color: {{n.fg}}; font-weight: 700; font-size: 13px">{{n.label}}</a>
              </sc-for>
            </nav>
          </div>
        </sc-if>

        <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; font-size: 13px; color: {{t.muted}}">
          <span><strong style="color: {{t.text}}">{{e.count}}</strong> {{e.countDetail}}</span>
          <span>{{e.order}}</span>
        </div>

        <sc-if value="{{newOpen}}">
          <form onSubmit="{{noSubmit}}" style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border: 2px dashed {{inlineNewB}}; border-radius: {{t.tR}}">
            <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
              <label for="lr-new" style="font-weight: 700; font-size: 13px">{{e.inlineNew}}</label>
              <input id="lr-new" type="text" value="{{newValue}}" placeholder="Libellé" aria-invalid="{{newInvalid}}" style="width: 240px; max-width: 100%; height: 36px; padding: 0 12px; box-sizing: border-box; border: {{newBorder}}; border-radius: {{t.inR}}; background: {{t.inBg}}; color: {{t.text}}; font: inherit">
              <button type="submit" style="height: 36px; padding: 0 14px; border: 0; border-radius: {{t.btnR}}; background: {{t.acc}}; color: {{t.onAcc}}; font-family: {{t.fb}}; font-weight: 700; font-size: 13px; cursor: pointer">Ajouter</button>
              <button type="button" onClick="{{closeNew}}" style="height: 36px; padding: 0 10px; border: 0; background: transparent; color: {{t.link}}; font-family: {{t.fb}}; font-weight: 700; font-size: 13px; cursor: pointer">Annuler</button>
            </span>
            <sc-if value="{{newError}}"><span style="font-weight: 700; font-size: 13px; color: {{t.del}}">{{newError}}</span></sc-if>
          </form>
        </sc-if>

        <div role="table" aria-label="{{e.title}}" style="display: flex; flex-direction: column">
          <div role="row" class="lr-row lr-head" style="--desk: {{e.desk}}; --mid: {{e.mid}}; padding: 0 4px 6px; border-bottom: {{headB}}; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: {{t.muted}}">
            <sc-if value="{{e.thumb}}"><span role="columnheader"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Visuel</span></span></sc-if>
            <span role="columnheader">{{e.mainHead}}</span>
            <sc-for list="{{e.cols}}" as="c"><span role="columnheader" class="{{c.cls}}">{{c.label}}</span></sc-for>
            <span role="columnheader" style="text-align: right"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></span>
          </div>
          <sc-for list="{{rows}}" as="r">
            <div role="row" class="lr-row" style="--desk: {{e.desk}}; --mid: {{e.mid}}; --phone: {{e.phone}}; --meta-col: {{e.metaCol}}; --indent: {{r.metaIndent}}; padding: 8px 4px; border-bottom: {{t.rowB}}; font-size: 14px; background: {{r.rowBg}}">
              <sc-if value="{{e.thumb}}">
                <span role="cell" aria-hidden="true" class="lr-thumb" style="position: relative; width: 36px; height: {{r.thumbH}}; box-sizing: border-box; border-radius: {{r.thumbR}}; background: {{r.thumbBg}}; color: {{r.thumbFg}}; display: flex; align-items: {{r.thumbAlign}}; justify-content: center; padding-bottom: {{r.thumbPad}}; font-family: {{t.fd}}; font-weight: 800; font-size: {{r.thumbSize}}; overflow: visible; box-shadow: {{r.thumbSh}}">{{r.mark}}</span>
              </sc-if>
              <span role="cell" class="lr-main" style="min-width: 0; display: flex; flex-direction: column; padding-left: {{r.indent}}">
                <sc-if value="{{r.editing}}">
                  <label for="lr-edit-{{r.id}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Libellé</label>
                  <input id="lr-edit-{{r.id}}" type="text" value="{{r.title}}" style="width: 240px; max-width: 100%; height: 34px; padding: 0 12px; box-sizing: border-box; border: {{t.inB}}; border-radius: {{t.inR}}; background: {{t.inBg}}; color: {{t.text}}; font: inherit; font-weight: 700">
                </sc-if>
                <sc-if value="{{r.reading}}">
                  <span style="display: flex; align-items: baseline; gap: 6px; min-width: 0"><sc-if value="{{r.branch}}"><span aria-hidden="true" style="flex: none; color: {{t.muted}}">└</span></sc-if><a href="#" onClick="{{r.open}}" style="min-width: 0; font-weight: 700; color: {{t.text}}; overflow-wrap: anywhere">{{r.title}}</a></span>
                </sc-if>
                <sc-if value="{{r.sub}}"><span style="font-size: 12px; color: {{t.muted}}; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.sub}}</span></sc-if>
              </span>
              <span class="lr-meta">
                <sc-for list="{{r.cells}}" as="c">
                  <span role="cell" class="{{c.cls}}" style="min-width: 0; font-size: 13px; color: {{c.fg}}; font-variant-numeric: tabular-nums">
                    <sc-if value="{{c.badge}}"><span style="display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border: {{c.badgeB}}; border-radius: {{t.btnR}}; background: {{c.badgeBg}}; color: {{c.badgeFg}}; font-weight: 700; font-size: 12px; white-space: nowrap"><sc-if value="{{c.intent}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4V3z"></path></svg></sc-if>{{c.badge}}</span></sc-if>
                    <sc-if value="{{c.link}}"><a href="#" style="color: {{t.link}}; font-weight: 700; overflow-wrap: anywhere">{{c.link}}</a></sc-if>
                    <sc-if value="{{c.text}}"><span><sc-if value="{{c.cap}}"><span class="lr-cap" style="color: {{t.muted}}">{{c.cap}} </span></sc-if>{{c.text}}</span></sc-if>
                  </span>
                </sc-for>
              </span>
              <span role="cell" class="lr-act" style="position: relative; display: flex; align-items: center; justify-content: flex-end; gap: 4px">
                <sc-if value="{{r.editing}}">
                  <button type="button" style="height: 34px; padding: 0 12px; border: 0; border-radius: {{t.btnR}}; background: {{t.acc}}; color: {{t.onAcc}}; font-family: {{t.fb}}; font-weight: 700; font-size: 13px; cursor: pointer">Enregistrer</button>
                  <button type="button" onClick="{{r.cancel}}" style="height: 34px; padding: 0 10px; border: 0; background: transparent; color: {{t.link}}; font-family: {{t.fb}}; font-weight: 700; font-size: 13px; cursor: pointer">Annuler</button>
                </sc-if>
