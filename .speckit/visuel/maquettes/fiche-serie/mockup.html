<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche de série</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Baloo+2:wght@600;700;800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;family=DM+Serif+Display:ital@0;1&amp;family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&amp;family=Karla:wght@400;500;700&amp;family=Libre+Franklin:ital,wght@0,400;0,600;0,800;1,800&amp;family=Nunito:wght@400;600;700&amp;family=Rubik+Mono+One&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
input::placeholder{color:inherit}
:focus-visible{outline:3px solid currentColor;outline-offset:2px}
summary{cursor:pointer}
</style>
<script src="../shared/mockup.js"></script>
<script src="../shared/bubble-tails.js"></script>
</head>
<body>
<div id="mockup"></div>
<template id="view">
<div style="min-height: 100vh; background: {{t.bg}}; color: {{t.text}}; font-family: {{t.fb}}; font-size: 15px; line-height: 1.5">

  <header style="position: sticky; top: 0; z-index: 20; background: {{hintBg}}; color: {{t.hText}}; border-bottom: {{t.hLine}}">
    <div style="max-width: 1280px; margin: 0 auto; padding: 10px clamp(12px, 3vw, 24px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px">
      <a href="#" style="display: flex; align-items: center; gap: 10px; color: {{t.hText}}; text-decoration: none">
        <sc-if value="{{t.lgMark}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #E8604C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px">B</span></sc-if>
        <span style="display: inline-block; padding: {{t.lgPad}}; border-radius: {{t.lgR}}; background: {{t.lgBg}}; color: {{t.lgText}}; font: {{t.lgFont}}; line-height: 1.1; text-transform: {{t.lgTT}}; transform: rotate({{t.lgRot}}); box-shadow: {{t.lgSh}}; text-shadow: {{t.lgTSh}}">BDthèque<span style="color: {{t.lgDot}}">.</span></span>
      </a>
      <nav aria-label="Navigation principale" data-scroll-hint="" style="flex: 999 1 220px; --hint-bg: {{hintBg}}">
        <ul data-scroll="" style="margin: 0; padding: 0; list-style: none; display: flex; gap: 4px; white-space: nowrap">
          <sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
            <li style="flex: none"><a href="#" aria-current="{{n.current}}" style="display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: {{t.btnR}}; background: {{n.bg}}; color: {{n.fg}}; font-weight: 700; font-size: 14px; text-transform: {{t.navTT}}; text-decoration: {{n.deco}}; text-decoration-color: {{t.navLine}}; text-decoration-thickness: 3px; text-underline-offset: 6px">{{n.label}}</a></li>
          </sc-for>
        </ul>
      </nav>
      <div style="flex: 1 1 260px; max-width: 380px; min-width: 0; margin-left: auto; display: flex; justify-content: flex-end; align-items: center; gap: 8px">
        <label for="find" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Rechercher</label>
        <input id="find" type="search" placeholder="Un album, une série, un auteur…" style="flex: 1 1 220px; max-width: 320px; min-width: 0; height: 38px; padding: 0 14px; box-sizing: border-box; border: {{t.hInB}}; border-radius: {{t.inR}}; background: {{t.hInBg}}; color: {{t.hInText}}; font: inherit">
        <button type="button" aria-label="Aide sur cette page" style="width: 38px; height: 38px; flex: none; border: {{t.helpB}}; border-radius: {{t.helpR}}; background: {{t.helpBg}}; color: {{t.helpText}}; font-family: {{t.fd}}; font-weight: 700; font-size: 18px; cursor: pointer">?</button>
      </div>
    </div>
  </header>

  <div style="max-width: 1280px; margin: 0 auto; padding: 14px clamp(12px, 3vw, 24px) 32px; box-sizing: border-box">
    <nav aria-label="Fil d'Ariane" style="margin-bottom: 12px; font-size: 13px; color: {{t.muted}}">
      <a href="#" style="color: {{t.link}}; font-weight: 700">Séries</a> <span aria-hidden="true">›</span> <span>{{s.title}}</span>
    </nav>

    <main style="display: flex; flex-direction: column; gap: 22px">

      <div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 32px">

        <div aria-hidden="true" style="flex: 0 1 180px; min-width: 0; margin: 0 auto; display: flex; justify-content: center; padding: 6px 0 4px">
          <div style="position: relative; width: 152px; height: 196px">
            <sc-for list="{{stack}}" as="c" hint-placeholder-count="3">
              <div style="position: absolute; left: {{c.left}}; top: {{c.top}}; width: 124px; box-sizing: border-box; padding: {{t.cvPad}}; border: {{t.cvB}}; border-radius: {{t.cvR}}; background: {{t.cvBg}}; box-shadow: {{t.cvSh}}; transform: rotate({{c.rot}})">
                <div style="aspect-ratio: 3 / 4; border-radius: {{t.imgR}}; background: {{c.bg}}; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; box-sizing: border-box; font-family: Georgia, serif">
                  <span style="font-weight: 700; font-size: 11px; line-height: 1.1">{{c.title}}</span>
                  <span style="align-self: flex-end; font-size: 22px; font-weight: 700">{{c.label}}</span>
                </div>
              </div>
            </sc-for>
            <sc-if value="{{t.tape}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 2px; left: 50%; width: 64px; height: 18px; margin-left: -22px; background: rgba(255,232,0,.75); transform: rotate(-4deg)"></span></sc-if>
            <sc-if value="{{t.shelf}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: -10px; right: -10px; bottom: 0; height: 14px; background: #5B3A24; box-shadow: 0 4px 0 #3F2818"></span></sc-if>
          </div>
        </div>

        <div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: {{t.muted}}">Série</span>
            <h1 style="margin: 0; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: {{t.h1size}}; line-height: 1.05; text-transform: {{t.fdTT}}; color: {{t.text}}">{{s.title}}</h1>
          </div>

          <ul aria-label="En bref" style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{facts}}" as="f" hint-placeholder-count="3">
              <li style="display: inline-flex; align-items: center; min-height: 26px; padding: 0 11px; box-sizing: border-box; border: {{f.bd}}; border-radius: {{t.btnR}}; background: {{f.bg}}; color: {{f.fg}}; font-weight: 700; font-size: 13px">{{f.label}}</li>
            </sc-for>
          </ul>

          <div style="display: flex; flex-direction: column; gap: 8px; max-width: 560px">
            <span style="font-weight: 700">{{owned.label}}</span>
            <sc-if value="{{owned.hasBar}}" hint-placeholder-val="{{true}}"><span role="img" aria-label="{{owned.label}}" style="display: block; height: 10px; border-radius: {{t.btnR}}; background: {{owned.track}}; overflow: hidden">
              <span style="display: block; height: 100%; width: {{owned.pct}}; background: {{t.colBg}}"></span>
            </span></sc-if>
          </div>

          <dl style="margin: 0; display: flex; flex-wrap: wrap; gap: 4px 32px">
            <div style="display: flex; gap: 10px; align-items: baseline">
              <dt style="font-weight: 700">Éditeur</dt>
              <dd style="margin: 0"><sc-if value="{{s.publisherLink}}" hint-placeholder-val="{{true}}"><a href="{{s.publisherUrl}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: {{t.link}}">{{s.publisher}}<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="site externe" role="img"><path d="M7 17L17 7 M9 7h8v8"></path></svg></a></sc-if><sc-if value="{{s.publisherText}}" hint-placeholder-val="{{false}}"><span style="font-weight: 700">{{s.publisher}}</span></sc-if><sc-if value="{{s.noPublisher}}" hint-placeholder-val="{{false}}"><span style="color: {{t.muted}}">Non renseigné</span></sc-if></dd>
            </div>
            <div style="display: flex; gap: 10px; align-items: baseline">
              <dt style="font-weight: 700">Collection</dt>
              <dd style="margin: 0"><sc-if value="{{s.hasCollection}}" hint-placeholder-val="{{true}}"><span style="font-weight: 700">{{s.collection}}</span></sc-if><sc-if value="{{s.noCollection}}" hint-placeholder-val="{{false}}"><span style="color: {{t.muted}}">Non renseignée</span></sc-if></dd>
            </div>
          </dl>

          <div style="display: flex; flex-direction: column; gap: 2px; padding: 4px 14px; border: {{t.tB}}; border-radius: {{t.tR}}; background: {{t.tBg}}">
            <span style="padding-top: 6px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: {{t.muted}}">{{creditsTotal}}</span>
            <dl style="margin: 0">
              <sc-for list="{{credits}}" as="c" hint-placeholder-count="3">
                <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 6px 0; border-bottom: {{c.rowB}}">
                  <dt style="flex: 0 0 96px; font-weight: 700">{{c.role}} <span style="font-weight: 400; color: {{t.muted}}">{{c.count}}</span></dt>
                  <dd style="flex: 1 1 220px; min-width: 0; margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px">
                    <sc-for list="{{c.shown}}" as="p" hint-placeholder-count="6"><a href="#" style="display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; box-sizing: border-box; border: 1px solid {{t.line}}; border-radius: {{t.btnR}}; color: {{t.text}}; font-weight: 700; font-size: 13px">{{p.name}}</a></sc-for>
                    <sc-if value="{{c.none}}" hint-placeholder-val="{{false}}"><span style="color: {{t.muted}}">Non crédité</span></sc-if>
                    <sc-if value="{{c.more}}" hint-placeholder-val="{{false}}"><button type="button" aria-expanded="{{c.expanded}}" onClick="{{c.toggle}}" style="min-height: 26px; padding: 0 8px; border: 0; background: transparent; color: {{t.link}}; font-family: {{t.fb}}; font-weight: 700; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">{{c.moreLabel}}</button></sc-if>
                  </dd>
                </div>
              </sc-for>
            </dl>
          </div>

          <dl style="margin: 0; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px">
              <dt style="min-width: 80px; font-weight: 700">Genres</dt>
              <dd style="margin: 0; display: flex; flex-wrap: wrap; gap: 8px">
                <sc-if value="{{noGenre}}" hint-placeholder-val="{{false}}"><span style="min-height: 26px; display: flex; align-items: center; color: {{t.muted}}">Aucun genre</span></sc-if>
                <sc-for list="{{genres}}" as="g" hint-placeholder-count="2"><a href="#" style="display: inline-flex; align-items: center; min-height: 26px; padding: 0 11px; border-radius: {{t.chipR}}; background: {{g.bg}}; color: {{g.fg}}; font-weight: 700; font-size: 13px">{{g.label}}</a></sc-for>
              </dd>
            </div>
            <div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 14px">
              <dt style="min-width: 80px; min-height: 26px; display: flex; align-items: center; font-weight: 700">Univers</dt>
              <dd style="margin: 0; display: flex; flex-direction: column; gap: 8px">
                <sc-if value="{{noUniverse}}" hint-placeholder-val="{{false}}"><span style="min-height: 26px; display: flex; align-items: center; color: {{t.muted}}">Aucun univers</span></sc-if>
                <sc-for list="{{universes}}" as="u" hint-placeholder-count="1">
                  <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px">
                    <sc-for list="{{u.path}}" as="p" hint-placeholder-count="2">
                      <sc-if value="{{p.sep}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="color: {{t.muted}}">›</span></sc-if>
                      <sc-if value="{{p.leaf}}" hint-placeholder-val="{{true}}"><a href="#" style="display: inline-flex; align-items: center; min-height: 26px; padding: 0 11px; border-radius: {{t.chipR}}; background: {{u.bg}}; color: {{u.fg}}; font-weight: 700; font-size: 13px">{{p.name}}</a></sc-if>
                      <sc-if value="{{p.parent}}" hint-placeholder-val="{{false}}"><a href="#" style="display: inline-flex; align-items: center; min-height: 26px; color: {{t.muted}}; font-weight: 700; font-size: 13px">{{p.name}}</a></sc-if>
                    </sc-for>
                  </span>
                </sc-for>
              </dd>
            </div>
          </dl>
        </div>
      </div>

      <section aria-labelledby="s-recit" style="position: relative; margin-top: {{t.cTop}}; padding: {{t.cPad}}; border: {{t.cB}}; border-top: {{t.cBT}}; border-radius: {{t.cR}}; background: {{t.cBg}}; box-shadow: {{t.cSh}}; display: flex; flex-direction: column; gap: 12px">
        <span style="display: {{t.kDisp}}; position: {{t.kPos}}; top: {{t.kTop}}; left: {{t.kLeft}}; width: max-content; padding: {{t.kPad}}; border-radius: {{t.kR}}; background: {{t.kBg}}; color: {{t.kText}}; font-family: {{t.kFont}}; font-weight: {{t.kW}}; font-size: {{t.kSize}}; letter-spacing: {{t.kLS}}; text-transform: {{t.kTT}}">{{k.recit}}</span>
        <h2 id="s-recit" style="position: relative; align-self: flex-start; margin: {{t.h2lift}} 0 0; display: flex; align-items: center; gap: 12px; padding: {{t.h2pad}}; border-radius: {{t.h2r}}; border-bottom: {{t.h2line}}; background: {{t.h2bg}}; color: {{t.h2c}}; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-style: {{t.h2fs}}; font-size: {{t.h2size}}; line-height: 1.15; text-transform: {{t.h2tt}}; text-shadow: {{t.h2sh}}; transform: rotate({{t.h2rot}})"><span aria-hidden="true" style="display: {{t.mkDisp}}; flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 6px solid #1B2350; background: #FFFFFF"></span>De quoi ça parle ?<sc-if value="{{t.tail}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" data-tail="" style="position: absolute; left: 26px; bottom: -8px; width: 16px; height: 16px; border-radius: 0 0 14px 0; transform: skewX(-25deg); background: {{t.h2bg}}"></span></sc-if></h2>
        <p style="margin: 0; max-width: 80ch; font-size: 15px; color: {{s.summaryColor}}">{{s.summary}}</p>
        <div style="display: flex; flex-direction: column; gap: 2px; max-width: 80ch; padding-top: 10px; border-top: {{t.rowB}}">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: {{t.muted}}">Notes personnelles</span>
          <p style="margin: 0; color: {{s.notesColor}}">{{s.notes}}</p>
        </div>
      </section>

      <section aria-labelledby="s-albums" style="position: relative; margin-top: {{t.cTop}}; padding: {{t.cPad}}; border: {{t.cB}}; border-top: {{t.cBT}}; border-radius: {{t.cR}}; background: {{t.cBg}}; box-shadow: {{t.cSh}}; display: flex; flex-direction: column; gap: 14px">
        <span style="display: {{t.kDisp}}; position: {{t.kPos}}; top: {{t.kTop}}; left: {{t.kLeft}}; width: max-content; padding: {{t.kPad}}; border-radius: {{t.kR}}; background: {{t.kBg}}; color: {{t.kText}}; font-family: {{t.kFont}}; font-weight: {{t.kW}}; font-size: {{t.kSize}}; letter-spacing: {{t.kLS}}; text-transform: {{t.kTT}}">{{k.albums}}</span>
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: {{t.rowAlign}}; gap: 12px 16px">
          <h2 id="s-albums" style="position: relative; margin: {{t.h2lift}} 0 0; display: flex; align-items: center; gap: 12px; padding: {{t.h2pad}}; border-radius: {{t.h2r}}; border-bottom: {{t.h2line}}; background: {{t.h2bg}}; color: {{t.h2c}}; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-style: {{t.h2fs}}; font-size: {{t.h2size}}; line-height: 1.15; text-transform: {{t.h2tt}}; text-shadow: {{t.h2sh}}; transform: rotate({{t.h2rot}})"><span aria-hidden="true" style="display: {{t.mkDisp}}; flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 6px solid #1B2350; background: #FFFFFF"></span>Combien d'albums ?<sc-if value="{{t.tail}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" data-tail="" style="position: absolute; left: 26px; bottom: -8px; width: 16px; height: 16px; border-radius: 0 0 14px 0; transform: skewX(-25deg); background: {{t.h2bg}}"></span></sc-if></h2>
          <span style="font-size: 13px; color: {{t.muted}}">{{albumsSummary}}</span>
        </div>
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <h3 style="margin: 0; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: 16px; text-transform: {{t.fdTT}}">{{g.title}} <span style="font-family: {{t.fb}}; font-weight: 400; font-size: 14px; color: {{t.muted}}; text-transform: none">{{g.count}}</span></h3>
            <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100px, calc((100% - 2 * 10px) / 3)), 1fr)); gap: 14px 10px">
              <sc-for list="{{g.albums}}" as="a" hint-placeholder-count="8">
                <li style="display: flex">
                  <a href="#" aria-current="{{a.current}}" style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 3px; color: {{t.text}}">
                    <span aria-hidden="true" style="display: block; aspect-ratio: 3 / 4; border-radius: {{t.imgR}}; background: {{a.bg}}; box-shadow: {{a.coverB}}; position: relative; overflow: hidden">
                      <span style="position: absolute; left: 6px; right: 6px; bottom: 4px; text-align: right; line-height: 1.1; color: #FFFFFF; font-family: Georgia, serif; font-weight: 700; font-size: 14px">{{a.mark}}</span>
                    </span>
                    <sc-if value="{{a.hasTome}}" hint-placeholder-val="{{true}}"><span style="font-size: 12px; font-weight: 700; color: {{t.muted}}">{{a.tome}}</span></sc-if>
                    <span style="font-size: 13px; font-weight: 700; line-height: 1.2">{{a.title}}</span>
                    <sc-if value="{{a.rated}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="{{a.ratingLabel}}" style="font-size: 12px; letter-spacing: 1px; color: {{t.text}}">{{a.stars}}</span></sc-if>
                    <span style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 20px; padding: 1px 7px; box-sizing: border-box; border: {{a.badgeB}}; border-radius: {{t.btnR}}; background: {{a.badgeBg}}; color: {{a.badgeFg}}; font-weight: 700; font-size: 11px; line-height: 1.2">{{a.badge}}</span>
                  </a>
                </li>
              </sc-for>
            </ol>
          </div>
        </sc-for>
      </section>
    </main>
  </div>

  <footer style="max-width: 1280px; margin: 0 auto; padding: 12px clamp(12px, 3vw, 24px) 24px; box-sizing: border-box; font-size: 12px; color: {{t.muted}}">
    <span>{{s.meta}}</span>
  </footer>
</div>
</template>
<script>
// Shared defaults: each theme only states what its identity changes.
const BASE = {
  rowAlign: 'center',
  cTop: '0',
  h2lift: '0',
  kDisp: 'none', kPos: 'static', kTop: 'auto', kLeft: 'auto', kBg: 'transparent', kText: 'inherit', kPad: '0', kR: '0',
  kFont: 'inherit', kW: '700', kSize: '12px', kLS: '0', kTT: 'none', kPre: null,
  mkDisp: 'none', lgMark: false, lgSh: 'none', lgTSh: 'none', lgRot: '0deg', lgPad: '0', lgR: '0', lgBg: 'transparent',
  h2fs: 'normal', h2sh: 'none', h2tt: 'none', h2line: '0', h2pad: '0', h2r: '0', h2bg: 'transparent', h2rot: '0deg', tail: false,
  fdTT: 'none', navTT: 'none', navLine: 'transparent', navUnderline: false, h1size: 'clamp(24px, 3.2vw, 38px)', cSh: 'none',
  cvPad: '0', cvB: '0', cvR: '0', cvBg: 'transparent', cvSh: 'none', cvRot: '0deg', imgR: '0', tape: false, shelf: false
};

// « Cases et bulles » comes in two tints that only differ by their purple shades.
const CASES_INKS = ['#4FD1C5', '#FF7A6B', '#B69CFF', '#9BE07A', '#7FB8FF', '#F7A8D0', '#FFD166'];
const cases = (c) => ({
  ...BASE,
  bg: c.bg, text: '#FBF3EA', muted: c.muted, line: c.border,
  acc: '#FFB547', onAcc: c.bg, link: '#FFB547', colBg: '#9BE07A', colFg: c.bg,
  fd: 'Fraunces, Georgia, serif', fdw: '800', fb: "'DM Sans', system-ui, sans-serif",
  cBg: c.panel, cB: '2px solid ' + c.border, cBT: '2px solid ' + c.border, cR: '26px 16px 28px 18px', cPad: 'clamp(14px, 2.2vw, 22px)',
  tBg: c.bg, tB: '2px solid ' + c.border, tR: '18px 12px 20px 14px', rowB: '1px solid ' + c.border,
  inR: '999px', btnR: '999px', secB: '2px solid ' + c.soft, secText: '#FBF3EA', chipR: '999px',
  hBg: 'transparent', hText: '#FBF3EA', hLine: '0', hInBg: c.panel, hInB: '2px solid ' + c.border, hInText: '#FBF3EA',

class View extends Mockup {
  renderVals() {

    const unfolded = this.state?.unfolded ?? {};
    const kick = (i, label) => (t.kPre ? t.kPre(i, label) : label);
    const [navAcc, navOnAcc] = NAV_ACTIVE[key] ?? [t.acc, t.onAcc];
    const navItem = (label, current) => ({
      label,

      fg: current && !t.navUnderline ? navOnAcc : t.hText,
      deco: current && t.navUnderline ? 'underline' : 'none'
    });
    const chip = (selected) => ({
      bg: selected ? t.acc : 'transparent',
      fg: selected ? t.onAcc : t.text,
      bd: selected ? '2px solid ' + t.acc : (t.tB === '0' ? '2px solid ' + t.line : t.tB)
    });
    const ownedCount = s.albums.filter((a) => a[3] === 'own').length;
    const omnibus = s.albums.filter((a) => a[0].startsWith('INT')).length;
    const hs = s.albums.filter((a) => a[2] === 'hs').length;
    const regular = s.albums.length - omnibus - hs;
    const people = s.credits;
    const distinct = new Set(ROLES.flatMap(([role]) => people[role])).size;
    // Covers get a hue of their own, so that the grid reads as a shelf rather than a table.
    const cover = (i) => 'hsl(' + ((i * 47 + 200) % 360) + ', 42%, 36%)';
    const album = ([tome, title, kind, state, rating], i) => ({
      // An album without its own title is named by its volume alone (« Tome 3 »).
      tome: title ? tome : '',
      hasTome: Boolean(title),
      title: title || tome,
      mark: tome.replace(/^Tome /, '').replace(/^T\. /, ''),
      bg: cover(i),
      coverB: state === 'own' ? 'none' : 'inset 0 0 0 3px ' + t.bg,
      current: 'false',
      rated: rating > 0,
      stars: '★'.repeat(rating) + '☆'.repeat(5 - rating),
      ratingLabel: 'Appréciation : ' + rating + ' sur 5',
      badge: state === 'own' ? 'Dans la collection' : (state === 'intent' ? "Intention d'achat" : 'Hors collection'),

      badgeFg: state === 'own' ? t.colFg : t.text,
      badgeB: state === 'own' ? '0' : '2px dashed ' + t.line
    });
    // The pile shows the first regular volumes of the series, each with the cover it has in the grid below. It

    const firstVolumes = s.albums.map((a, i) => [a, i]).filter(([a]) => a[2] === 'tome' && !a[0].startsWith('INT')).slice(0, 3);
    const pileCard = (k) => {
      const entry = firstVolumes[k];
      if (!entry) return { bg: GENERIC_CARD, title: '', label: '' };
      const [a, i] = entry;
      return { bg: cover(i), title: s.title, label: a[0].replace(/^Tome /, '').replace(/^T\. /, '') };
    };
    const tomes = s.albums.filter((a) => a[2] === 'tome');
    const specials = s.albums.filter((a) => a[2] === 'hs');
    const groups = [];
    if (tomes.length) groups.push({ title: 'Tomes et intégrales', count: '(' + tomes.length + ')', albums: tomes.map(album) });
    if (specials.length) groups.push({ title: 'Hors-séries', count: '(' + specials.length + ')', albums: specials.map((a, i) => album(a, i + tomes.length)) });
    const parts = [];
    if (regular) parts.push(regular + (regular > 1 ? ' tomes' : ' tome'));
    if (omnibus) parts.push(omnibus + (omnibus > 1 ? ' intégrales' : ' intégrale'));
    if (hs) parts.push(hs + (hs > 1 ? ' hors-séries' : ' hors-série'));

          : { label: 'À compléter', ...chip(false) }
      ],
      // A series without any album yet has nothing to measure: it says so, without a bar.
      owned: {
        hasBar: s.albums.length > 0,
        label: s.albums.length === 0

          : ownedCount + (ownedCount > 1 ? ' albums' : ' album') + ' sur ' + s.albums.length + ' dans la collection',
        pct: s.albums.length === 0 ? '0%' : Math.round((ownedCount * 100) / s.albums.length) + '%',

      credits: ROLES.map(([role, label], r) => {
        const all = people[role];
        const open = Boolean(unfolded[role]);
        const hidden = all.length - SHOWN_PER_ROLE;
        return {
          role: label,
          count: all.length > 1 ? '(' + all.length + ')' : '',
          shown: (open ? all : all.slice(0, SHOWN_PER_ROLE)).map((name) => ({ name })),
          none: all.length === 0,
          more: hidden > 0,
          expanded: open ? 'true' : 'false',
          moreLabel: open ? 'Réduire' : 'et ' + hidden + (hidden > 1 ? ' autres' : ' autre'),
          toggle: () => this.setState({ unfolded: { ...unfolded, [role]: !open } }),
          rowB: r < ROLES.length - 1 ? t.rowB : '0'
        };
      }),
      noGenre: s.genres.length === 0,
      genres: s.genres.map((label) => ({ label, bg: t.pal[0][0], fg: t.pal[0][1] })),
      noUniverse: s.universes.length === 0,
      universes: s.universes.map((chain) => ({
        bg: t.pal[1][0], fg: t.pal[1][1],
        path: chain.map((name, i) => ({ name, sep: i > 0, leaf: i === chain.length - 1, parent: i < chain.length - 1 }))
      })),
      albumsSummary: s.albums.length === 0
        ? 'Aucun album dans cette série pour l\'instant.'
        : s.albums.length + (s.albums.length > 1 ? ' albums : ' : ' album : ') + parts.join(', '),
      groups
    };
  }
}
