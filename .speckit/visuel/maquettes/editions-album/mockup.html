<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditions et intentions d'achat d'un album — administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Baloo+2:wght@600;700;800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;family=DM+Serif+Display:ital@0;1&amp;family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&amp;family=Karla:wght@400;500;700&amp;family=Libre+Franklin:ital,wght@0,400;0,600;0,800;1,800&amp;family=Nunito:wght@400;600;700&amp;family=Rubik+Mono+One&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
/* A placeholder keeps the contrast of muted text rather than fading it with an opacity. */
input::placeholder,textarea::placeholder{color:var(--placeholder);opacity:1}
/* The focus ring is drawn outside the control, over a band of the page colour: it stands out from the
   control, coloured or not, and from the surface around it. */
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 2px var(--focus-gap)}
.adm-search{flex:1 1 260px;max-width:400px;margin-left:auto}
.sa-status-sm{display:none}
/* The album in brief, then its editions, each on a line as dense as a table row. */
.ea-album{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:start}
.ea-row{display:grid;grid-template-columns:36px minmax(0,1fr) 300px auto;grid-template-areas:"cover main meta act";align-items:center;column-gap:14px}
@media (max-width: 640px){
  .adm-search{order:3;flex-basis:100%;max-width:none;margin-left:0}
  .adm-actions{margin-left:auto}
  .adm-consult-label,.adm-menu-label,.sa-hide-sm{display:none}
  .adm-menu{width:38px;padding:0 !important;justify-content:center}
  .adm-tag{padding:2px 8px !important;font-size:11px !important}
  /* An edition on two lines: its label and actions, then its possession and detail. */
  .ea-row{grid-template-columns:36px minmax(0,1fr) auto;grid-template-areas:"cover main act" "cover meta meta";row-gap:4px;align-items:start}
  .ea-act-label{display:none}
}
</style>
<script src="../shared/mockup.js"></script>
</head>
<body>
<div id="mockup"></div>
<template id="view">
<div style="--placeholder: {{t.muted}}; --focus: {{t.text}}; --focus-gap: {{t.bg}}; min-height: 100vh; background: {{t.bg}}; color: {{t.text}}; font-family: {{t.fb}}; font-size: 15px; line-height: 1.5">

  <header style="--placeholder: {{hdrMuted}}; --focus: {{t.hText}}; --focus-gap: {{hdrBg}}; position: sticky; top: 0; z-index: 20; background: {{hdrBg}}; color: {{t.hText}}; border-bottom: {{t.hLine}}">
    <div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 10px clamp(12px, 3vw, 24px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px">
      <a href="#" style="display: flex; align-items: center; gap: 10px; color: {{t.hText}}; text-decoration: none">
        <sc-if value="{{t.lgMark}}"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #E8604C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px">B</span></sc-if>
        <span style="display: inline-block; padding: {{t.lgPad}}; border-radius: {{t.lgR}}; background: {{t.lgBg}}; color: {{t.lgText}}; font: {{t.lgFont}}; line-height: 1.1; text-transform: {{t.lgTT}}; transform: rotate({{t.lgRot}}); box-shadow: {{t.lgSh}}; text-shadow: {{t.lgTSh}}">BDthèque<span style="color: {{t.lgDot}}">.</span></span>
      </a>
      <span class="adm-tag" style="padding: 4px 12px; border: {{t.tagB}}; border-radius: {{t.tagR}}; background: {{t.tagBg}}; color: {{t.tagText}}; font-weight: 700; font-size: 13px; text-transform: {{t.tagTT}}; letter-spacing: {{t.tagLS}}">Administration</span>
      <div class="adm-search" style="min-width: 0; display: flex; align-items: center; gap: 8px">
        <label for="find" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Retrouver une fiche</label>
        <input id="find" type="search" placeholder="Retrouver une fiche à modifier…" style="flex: 1 1 auto; min-width: 0; height: 38px; padding: 0 14px; box-sizing: border-box; border: {{t.hInB}}; border-radius: {{t.inR}}; background: {{t.hInBg}}; color: {{t.hInText}}; font: inherit">
        <button type="button" aria-label="Aide sur cette page" style="width: 38px; height: 38px; flex: none; border: {{t.helpB}}; border-radius: {{t.helpR}}; background: {{t.helpBg}}; color: {{t.helpText}}; font-family: {{t.fd}}; font-weight: 700; font-size: 18px; cursor: pointer">?</button>
      </div>
      <div class="adm-actions" style="display: flex; align-items: center; gap: 8px">
      <a href="#" aria-label="Aller à la consultation" style="display: inline-flex; align-items: center; gap: 6px; height: 38px; flex: none; padding: 0 6px; color: {{t.hText}}; font-weight: 700; font-size: 14px"><span class="adm-consult-label">Aller à la consultation</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7 M9 7h8v8"></path></svg></a>
      <button type="button" aria-label="Menu" aria-expanded="{{menuExpanded}}" aria-controls="admin-menu" onClick="{{toggleMenu}}" class="adm-menu" style="display: inline-flex; align-items: center; gap: 8px; height: 38px; flex: none; padding: 0 12px; border: {{t.hInB}}; border-radius: {{t.btnR}}; background: {{t.hInBg}}; color: {{t.hInText}}; font-family: {{t.fb}}; font-weight: 700; font-size: 14px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg><span class="adm-menu-label">Menu</span></button>
      </div>

      <sc-if value="{{menuOpen}}">
    <button type="button" tabindex="-1" aria-label="Fermer le menu" onClick="{{closeMenu}}" style="position: fixed; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: transparent; cursor: default"></button>
    <nav id="admin-menu" aria-label="Plan de l'administration" style="--focus: {{t.text}}; --focus-gap: {{panelBg}}; position: absolute; top: calc(100% + 8px); right: 24px; width: min(340px, calc(100% - 48px)); max-height: 80vh; overflow-y: auto; overscroll-behavior: contain; padding: 14px 14px 12px; border: {{panelB}}; border-radius: {{t.cR}}; background: {{panelBg}}; color: {{t.text}}; box-shadow: {{panelSh}}; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: {{t.rowB}}">
        <span style="padding-left: 10px; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: 16px; text-transform: {{t.fdTT}}">Menu</span>
        <button type="button" aria-label="Fermer le menu" onClick="{{toggleMenu}}" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: {{t.secB}}; border-radius: {{t.btnR}}; background: transparent; color: {{t.secText}}; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <sc-for list="{{menu}}" as="g">
        <div style="display: flex; flex-direction: column; gap: 1px">
          <span style="padding: 0 10px 2px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: {{t.muted}}">{{g.label}}</span>
          <sc-for list="{{g.items}}" as="m">
            <a href="#" aria-current="{{m.current}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; padding: 0 10px; font-size: 14px; border-radius: {{t.btnR}}; background: {{m.bg}}; color: {{m.fg}}; font-weight: {{m.fw}}">
              <span>{{m.label}}</span>
              <span style="font-size: 13px; font-variant-numeric: tabular-nums; opacity: .85">{{m.n}}</span>
            </a>
          </sc-for>
        </div>
      </sc-for>
      <div style="padding-top: 8px; border-top: {{t.rowB}}">
        <button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 0 10px; border: 0; border-radius: {{t.btnR}}; background: transparent; color: {{t.text}}; font-family: {{t.fb}}; font-weight: 700; font-size: 14px; text-align: left; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4 M10 8l-4 4 4 4 M6 12h10"></path></svg>Se déconnecter</button>
      </div>
    </nav>
      </sc-if>
    </div>
  </header>

  <div style="max-width: 1280px; margin: 0 auto; padding: 14px clamp(12px, 3vw, 24px) 24px; box-sizing: border-box">
    <main style="display: flex; flex-direction: column; gap: 18px">

      <div style="display: flex; flex-direction: column; gap: 6px">
        <nav aria-label="Fil d'Ariane" style="font-size: 13px; color: {{t.muted}}; overflow-wrap: anywhere">
          <a href="#" style="color: {{t.link}}; font-weight: 700">Administration</a>
          <span aria-hidden="true" style="margin: 0 6px">›</span>
          <a href="#" style="color: {{t.link}}; font-weight: 700">Albums</a>
          <span aria-hidden="true" style="margin: 0 6px">›</span>
          <span aria-current="page">{{x.label}}</span>
        </nav>
        <div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 16px">
          <div style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <h1 style="margin: 0; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: {{t.h1size}}; line-height: 1.05; text-transform: {{t.fdTT}}; color: {{t.text}}">Éditions et intentions d'achat</h1>
            <span style="font-size: 14px; font-weight: 700">{{x.label}}</span>
          </div>
          <div style="display: flex; align-items: center; gap: 6px">
            <a href="#" aria-label="Modifier l'album" style="{{secBtn}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.edit}}"></path></svg><span class="sa-hide-sm">Modifier l'album</span></a>
            <a href="#" aria-label="Voir dans la consultation" style="{{secBtn}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7 M9 7h8v8"></path></svg><span class="sa-hide-sm">Voir dans la consultation</span></a>
          </div>
        </div>
      </div>

      <section aria-labelledby="s-album" style="{{block}}">
        <span style="{{kickStyle}}">{{k.album}}</span>
        <h2 id="s-album" style="{{h2}}"><span aria-hidden="true" style="{{mark}}"></span>L'album</h2>
        <div class="ea-album">
          <span aria-hidden="true" style="width: 64px; height: 86px; border-radius: {{t.thR}}; background: {{albumCover}}"></span>
          <div style="min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px">
            <span style="font-weight: 700; font-size: 16px; overflow-wrap: anywhere">{{x.label}}</span>
            <span style="color: {{t.muted}}">{{x.credits}}</span>
            <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px">
              <span>Première publication : <strong>{{x.date}}</strong></span>
              <span style="{{badge}} {{albumBadge}}">{{x.inCollection}}</span>
            </span>
          </div>
        </div>
        <span style="{{help}}">L'album lui-même se modifie sur sa fiche de saisie ; cette page ne réunit que ses éditions et ses intentions d'achat.</span>
      </section>

      <section aria-labelledby="s-eds" style="{{block}}">
        <span style="{{kickStyle}}">{{k.eds}}</span>
        <h2 id="s-eds" style="{{h2}}"><span aria-hidden="true" style="{{mark}}"></span>Les éditions</h2>
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px">
          <span style="font-size: 13px; font-weight: 700">{{x.count}}</span>
          <span style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-if value="{{canIntend}}">
              <span style="position: relative; display: inline-flex">
                <button type="button" aria-haspopup="menu" aria-expanded="{{intentExpanded}}" onClick="{{toggleIntent}}" style="{{secBtn}} background: {{intentBg}}; color: {{intentFg}}; font-family: {{t.fb}}; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.intent}}"></path></svg>Intention d'achat<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
                <sc-if value="{{intentOpen}}">
                  <span aria-hidden="true" onClick="{{closeIntent}}" style="position: fixed; inset: 0; z-index: 25; cursor: default"></span>
                  <div role="menu" aria-label="Poser une intention d'achat" style="--focus: {{t.text}}; --focus-gap: {{panelBg}}; position: absolute; top: calc(100% + 4px); right: 0; z-index: 26; width: 300px; padding: 6px; box-sizing: border-box; border: {{panelB}}; border-radius: {{t.tR}}; background: {{panelBg}}; box-shadow: {{panelSh}}; display: flex; flex-direction: column; gap: 1px">
                    <sc-for list="{{intentChoices}}" as="o">
                      <a href="#" role="menuitem" style="display: flex; flex-direction: column; gap: 1px; padding: 6px 10px; border-radius: {{t.btnR}}; color: {{t.text}}; text-decoration: none">
                        <span style="font-weight: 700; font-size: 14px">{{o.label}}</span>
                        <span style="font-size: 12px; color: {{t.muted}}">{{o.help}}</span>
                      </a>
                    </sc-for>
                  </div>
                </sc-if>
              </span>
            </sc-if>
            <a href="#" style="{{priBtn}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Nouvelle édition</a>
          </span>
        </div>

        <sc-if value="{{x.albumIntent}}">
          <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 12px; border: 2px dashed {{t.line}}; border-radius: {{t.tR}}">
            <span style="display: flex; flex-direction: column; gap: 2px">
              <span style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.intent}}"></path></svg>Intention d'achat sur l'album</span>
              <span style="{{help}}">N'importe quelle édition la réalisera ; posée le {{x.albumIntent}}.</span>
            </span>
            <span style="display: flex; flex-wrap: wrap; gap: 4px 14px; font-weight: 700; font-size: 13px">
              <a href="#" style="color: {{t.link}}">Viser plutôt une édition…</a>
              <a href="#" style="color: {{t.del}}">Retirer l'intention…</a>
            </span>
          </div>
        </sc-if>

        <sc-if value="{{hasEditions}}">
          <div role="table" aria-label="Éditions de l'album" style="display: flex; flex-direction: column">
            <sc-for list="{{editions}}" as="e">
              <div role="row" class="ea-row" style="padding: 8px 0; border-bottom: {{t.rowB}}; font-size: 14px">
                <span role="cell" aria-hidden="true" style="grid-area: cover; width: 36px; height: 48px; border-radius: {{t.thR}}; background: {{e.cover}}"></span>
                <span role="cell" style="grid-area: main; min-width: 0; display: flex; flex-direction: column">
                  <a href="#" style="font-weight: 700; color: {{t.text}}; overflow-wrap: anywhere">{{e.label}}</a>
                  <span style="font-size: 12px; color: {{t.muted}}">{{e.sub}}</span>
                </span>
                <span role="cell" style="grid-area: meta; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12px; color: {{t.muted}}">
                  <span style="{{badge}} {{e.badgeStyle}}"><sc-if value="{{e.intent}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.intent}}"></path></svg></sc-if>{{e.badge}}</span>
                  <span>{{e.detail}}</span>
                </span>
                <span role="cell" style="grid-area: act; position: relative; display: flex; align-items: center; justify-content: flex-end; gap: 4px">
                  <a href="#" aria-label="Modifier {{e.label}}" style="{{rowBtn}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.edit}}"></path></svg><span class="ea-act-label">Modifier</span></a>
                  <button type="button" aria-label="Autres actions sur {{e.label}}" aria-haspopup="menu" aria-expanded="{{e.menuExpanded}}" onClick="{{e.toggle}}" style="width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: {{t.btnR}}; background: {{e.moreBg}}; color: {{e.moreFg}}; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
                  <sc-if value="{{e.menuOpen}}">
                    <span aria-hidden="true" onClick="{{closeRowMenu}}" style="position: fixed; inset: 0; z-index: 25; cursor: default"></span>
                    <div role="menu" aria-label="Actions sur {{e.label}}" style="--focus: {{t.text}}; --focus-gap: {{panelBg}}; position: absolute; top: calc(100% + 4px); right: 0; z-index: 26; width: 250px; padding: 6px; box-sizing: border-box; border: {{panelB}}; border-radius: {{t.tR}}; background: {{panelBg}}; box-shadow: {{panelSh}}; display: flex; flex-direction: column; gap: 1px">
                      <sc-if value="{{e.intent}}">
                        <button type="button" role="menuitem" style="{{menuBtn}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Confirmer l'achat…</button>
                        <button type="button" role="menuitem" style="{{menuBtn}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.intent}}"></path></svg>Viser plutôt l'album…</button>
                        <span aria-hidden="true" style="margin: 4px 0; border-top: {{t.rowB}}"></span>
                        <button type="button" role="menuitem" style="{{menuBtn}} color: {{t.del}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.trash}}"></path></svg>Retirer l'intention…</button>
                      </sc-if>
                      <sc-if value="{{e.own}}">
                        <a href="#" role="menuitem" style="{{menuBtn}} text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7 M9 7h8v8"></path></svg>Voir dans la consultation</a>
                        <span aria-hidden="true" style="margin: 4px 0; border-top: {{t.rowB}}"></span>
                        <button type="button" role="menuitem" style="{{menuBtn}} color: {{t.del}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icons.trash}}"></path></svg>Supprimer l'édition…</button>
                      </sc-if>
                    </div>
                  </sc-if>
                </span>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{noEdition}}"><span style="padding: 12px; border: 2px dashed {{t.line}}; border-radius: {{t.tR}}; color: {{t.muted}}; font-size: 13px; text-align: center">Aucune édition pour l'instant.</span></sc-if>
        <span style="{{help}}">Chaque édition, avec ses visuels, se saisit sur sa propre fiche. Un album visé par une intention d'achat ne peut pas avoir l'une de ses éditions visée aussi, et inversement.</span>
      </section>
      <p style="margin: 0; font-size: 12px; color: {{t.muted}}">{{x.meta}}</p>
    </main>
  </div>
</div>
</template>
<script>
// Shared defaults: each theme only states what its identity changes.
const BASE = {
  kDisp: 'none', kPos: 'static', kTop: 'auto', kLeft: 'auto', kBg: 'transparent', kText: 'inherit', kPad: '0', kR: '0',
  kFont: 'inherit', kW: '700', kSize: '12px', kLS: '0', kTT: 'none', kPre: null,
  mkDisp: 'none', lgMark: false, lgSh: 'none', lgTSh: 'none', lgRot: '0deg', lgPad: '0', lgR: '0', lgBg: 'transparent',
  tagTT: 'none', tagLS: '0', h2fs: 'normal', h2sh: 'none', h2tt: 'none', h2line: '0', h2pad: '0', h2r: '0', h2bg: 'transparent',
  fdTT: 'none', h1size: 'clamp(24px, 3vw, 36px)', cSh: 'none', hiSh: 'none', thR: '3px'
};

// « Cases et bulles » comes in two tints that only differ by their purple shades.
const cases = (c) => ({
  ...BASE,
  bg: c.bg, text: '#FBF3EA', muted: c.muted, line: c.border,
  acc: '#FFB547', onAcc: c.bg, link: '#FFB547', warn: '#FF7A6B', onWarn: c.bg, del: '#FF7A6B', nBg: '#FBF3EA', nFg: c.bg,
  fd: 'Fraunces, Georgia, serif', fdw: '800', fb: "'DM Sans', system-ui, sans-serif",
  cBg: c.panel, cB: '2px solid ' + c.border, cBT: '2px solid ' + c.border, cR: '26px 16px 28px 18px', cPad: 'clamp(14px, 2.2vw, 22px)',
  tBg: c.bg, tB: '2px solid ' + c.border, tR: '18px 12px 20px 14px', rowB: '1px solid ' + c.border,

      intent: e.state === 'intent', own: e.state === 'own',
      cover: e.cover ? 'hsl(' + ((i * 47 + 20) % 360) + ', 42%, 36%)' : generic,
      badge: e.state === 'own' ? 'Dans la collection' : "Intention d'achat",
      badgeStyle: e.state === 'own' ? owned : dashed,
      menuOpen: openRow === i, menuExpanded: openRow === i ? 'true' : 'false',
      moreBg: openRow === i ? t.nBg : 'transparent', moreFg: openRow === i ? t.nFg : t.secText,
      toggle: () => this.setState({ openRow: openRow === i ? -1 : i })
    }));
    const btn = 'display: inline-flex; align-items: center; gap: 6px; box-sizing: border-box; border-radius: ' + t.btnR + '; font-weight: 700; ';
    return {
      ...c,
      t, x, editions,
      icons: { ...ICONS, edit: 'M4 20h4L19 9l-4-4L4 16v4z M13.5 6.5l4 4' },
      // The mention above a block title says what kind of data the block holds, never the title again.
      k: { album: kick(1, 'Identification'), eds: kick(2, 'Exemplaires') },
      albumCover: x.cover ? 'hsl(20, 42%, 36%)' : generic,
      badge, albumBadge: x.inCollection === 'Dans la collection' ? owned : dashed,
      hasEditions: editions.length > 0,
      noEdition: editions.length === 0 && !x.albumIntent,
      // An album aimed at by an intent on itself cannot have its editions aimed at too, and the reverse:
      // the album can be aimed at while nothing is, a new edition while the album itself is not.
      canIntend: !x.albumIntent,
      intentOpen, intentExpanded: intentOpen ? 'true' : 'false',
      intentBg: intentOpen ? t.nBg : 'transparent', intentFg: intentOpen ? t.nFg : t.secText,
      toggleIntent: () => this.setState({ intentOpen: !intentOpen }),
      closeIntent: () => this.setState({ intentOpen: false }),
      intentChoices: [
        ...(x.editions.some((e) => e.state === 'intent') ? [] : [{ label: 'Sur l\'album…', help: 'Toute édition de l\'album fera l\'affaire.' }]),
        { label: 'Sur une nouvelle édition…', help: 'Une édition précise, saisie sans exemplaire ni valeur.' }
      ],
      closeRowMenu: () => this.setState({ openRow: -1 }),
      secBtn: btn + 'height: 38px; padding: 0 14px; border: ' + t.secB + '; color: ' + t.secText + '; font-size: 14px;',
      priBtn: btn + 'height: 38px; padding: 0 16px; border: 0; background: ' + t.acc + '; color: ' + t.onAcc + '; font-size: 14px;',
      rowBtn: btn + 'height: 34px; padding: 0 12px; border: ' + t.secB + '; color: ' + t.secText + '; font-size: 13px;',
      menu: menuOf(t, 'Albums')
    };
  }
}

Mockup.mount(View, {
  theme: { label: 'Thème', editor: 'enum', options: ['violine', 'mure', 'gazette', 'sommaire', 'festival', 'riso', 'librairie', 'vignettes'], default: 'violine' },
  exemple: { label: 'Exemple', editor: 'enum', options: ['sansIntention', 'editions', 'integrale'], default: 'sansIntention' },
  choixIntention: { label: 'Choix de l\'intention ouvert', editor: 'boolean', default: false },
  actions: { label: 'Menu d\'une édition ouvert', editor: 'boolean', default: false },
  menuOpen: { label: 'Menu ouvert', editor: 'boolean', default: false }
});
</script>
