<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — festival et métro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
a:hover{color:#E8604C}
@media (max-width: 720px){.stop{grid-template-columns:44px minmax(0,1fr) !important}}
/* Welcome screen on a phone: the poster discs move to its top edge, clear of the text, and the link
   pills shrink so that Albums, Séries and Auteurs keep to one line. */
@media (max-width: 720px){
.poster-text{padding-right:0 !important}
.disc-y{width:100px !important;height:100px !important;right:-50px !important;top:-50px !important}
.disc-c{width:44px !important;height:44px !important;right:62px !important;top:-24px !important}
.gates{gap:6px !important}
.gate{gap:5px !important;padding:3px 10px 3px 3px !important;font-size:14px !important}
.gate>span{width:24px !important;height:24px !important;font-size:11px !important}
}
</style>
<script src="../shared/mockup.js"></script>
</head>
<body>
<div id="mockup"></div>
<template id="view">
<div style="min-height: 100vh; background: #FFF8EC; color: #1B2350; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 16px; line-height: 1.5">

  <header style="position: sticky; top: 0; z-index: 20; background: #FFF8EC; max-width: 1240px; margin: 0 auto; padding: 10px clamp(12px, 3vw, 24px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px">
    <a href="#" style="display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 24px"><span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: #E8604C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px">B</span>BDthèque</a>
    <nav aria-label="Navigation principale" data-scroll-hint="" style="flex: 999 1 220px; --hint-bg: #FFF8EC"><div data-scroll="">
      <div style="display: flex; gap: 4px; white-space: nowrap; width: max-content; font-weight: 600">
        <a href="#" aria-current="page" style="padding: 9px 16px; border-radius: 999px; background: #1F3A93; color: #FFFFFF">Accueil</a>
        <a href="#" style="padding: 9px 14px">Albums</a>
        <a href="#" style="padding: 9px 14px">Séries</a>
        <a href="#" style="padding: 9px 14px">Auteurs</a>
        <a href="#" style="padding: 9px 14px">Intentions d'achat</a>
      </div>
    </div></nav>
    <div style="display: flex; gap: 6px; flex: {{tools.flex}}">
      <sc-if value="{{full}}">
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rechercher</label>
      <input id="q" type="search" placeholder="Une série, un auteur…" style="flex: 1; min-width: 0; height: 38px; padding: 0 14px; border: 2px solid #1B2350; border-radius: 999px; background: #FFFFFF; color: #1B2350; font: inherit; outline: none">
      </sc-if>
      <button type="button" aria-label="Aide sur cette page" style="width: 38px; height: 38px; flex: none; border: 0; border-radius: 50%; background: #F6C343; color: #1B2350; font: 800 19px 'Bricolage Grotesque', sans-serif; cursor: pointer">?</button>
    </div>
  </header>

  <main style="max-width: 1240px; margin: 0 auto; padding: 14px clamp(12px, 3vw, 24px) 48px; box-sizing: border-box">

    <sc-if value="{{vide}}">
    <section aria-labelledby="h-welcome" class="stop" style="display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 0 24px">
      <div style="position: relative">
        <span aria-hidden="true" style="position: absolute; top: 24px; bottom: 0; left: 50%; width: 14px; margin-left: -7px; background: #E8604C"></span>
        <span aria-hidden="true" style="position: absolute; top: 6px; left: 50%; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%; background: #E8604C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800">N</span>
      </div>
      <div style="padding-bottom: 36px; display: flex; flex-direction: column; gap: 16px">
        <span style="font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #5B6290">Navette du festival · Terminus Entrée</span>
        <div style="position: relative; overflow: hidden; padding: clamp(20px, 3.5vw, 36px); border-radius: 24px; background: #1F3A93; color: #FFFFFF">
          <span aria-hidden="true" class="disc-y" style="position: absolute; right: -80px; top: -80px; width: 240px; height: 240px; border-radius: 50%; background: #F6C343"></span>
          <span aria-hidden="true" class="disc-c" style="position: absolute; right: 48px; top: 104px; width: 84px; height: 84px; border-radius: 50%; background: #E8604C"></span>
          <!-- The right padding keeps the text clear of the discs, which hold the poster's corner. -->
          <div class="poster-text" style="position: relative; padding-right: 150px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px">
            <span style="display: inline-block; padding: 4px 12px; border-radius: 999px; background: #FFFFFF; color: #1F3A93; font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase">Festival permanent · entrée libre</span>
            <h1 id="h-welcome" style="margin: 4px 0 0; max-width: 760px; font-weight: 800; font-size: clamp(26px, 4vw, 48px); line-height: 1; letter-spacing: -0.02em; text-wrap: balance">Les étagères attendent leur premier album !</h1>
            <p style="margin: 0; font-weight: 700; font-size: clamp(17px, 1.8vw, 20px); line-height: 1.3">La collection ne compte encore aucune édition.</p>
            <p style="margin: 0; max-width: 62ch">Le tableau de bord s'affichera dès la première édition entrée : l'édition à la une, les dernières arrivées, la valeur de la collection et ses statistiques.</p>
            <p style="margin: 0; max-width: 62ch; font-size: 14px; color: #C9D3F5">Les albums, séries et auteurs déjà présents dans la base restent consultables, même s'ils ne font pas encore partie de la collection.</p>
          </div>
        </div>
        <!-- Where the dashboard has its counters, the plan of a line still under construction. -->
        <div aria-hidden="true" style="padding: clamp(14px, 2.4vw, 22px); border: 2px solid #1B2350; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px">
            <span style="padding: 3px 12px; border-radius: 999px; background: #F6C343; font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase">Prochainement</span>
            <span style="font-weight: 700; font-size: 14px; color: #5B6290">Ligne en construction</span>
          </div>
          <div style="display: flex; align-items: center; padding: 26px 0 24px">
            <span style="position: relative; flex: none; width: 30px; height: 30px; border-radius: 50%; background: #E8604C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px">N<span style="position: absolute; left: 0; top: calc(100% + 4px); white-space: nowrap; font-size: 13px; font-weight: 700; color: #1B2350">Entrée</span></span>
            <span style="flex: 1 1 0; min-width: 12px; height: 8px; background: #E8604C"></span>
            <span style="position: relative; flex: none; width: 26px; height: 26px; border-radius: 50%; border: 4px dashed #1B2350; background: #FFFFFF; box-sizing: border-box"><span style="position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); white-space: nowrap; font-size: 13px; font-weight: 700">Premier album</span></span>
            <sc-for list="{{plan}}" as="p" hint-placeholder-count="4">
              <span style="flex: 1 1 0; min-width: 12px; height: 8px; border-radius: 4px; background: repeating-linear-gradient(90deg, #E8604C 0 12px, transparent 12px 20px); opacity: {{p.fade}}"></span>
              <sc-if value="{{p.barrier}}"><span style="flex: none; width: 44px; height: 18px; border: 2px solid #1B2350; border-radius: 4px; box-sizing: border-box; background: repeating-linear-gradient(-45deg, #F6C343 0 6px, #1B2350 6px 12px)"></span></sc-if>
              <sc-if value="{{p.station}}"><span style="flex: none; width: 26px; height: 26px; border-radius: 50%; border: 4px dashed #1B2350; background: #FFFFFF; box-sizing: border-box; opacity: {{p.fade}}"></span></sc-if>
            </sc-for>
          </div>
        </div>
      </div>
    </section>

    <section aria-labelledby="h-browse" class="stop" style="display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 0 24px">
      <div style="position: relative">
        <span aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 50%; width: 14px; margin-left: -7px; background: #E8604C"></span>
        <span aria-hidden="true" style="position: absolute; top: 6px; left: 50%; width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; background: #FFFFFF; border: 6px solid #1B2350; box-sizing: border-box"></span>
      </div>
      <div style="padding-bottom: 36px; display: flex; flex-direction: column; gap: 14px">
        <span style="font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #5B6290">Correspondance Centre de documentation</span>
        <h2 id="h-browse" style="margin: 0; font-weight: 800; font-size: clamp(22px, 2.6vw, 28px); letter-spacing: -0.01em">On jette un œil quand même ?</h2>
        <p style="margin: 0; max-width: 62ch">La base documentaire se parcourt déjà : fiches d'albums, de séries et d'auteurs, et recherche avancée.</p>
        <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px">
          <div class="gates" style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{browse}}" as="b" hint-placeholder-count="3">
              <a href="#" class="gate" style="display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; border: 2px solid #1B2350; border-radius: 999px; background: #FFFFFF; font-weight: 700"><span style="width: 30px; height: 30px; border-radius: 50%; background: {{b.c}}; color: {{b.tc}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px">{{b.letter}}</span>{{b.label}}</a>
            </sc-for>
          </div>
          <a href="#" class="gate" style="display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; border: 2px solid #1B2350; border-radius: 999px; background: #FFFFFF; font-weight: 700"><span style="width: 30px; height: 30px; border-radius: 50%; background: #3BA7D9; color: #1B2350; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px">R</span>Recherche avancée</a>
        </div>
      </div>
    </section>

    <section aria-labelledby="h-admin" class="stop" style="display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 0 24px">
      <div style="position: relative">
        <span aria-hidden="true" style="position: absolute; top: 0; height: 24px; left: 50%; width: 14px; margin-left: -7px; background: #E8604C"></span>
        <span aria-hidden="true" style="position: absolute; top: 6px; left: 50%; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%; background: #E8604C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800">N</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 14px">
        <span style="font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #5B6290">Terminus Espace exposants</span>
        <h2 id="h-admin" style="margin: 0; font-weight: 800; font-size: clamp(22px, 2.6vw, 28px); letter-spacing: -0.01em">C'est votre collection ?</h2>
        <p style="margin: 0; max-width: 62ch">Ajoutez une première édition, ou reprenez les données de l'application existante, depuis l'administration.</p>
        <a href="#" style="padding: 9px 20px; border: 2px solid #1B2350; border-radius: 999px; background: #F6C343; color: #1B2350; font-weight: 800">Ouvrir l'administration →</a>
        <p style="margin: 0; font-size: 13px; color: #5B6290">La connexion est demandée à l'ouverture.</p>
      </div>
    </section>
    </sc-if>

    <sc-if value="{{full}}">

    <section aria-labelledby="h-hero" class="stop" style="display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 0 24px">
      <div style="position: relative">
        <span aria-hidden="true" style="position: absolute; top: 24px; bottom: 0; left: 50%; width: 14px; margin-left: -7px; background: #E8604C"></span>
        <span aria-hidden="true" style="position: absolute; top: 6px; left: 50%; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%; background: #E8604C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800">N</span>
      </div>
      <div style="padding-bottom: 36px; display: flex; flex-direction: column; gap: 16px">
        <span style="font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #5B6290">Navette du festival · Terminus Entrée</span>
        <div style="position: relative; overflow: hidden; padding: clamp(20px, 3.5vw, 36px); border-radius: 24px; background: #1F3A93; color: #FFFFFF">
          <span aria-hidden="true" style="position: absolute; right: -70px; top: -70px; width: 260px; height: 260px; border-radius: 50%; background: #F6C343"></span>
          <span aria-hidden="true" style="position: absolute; right: 120px; top: 110px; width: 110px; height: 110px; border-radius: 50%; background: #E8604C"></span>
          <span style="position: relative; display: inline-block; padding: 4px 12px; border-radius: 999px; background: #FFFFFF; color: #1F3A93; font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase">Festival permanent · entrée libre</span>
          <h1 id="h-hero" style="position: relative; margin: 16px 0 0; max-width: 760px; font-weight: 800; font-size: clamp(26px, 4.4vw, 56px); line-height: .98; letter-spacing: -0.02em">{{heroLine}}</h1>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 12px">
          <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border: 2px solid #1B2350; border-radius: 999px; background: #FFFFFF"><span style="width: 32px; height: 32px; border-radius: 50%; background: #E8604C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800">A</span><strong style="font-size: 22px">2 847</strong> albums</a>
          <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border: 2px solid #1B2350; border-radius: 999px; background: #FFFFFF"><span style="width: 32px; height: 32px; border-radius: 50%; background: #2E9E6E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800">S</span><strong style="font-size: 22px">412</strong> séries</a>
          <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 8px; border: 2px solid #1B2350; border-radius: 999px; background: #FFFFFF"><span style="width: 32px; height: 32px; border-radius: 50%; background: #8E5BB8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800">E</span><strong style="font-size: 22px">2 913</strong> éditions</a>
        </div>
      </div>
    </section>

    <section aria-labelledby="h-featured" class="stop" style="display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 0 24px">
      <div style="position: relative">
        <span aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 50%; width: 14px; margin-left: -7px; background: #E8604C"></span>
        <span aria-hidden="true" style="position: absolute; top: 6px; left: 50%; width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; background: #FFFFFF; border: 6px solid #1B2350; box-sizing: border-box"></span>
      </div>
      <div style="padding-bottom: 36px; display: flex; flex-direction: column; gap: 14px">
        <span style="font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #5B6290">Station Grande scène</span>
        <h2 id="h-featured" style="margin: 0; font-weight: 800; font-size: clamp(22px, 2.6vw, 28px); letter-spacing: -0.01em">À l'affiche aujourd'hui !</h2>
        <a href="#" style="display: grid; grid-template-columns: clamp(96px, 22vw, 180px) minmax(0, 1fr); gap: clamp(14px, 2.6vw, 28px); align-items: start; padding: clamp(14px, 2.4vw, 22px); border-radius: 24px; background: #F6C343; color: #1B2350">
          <span style="aspect-ratio: 3 / 4; border-radius: 10px; background: #2E2A33; border: 4px solid #FFFFFF; display: flex; align-items: center; justify-content: center; color: #A79FB0; font-size: 12px">[Couverture]</span>
          <span style="min-width: 0; display: flex; flex-direction: column; gap: 8px">
            <span style="align-self: flex-start; padding: 3px 12px; border-radius: 999px; background: #1B2350; color: #FFFFFF; font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase">Tête d'affiche</span>
            <span style="font-weight: 800; font-size: clamp(22px, 3.2vw, 34px); line-height: 1.05; letter-spacing: -0.01em">Le Lotus bleu (Les Aventures de Tintin - T. 5)</span>
            <span style="font-size: 14px; font-weight: 600">Stand Casterman (Les Aventures de Tintin) [1946]</span>
            <span style="font-size: 15px">Invité en Chine, Tintin s'attaque à un réseau de trafiquants d'opium, déjoue les manœuvres de l'occupant et se lie d'amitié avec le jeune Tchang.</span>
          </span>
        </a>
      </div>
    </section>

    <section aria-labelledby="h-recent" class="stop" style="display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 0 24px">
      <div style="position: relative">
        <span aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 50%; width: 14px; margin-left: -7px; background: #E8604C"></span>
        <span aria-hidden="true" style="position: absolute; top: 6px; left: 50%; width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; background: #FFFFFF; border: 6px solid #1B2350; box-sizing: border-box"></span>
      </div>
      <div style="padding-bottom: 36px; display: flex; flex-direction: column; gap: 14px">
        <span style="font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #5B6290">Station Scène des nouveautés</span>
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px">
          <h2 id="h-recent" style="margin: 0; font-weight: 800; font-size: clamp(22px, 2.6vw, 28px); letter-spacing: -0.01em">Tout juste arrivés !</h2>
          <a href="#" style="font-weight: 700; color: #E8604C">Tous les albums →</a>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 8px">
          <sc-for list="{{recents}}" as="r" hint-placeholder-count="6">
            <a href="#" style="display: grid; grid-template-columns: 44px 36px minmax(0, 1fr); align-items: center; gap: 10px; padding: 8px 12px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 2px 0 rgba(27,35,80,.08)">
              <span style="font-weight: 800; font-size: 20px; line-height: 1; color: {{r.c}}">{{r.day}}<br><span style="font-size: 13px; font-weight: 600; color: #1B2350">{{r.month}}</span></span>
              <span style="aspect-ratio: 3 / 4; border-radius: 4px; background: #2E2A33"></span>
              <span style="display: flex; flex-direction: column; line-height: 1.25; font-size: 14px"><span style="font-weight: 700">{{r.label}}</span><span style="font-size: 13px; color: #5B6290">Stand {{r.pub}}</span></span>
            </a>
          </sc-for>
        </div>
      </div>
    </section>

    <section aria-labelledby="h-value" class="stop" style="display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 0 24px">
      <div style="position: relative">
        <span aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 50%; width: 14px; margin-left: -7px; background: #E8604C"></span>
        <span aria-hidden="true" style="position: absolute; top: 6px; left: 50%; width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; background: #FFFFFF; border: 6px solid #1B2350; box-sizing: border-box"></span>
      </div>
      <div style="padding-bottom: 36px; display: flex; flex-direction: column; gap: 14px">
        <span style="font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #5B6290">Station Billetterie</span>
        <h2 id="h-value" style="margin: 0; font-weight: 800; font-size: clamp(22px, 2.6vw, 28px); letter-spacing: -0.01em">Ça vaut combien, tout ça ?</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 16px">
          <sc-for list="{{passes}}" as="k" hint-placeholder-count="2">
            <div style="flex: 1 1 260px; position: relative; padding: 14px 18px 30px; border-radius: 18px; background: {{k.bg}}; color: #1B2350">
              <div style="font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase">{{k.label}}</div>
              <div style="font-weight: 800; font-size: clamp(28px, 3.6vw, 38px); line-height: 1.1">{{k.cur}}</div>
              <div style="font-weight: 700; font-size: 16px; color: #1F3A93">{{k.today}} en euros du jour</div>
              <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 12px; height: 10px; background: #1B2350; opacity: .85"></span>
            </div>
          </sc-for>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px">
          <sc-for list="{{prices}}" as="p" hint-placeholder-count="4">
            <div style="padding: 8px 12px; border-radius: 12px; background: #FFFFFF; font-size: 15px; border-left: 6px solid {{p.c}}"><div style="font-size: 14px; color: #5B6290">{{p.label}}</div><strong>{{p.cur}}</strong> · {{p.today}}</div>
          </sc-for>
        </div>
        <p style="margin: 0; font-size: 13px; color: #5B6290">Montants en euros courants, puis en euros du jour. Estimation : prix connus + 497 éditions sans prix. 12 montants non convertibles exclus · 25 éditions gratuites non valorisées.</p>
      </div>
    </section>

    <section aria-labelledby="h-type" class="stop" style="display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 0 24px">
      <div style="position: relative">
        <span aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 50%; width: 14px; margin-left: -7px; background: #E8604C"></span>

        <p style="margin: 0; color: #5B6290">Une ligne par espace ; un arrêt tous les 100 albums. Un album peut cumuler plusieurs genres.</p>
        <sc-for list="{{genres}}" as="g" hint-placeholder-count="8">

<script>
const HERO_LINES = [
  'Entrez donc, il y a de quoi lire !',
  'Installez-vous, la collection vous attend !',
  'Alors, on bouquine ?',
  'Encore de la place sur les étagères ? Pas sûr…',
  'Attention, ça déborde des étagères !'
];
class View extends Mockup {
  componentDidMount() {
    this.setState({ heroIndex: Math.floor(Math.random() * HERO_LINES.length) });
  }
  renderVals() {
    const fmt = (v) => v.toLocaleString('fr-FR');
    // Festival colours used as line colours, each with the text colour that stays legible on its badge.
    const lines = [['#1F3A93', '#FFFFFF'], ['#E8604C', '#FFFFFF'], ['#F6C343', '#1B2350'], ['#2E9E6E', '#FFFFFF'], ['#8E5BB8', '#FFFFFF'], ['#3BA7D9', '#1B2350'], ['#F29E4C', '#1B2350'], ['#B8B2A3', '#1B2350']];
    const genres = [['Aventure', 612], ['Humour', 488], ['Science-fiction', 341], ['Policier', 297], ['Fantastique', 254], ['Historique', 231], ['Western', 118], ['Autres', 506]];
    const pubs = [['Dargaud', 548], ['Dupuis', 506], ['Casterman', 351], ['Glénat', 318], ['Delcourt', 294], ['Le Lombard', 247], ['Soleil', 181], ['Autres', 468]];
    const stands = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2', 'D1', 'D2'];
    const vide = this.props.vide;
    return {
      vide,
      full: !vide,
      // Without the search field, the help button no longer needs room beside the menu.
      tools: { flex: vide ? 'none' : '0 1 320px' },
      footerJustify: vide ? 'flex-end' : 'space-between',
      // The planned stretch of the line fades out past the works.
      plan: [{ station: true, fade: 1 }, { barrier: true, fade: 1 }, { station: true, fade: .6 }, { station: true, fade: .35 }],
      browse: [
        { letter: 'A', label: 'Albums', c: '#E8604C', tc: '#FFFFFF' },
        { letter: 'S', label: 'Séries', c: '#2E9E6E', tc: '#FFFFFF' },
        { letter: 'Au', label: 'Auteurs', c: '#8E5BB8', tc: '#FFFFFF' }
      ],
      heroLine: HERO_LINES[this.state?.heroIndex ?? 0],
      recents: [
        { day: '3', month: 'oct.', label: 'Alors, tout tombe (Blacksad - T. 7)', pub: 'Dargaud', c: '#E8604C' },
        { day: '28', month: 'sept.', label: "L'Iris blanc (Astérix - T. 40)", pub: 'Albert René', c: '#1F3A93' },
        { day: '21', month: 'sept.', label: 'Les Indes fourbes', pub: 'Delcourt', c: '#2E9E6E' },
        { day: '14', month: 'sept.', label: 'Le Château des étoiles - INT. [1 à 2]', pub: 'Rue de Sèvres', c: '#8E5BB8' },
        { day: '9', month: 'sept.', label: 'Mister Prairie (Undertaker - T. 7)', pub: 'Dargaud', c: '#E8604C' },
        { day: '2', month: 'sept.', label: 'Spirou et Fantasio - Hors-série 2', pub: 'Dupuis', c: '#1F3A93' }
      ],
      passes: [
        { label: 'Pass collection · valeur estimée', cur: '38 760 €', today: '55 230 €', bg: '#F6C343' },
        { label: 'Pass collection · valeur connue', cur: '31 482 €', today: '44 910 €', bg: '#FFFFFF' }
      ],
      prices: [
        { label: 'Prix moyen', cur: '13,10 €', today: '18,70 €', c: '#3BA7D9' },
        { label: 'Prix médian', cur: '11,90 €', today: '16,40 €', c: '#8E5BB8' },
        { label: 'Le moins cher', cur: '0,90 €', today: '3,20 €', c: '#2E9E6E' },
        { label: 'Le plus cher', cur: '189,00 €', today: '214,50 €', c: '#E8604C' }
      ],
      pavilions: [
        { label: 'réguliers', n: '2 571', pct: '90 %', flex: 90, c: '#1F3A93', tc: '#FFFFFF' },
        { label: 'intégrales', n: '184', pct: '6 %', flex: 6, c: '#E8604C', tc: '#FFFFFF' },
        { label: 'hors-séries', n: '92', pct: '3 %', flex: 3, c: '#F6C343', tc: '#1B2350' }
      ],
      genres: genres.map(([name, v], i) => ({ name, n: fmt(v), num: i + 1, c: lines[i][0], tc: lines[i][1], w: Math.round(v / 612 * 100) + '%', step: Math.round(100 / v * 100 * 100) / 100 + '%' })),
      publishers: pubs.map(([name, v], i) => {
        const d = 18 + Math.round(v / 548 * 30);
        return { name, n: fmt(v), stand: name === 'Autres' ? '—' : stands[i], d: d + 'px' };
      })
    };
  }
}

Mockup.mount(View, {"vide": {"label": "Collection vide", "editor": "boolean", "default": false}});
</script>
</body>
</html>
