<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — sommaire de magazine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Libre+Franklin:ital,wght@0,400;0,600;0,800;1,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
.entry:hover h2{color:#E63946}
.entry:hover .pageno{transform:rotate(-4deg) scale(1.06)}
.pageno{transition:transform .2s ease}
@media (max-width: 640px){.featured-tag{max-width:64% !important;bottom:-8px !important;padding:4px 7px !important}.featured-tag > :first-child{font-size:12px !important}.featured-tag > :nth-child(2){font-size:10px !important}.featured-tag > :nth-child(3){font-size:9px !important}}
</style>
<script src="../shared/mockup.js"></script>
</head>
<body>
<div id="mockup"></div>
<template id="view">
<div style="min-height: 100vh; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Libre Franklin', system-ui, sans-serif; font-size: 15px; line-height: 1.5">

  <header style="position: sticky; top: 0; z-index: 20; background: {{t.bg}}; max-width: 1280px; margin: 0 auto; padding: 10px clamp(12px, 3vw, 24px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 12px 28px; border-bottom: 4px solid {{t.ink}}">
    <nav aria-label="Navigation principale" data-scroll-hint="" style="flex: 999 1 220px; --hint-bg: {{t.bg}}"><div data-scroll="">
      <div style="display: flex; gap: 4px; white-space: nowrap; width: max-content; font-weight: 800; text-transform: uppercase; font-size: 13px; letter-spacing: .04em">
        <a href="#" aria-current="page" style="padding: 10px 14px; background: {{accent}}; color: #FFFFFF">Accueil</a>
        <a href="#" style="padding: 10px 14px">Albums</a>
        <a href="#" style="padding: 10px 14px">Séries</a>
        <a href="#" style="padding: 10px 14px">Auteurs</a>
        <a href="#" style="padding: 10px 14px">Intentions d'achat</a>
      </div>
    </div></nav>
    <div style="display: flex; align-items: center; gap: 8px; flex: {{toolsFlex}}">
      <sc-if value="{{full}}">
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rechercher</label>
      <input id="q" type="search" placeholder="Une série, un auteur…" style="flex: 1; min-width: 0; height: 38px; padding: 0 12px; border: 2px solid {{t.ink}}; border-radius: 0; background: transparent; color: {{t.ink}}; font: inherit; outline: none">
      </sc-if>
      <button type="button" aria-label="Aide sur cette page" style="width: 38px; height: 38px; flex: none; border: 0; background: #FFD60A; color: #111111; font: 800 18px 'Libre Franklin', sans-serif; cursor: pointer">?</button>
    </div>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 24px clamp(12px, 3vw, 24px) 48px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">

    <sc-if value="{{vide}}">
    <!-- Issue zero: the cover keeps its masthead, but its picture box is still the layout's empty
         frame, crossed as on a page waiting for its photo. It carries no figure, no issue number. -->
    <div aria-hidden="true" style="flex: 0 1 clamp(250px, 34vw, 460px); min-width: 0; margin: 0 auto; aspect-ratio: 210 / 297; padding: clamp(14px, 2vw, 24px); box-sizing: border-box; background: #E63946; color: #111111; display: flex; flex-direction: column; box-shadow: 18px 18px 0 #111111; transform: rotate(-1.5deg)">
      <span style="font-family: Anton, Impact, sans-serif; font-size: clamp(48px, 7vw, 104px); line-height: .85; letter-spacing: -0.01em; text-transform: uppercase; color: #FFFFFF">BDthèque</span>
      <!-- Spelled out, the issue number is longer than a figure: the strip shrinks on a phone rather than wrap. -->
      <span style="display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; margin-top: 8px; padding: 4px 0; border-top: 3px solid #111111; border-bottom: 3px solid #111111; font-weight: 800; font-size: clamp(10px, 0.9vw, 13px); text-transform: uppercase; letter-spacing: .06em">
        <span>Numéro zéro</span><span>Octobre</span><span>Gratuit</span>
      </span>
      <span style="position: relative; flex: 1; margin: 18px 0; background: #FAF7F0; border: 4px solid #111111; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="M0 0L100 100M100 0L0 100" stroke="#C9C1B2" stroke-width="2" vector-effect="non-scaling-stroke" fill="none"></path></svg>
        <span style="position: relative; padding: 5px 10px; background: #FAF7F0; border: 2px dashed #111111; font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .06em">Couverture à venir</span>
        <span class="featured-tag" style="position: absolute; right: -10px; bottom: 14px; max-width: 78%; padding: 6px 10px; background: #FFD60A; color: #111111; transform: rotate(3deg); display: flex; flex-direction: column; gap: 1px; line-height: 1.2; box-shadow: 4px 4px 0 #111111">
          <span style="font-family: Anton, Impact, sans-serif; font-size: 15px; text-transform: uppercase">Bientôt en kiosque !</span>
          <span style="font-weight: 600; font-size: 12px">Le premier album de la collection fera la une.</span>
        </span>
      </span>
      <span style="font-family: Anton, Impact, sans-serif; font-size: clamp(24px, 3.2vw, 44px); line-height: .95; text-transform: uppercase; color: #FFFFFF">Numéro en préparation !</span>
    </div>

    <div style="flex: 1.3 1 520px; min-width: 0; display: flex; flex-direction: column">
      <section aria-labelledby="h-welcome" style="padding-bottom: 20px">
        <span style="display: inline-block; padding: 3px 10px; background: {{t.ink}}; color: {{t.bg}}; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .06em">L'édito</span>
        <h1 id="h-welcome" style="margin: 10px 0 14px; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: clamp(34px, 4.6vw, 60px); line-height: 1; text-transform: uppercase">Les étagères attendent leur premier album !</h1>
        <p style="margin: 0 0 10px; font-weight: 800; font-size: clamp(17px, 1.8vw, 20px); line-height: 1.3">La collection ne compte encore aucune édition.</p>
        <p style="margin: 0 0 10px; max-width: 62ch; color: {{t.soft}}">Le tableau de bord s'affichera dès la première édition entrée : l'édition à la une, les dernières arrivées, la valeur de la collection et ses statistiques.</p>
        <p style="margin: 0; max-width: 62ch; font-size: 13px; color: {{t.muted}}">Les albums, séries et auteurs déjà présents dans la base restent consultables, même s'ils ne font pas encore partie de la collection.</p>
      </section>

      <section aria-labelledby="h-browse" style="display: grid; grid-template-columns: clamp(52px, 7vw, 84px) minmax(0, 1fr); gap: clamp(12px, 2vw, 20px); padding: 16px 0; border-top: 4px solid {{t.ink}}">
        <span aria-hidden="true" style="font-family: Anton, Impact, sans-serif; font-size: clamp(44px, 5.4vw, 64px); line-height: .9; color: #1D4ED8">02</span>
        <span style="display: flex; flex-direction: column; gap: 6px">
          <h2 id="h-browse" style="margin: 0; font-weight: 800; font-size: clamp(20px, 2.4vw, 26px); line-height: 1.1">On jette un œil quand même ?</h2>
          <span style="color: {{t.soft}}">La base documentaire se parcourt déjà : fiches d'albums, de séries et d'auteurs, et recherche avancée.</span>
          <span style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px">
            <sc-for list="{{browse}}" as="b" hint-placeholder-count="3">
              <a href="#" style="padding: 6px 12px; background: {{t.ink}}; color: {{t.bg}}; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .04em">{{b}}</a>
            </sc-for>
          </span>
          <span style="display: flex">
            <a href="#" style="padding: 6px 12px; background: #1D4ED8; color: #FFFFFF; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .04em">Recherche avancée</a>
          </span>
        </span>
      </section>

      <section aria-labelledby="h-admin" style="display: grid; grid-template-columns: clamp(52px, 7vw, 84px) minmax(0, 1fr); gap: clamp(12px, 2vw, 20px); padding: 16px 0 20px; border-top: 2px solid {{t.ink}}; border-bottom: 4px solid {{t.ink}}">
        <span aria-hidden="true" style="font-family: Anton, Impact, sans-serif; font-size: clamp(44px, 5.4vw, 64px); line-height: .9; color: #E63946">03</span>
        <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px">
          <h2 id="h-admin" style="margin: 0; font-weight: 800; font-size: clamp(20px, 2.4vw, 26px); line-height: 1.1">C'est votre collection ?</h2>
          <span style="color: {{t.soft}}">Ajoutez une première édition, ou reprenez les données de l'application existante, depuis l'administration.</span>
          <a href="#" style="margin-top: 6px; padding: 10px 16px; background: {{accent}}; color: #FFFFFF; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; box-shadow: 4px 4px 0 {{t.ink}}">Ouvrir l'administration →</a>
          <span style="margin-top: 4px; font-size: 12px; color: {{t.muted}}">La connexion est demandée à l'ouverture.</span>
        </span>
      </section>
    </div>
    </sc-if>

    <sc-if value="{{full}}">

    <section aria-labelledby="h-hero" style="flex: 0 1 clamp(250px, 34vw, 460px); min-width: 0; margin: 0 auto; aspect-ratio: 210 / 297; padding: clamp(14px, 2vw, 24px); box-sizing: border-box; background: #E63946; color: #111111; display: flex; flex-direction: column; box-shadow: 18px 18px 0 #111111; transform: rotate(-1.5deg)">
      <a href="#" style="font-family: Anton, Impact, sans-serif; font-size: clamp(48px, 7vw, 104px); line-height: .85; letter-spacing: -0.01em; text-transform: uppercase; color: #FFFFFF">BDthèque</a>
      <div style="display: flex; justify-content: space-between; margin-top: 8px; padding: 4px 0; border-top: 3px solid #111111; border-bottom: 3px solid #111111; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .06em">
        <span>N° 2 847</span><span>Octobre</span><span>Gratuit</span>
      </div>
      <a href="#" style="position: relative; flex: 1; margin: 18px 0; background: #2E2A33; display: flex; align-items: center; justify-content: center; color: #A79FB0; font-size: 13px; border: 4px solid #111111">
        <span>[Couverture de l'édition à la une]</span>
        <span class="featured-tag" style="position: absolute; right: -10px; bottom: 14px; max-width: 78%; padding: 6px 10px; background: #FFD60A; color: #111111; transform: rotate(3deg); display: flex; flex-direction: column; gap: 1px; line-height: 1.2; box-shadow: 4px 4px 0 #111111">
          <span style="font-family: Anton, Impact, sans-serif; font-size: 15px; text-transform: uppercase">À la une : Le Lotus bleu (Les Aventures de Tintin - T. 5)</span>
          <span style="font-weight: 600; font-size: 12px">Tintin en Chine, face aux trafiquants d'opium…</span>
          <span style="font-size: 10px">Casterman (Les Aventures de Tintin) [1946]</span>
        </span>
      </a>
      <h1 id="h-hero" style="margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: clamp(24px, 3.2vw, 44px); line-height: .95; text-transform: uppercase; color: #FFFFFF">{{heroLine}}</h1>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px">
        <a href="#" style="padding: 6px 12px; background: #111111; color: #FFFFFF; font-weight: 800"><span style="color: #FFD60A">412</span> séries</a>
        <a href="#" style="padding: 6px 12px; background: #111111; color: #FFFFFF; font-weight: 800"><span style="color: #FFD60A">2 913</span> éditions</a>
      </div>
    </section>

    <section aria-labelledby="h-toc" style="flex: 1.3 1 520px; min-width: 0; display: flex; flex-direction: column">
      <h2 id="h-toc" style="margin: 0 0 8px; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: clamp(40px, 5vw, 64px); line-height: 1; text-transform: uppercase">Au sommaire</h2>

      <div class="entry" style="display: grid; grid-template-columns: clamp(52px, 7vw, 84px) minmax(0, 1fr); gap: clamp(12px, 2vw, 20px); padding: 16px 0; border-top: 4px solid {{t.ink}}">
        <span class="pageno" style="font-family: Anton, Impact, sans-serif; font-size: clamp(44px, 5.4vw, 64px); line-height: .9; color: #E63946">04</span>
        <span style="display: flex; flex-direction: column; gap: 6px">
          <h2 style="margin: 0; font-weight: 800; font-size: clamp(20px, 2.4vw, 26px); line-height: 1.1"><a href="#">Tout juste arrivés !</a></h2>
          <span style="color: {{t.soft}}">Six nouveautés, dont le tome 7 de Blacksad et le 40ᵉ Astérix.</span>
          <span style="display: flex; gap: 8px; margin-top: 6px">
            <sc-for list="{{recents}}" as="r" hint-placeholder-count="6">
              <a href="#" aria-label="{{r.label}}" title="{{r.label}}" style="display: block; width: 44px; aspect-ratio: 3 / 4; background: #2E2A33; border: 3px solid {{r.c}}"></a>
            </sc-for>
          </span>
        </span>
      </div>

      <div class="entry" style="display: grid; grid-template-columns: clamp(52px, 7vw, 84px) minmax(0, 1fr); gap: clamp(12px, 2vw, 20px); padding: 16px 0; border-top: 2px solid {{t.ink}}">
        <span class="pageno" style="font-family: Anton, Impact, sans-serif; font-size: clamp(44px, 5.4vw, 64px); line-height: .9; color: #1D4ED8">12</span>
        <span style="display: flex; flex-direction: column; gap: 6px">
          <h2 style="margin: 0; font-weight: 800; font-size: clamp(20px, 2.4vw, 26px); line-height: 1.1"><a href="#">Ça vaut combien, tout ça ?</a></h2>
          <span style="color: {{t.soft}}">Notre enquête : <strong style="color: {{t.ink}}">38 760 €</strong> au total, <strong style="padding: 0 4px; background: #FFD60A; color: #111111">55 230 € d'aujourd'hui</strong>. Un album coûte en moyenne 13,10 € (18,70 € du jour), le plus cher 189,00 € (214,50 € du jour).</span>
          <span style="font-size: 12px; color: {{t.muted}}">Valeur connue 31 482 € (44 910 € du jour) · médian 11,90 € (16,40 € du jour) · le moins cher 0,90 € (3,20 € du jour) · 12 montants non convertibles exclus · 25 éd. gratuites non valorisées.</span>
        </span>
      </div>

      <div class="entry" style="display: grid; grid-template-columns: clamp(52px, 7vw, 84px) minmax(0, 1fr); gap: clamp(12px, 2vw, 20px); padding: 16px 0; border-top: 2px solid {{t.ink}}">
        <span class="pageno" style="font-family: Anton, Impact, sans-serif; font-size: clamp(44px, 5.4vw, 64px); line-height: .9; color: {{t.ink}}">18</span>
        <span style="display: flex; flex-direction: column; gap: 6px">
          <h2 style="margin: 0; font-weight: 800; font-size: clamp(20px, 2.4vw, 26px); line-height: 1.1"><a href="#">Tomes, intégrales ou hors-séries ?</a></h2>
          <span style="color: {{t.soft}}">Neuf albums sur dix sont des tomes classiques : 2 571 réguliers, 184 intégrales, 92 hors-séries.</span>
          <span role="img" aria-label="90 % réguliers, 6 % intégrales, 3 % hors-séries" style="display: flex; gap: 3px; margin-top: 6px; font-family: Anton, Impact, sans-serif; font-size: 22px; line-height: 1">
            <span style="flex: 90 1 0; padding: 6px 8px; background: #FFD60A; color: #111111">90 %</span>
            <span style="flex: 6 1 0; min-width: 48px; padding: 6px 4px; background: #1D4ED8; color: #FFFFFF; font-size: 15px">6 %</span>
            <span style="flex: 3 1 0; min-width: 40px; padding: 6px 4px; background: #E63946; color: #FFFFFF; font-size: 15px">3 %</span>
          </span>
        </span>
      </div>

      <div class="entry" style="display: grid; grid-template-columns: clamp(52px, 7vw, 84px) minmax(0, 1fr); gap: clamp(12px, 2vw, 20px); padding: 16px 0; border-top: 2px solid {{t.ink}}">
        <span class="pageno" style="font-family: Anton, Impact, sans-serif; font-size: clamp(44px, 5.4vw, 64px); line-height: .9; color: #E63946">22</span>
        <span style="display: flex; flex-direction: column; gap: 6px">
          <h2 style="margin: 0; font-weight: 800; font-size: clamp(20px, 2.4vw, 26px); line-height: 1.1"><a href="#">Plutôt quel genre ?</a></h2>
          <span style="color: {{t.soft}}">L'aventure en tête avec 612 albums, l'humour juste derrière.</span>
          <span style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; margin-top: 4px">
            <sc-for list="{{genres}}" as="g" hint-placeholder-count="7">
              <a href="#" style="font-size: {{g.fs}}; font-weight: 800; font-style: {{g.fi}}; color: {{g.c}}; text-transform: uppercase">{{g.name}}</a>
            </sc-for>
          </span>
        </span>
      </div>

      <div class="entry" style="display: grid; grid-template-columns: clamp(52px, 7vw, 84px) minmax(0, 1fr); gap: clamp(12px, 2vw, 20px); padding: 16px 0; border-top: 2px solid {{t.ink}}; border-bottom: 4px solid {{t.ink}}">
        <span class="pageno" style="font-family: Anton, Impact, sans-serif; font-size: clamp(44px, 5.4vw, 64px); line-height: .9; color: #1D4ED8">28</span>
        <span style="display: flex; flex-direction: column; gap: 6px">
          <h2 style="margin: 0; font-weight: 800; font-size: clamp(20px, 2.4vw, 26px); line-height: 1.1"><a href="#">Chez quels éditeurs ?</a></h2>
          <span style="color: {{t.soft}}">Dargaud et Dupuis au coude à coude, Casterman sur le podium.</span>
          <span style="display: flex; align-items: flex-end; gap: 6px; margin-top: 6px">
            <sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
              <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 110px">
                <span style="font-weight: 800; font-size: 13px">{{p.name}} · {{p.n}}</span>
                <span style="width: 100%; height: {{p.h}}; background: {{p.c}}; color: {{p.tc}}; display: flex; align-items: flex-start; justify-content: center; padding-top: 4px; box-sizing: border-box; font-family: Anton, Impact, sans-serif; font-size: 26px">{{p.rank}}</span>
              </div>
            </sc-for>
          </span>
        </span>
      </div>
      <p style="margin: 14px 0 0; font-size: 13px; color: {{t.muted}}">Chaque titre de rubrique mène à sa liste ou à sa page détaillée ; chaque album, à sa fiche ; chaque genre, à sa liste ; chaque éditeur, à son site web lorsqu’il est connu.</p>
    </section>
    </sc-if>
  </main>

  <footer style="max-width: 1280px; margin: 0 auto; padding: 24px; display: flex; flex-wrap: wrap; justify-content: {{footerJustify}}; gap: 12px 24px; font-size: 13px; color: {{t.muted}}">
    <sc-if value="{{full}}"><span>Montants convertis en euro (taux Frankfurter, inflation INSEE)</span></sc-if>
    <a href="#" style="font-weight: 800">Administration</a>
  </footer>
</div>
</template>
<script>
const HERO_LINES = [
  'Entrez donc, il y a de quoi lire !',
  'Installez-vous, la collection vous attend !',
  'Alors, on bouquine ?',
  'Encore de la place sur les étagères ? Pas sûr…',
  'Attention, ça déborde des étagères !'
];
class View extends Mockup {
  componentDidMount() {
    this.setState({ heroIndex: Math.floor(Math.random() * HERO_LINES.length) });
  }
  renderVals() {
    // Pop magazine print: three process inks (red, blue, yellow) plus black on newsprint.
    const themes = {
      papier: { bg: '#FAF7F0', ink: '#111111', soft: '#2A2A2A', muted: '#5C5C5C' },
      noir: { bg: '#111111', ink: '#F5F1E8', soft: '#DDDDDD', muted: '#A8A8A8' }
    };
    const t = themes[this.props.theme] ?? themes.papier;
    const inks = ['#E63946', '#1D4ED8', t.ink];
    const genres = [['Aventure', 612], ['Humour', 488], ['Science-fiction', 341], ['Policier', 297], ['Fantastique', 254], ['Historique', 231], ['Western', 118]];
    const vide = this.props.vide;
    return {
      vide,
      full: !vide,
      // Without the search field, the help button no longer needs room to grow beside the menu.
      toolsFlex: vide ? 'none' : '0 1 340px',
      footerJustify: vide ? 'flex-end' : 'space-between',
      browse: ['Albums', 'Séries', 'Auteurs'],
      t,
      accent: this.props.accent ?? '#E63946',
      heroLine: HERO_LINES[this.state?.heroIndex ?? 0],
      recents: [
        { label: 'Alors, tout tombe (Blacksad - T. 7)', c: '#E63946' },
        { label: "L'Iris blanc (Astérix - T. 40)", c: '#1D4ED8' },
        { label: 'Les Indes fourbes', c: '#FFD60A' },
        { label: 'Le Château des étoiles - INT. [1 à 2]', c: t.ink },
        { label: 'Mister Prairie (Undertaker - T. 7)', c: '#E63946' },
        { label: 'Spirou et Fantasio - Hors-série 2', c: '#1D4ED8' }
      ],
      genres: genres.map(([name, v], i) => ({ name, fs: (13 + Math.round(v / 612 * 17)) + 'px', fi: i % 2 ? 'italic' : 'normal', c: inks[i % 3] })),
      // Podium order: second, first, third, as on a real podium.
      podium: [
        { name: 'Dupuis', n: '506', rank: '2', h: '62px', c: '#1D4ED8', tc: '#FFFFFF' },
        { name: 'Dargaud', n: '548', rank: '1', h: '84px', c: '#FFD60A', tc: '#111111' },
        { name: 'Casterman', n: '351', rank: '3', h: '44px', c: '#E63946', tc: '#FFFFFF' }
      ]
    };
  }
}

Mockup.mount(View, {"theme": {"label": "Thème", "editor": "enum", "options": ["papier", "noir"], "default": "papier"}, "accent": {"label": "Accent", "editor": "color", "default": "#E63946", "options": ["#E63946", "#1D4ED8", "#111111"]}, "vide": {"label": "Collection vide", "editor": "boolean", "default": false}});
</script>
</body>
</html>
