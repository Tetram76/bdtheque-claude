<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&amp;family=DM+Sans:wght@400;500;700&amp;family=Patrick+Hand&amp;family=Delius&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff}
a{color:inherit;text-decoration:none}
.sheet{min-height:100vh;background:#fff;color:#111;font-family:var(--text-font);font-size:15px;line-height:1.45}
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:3px solid #111;padding:10px clamp(12px,3vw,24px)}
.top-in{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.logo{padding:3px 14px;border:3px solid #111;background:#fff;font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:800;transform:rotate(-2deg);box-shadow:4px 4px 0 #111}
.menu{display:flex;gap:6px;white-space:nowrap;width:max-content;padding:2px}
.menu a{padding:7px 15px;border:2px solid #111;border-radius:999px;font-weight:700}
.menu a[aria-current]{background:#111;color:#fff}
.search{flex:1;display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border:2px solid #111;border-radius:999px;background:#fff}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:#111;outline:none}
.help{width:42px;height:42px;flex:none;border:2px solid #111;border-radius:50%;font:700 18px 'DM Sans',sans-serif;color:#111;cursor:pointer}
/* The page: cases of varied widths, laid out in strips like a comic page, on white gutters. */
.page{max-width:1280px;margin:0 auto;padding:44px clamp(12px,3vw,24px) 12px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:26px 16px}
.case{grid-column:span var(--span);position:relative;min-width:0;padding:16px 18px 18px;border:3px solid #111;box-sizing:border-box;color:var(--ink)}
.head{display:flex;margin-bottom:6px}
.head.right{justify-content:flex-end}
.head.center{justify-content:center}
[data-bubble]{display:inline-block;max-width:min(100%,560px);margin:0 0 26px;padding:12px 24px;box-sizing:border-box;color:#111;font-family:var(--lettering);font-weight:var(--lettering-weight);font-size:var(--bubble-size);line-height:1.12;letter-spacing:var(--lettering-spacing);text-wrap:balance}
[data-bubble][data-shape=cloud]{padding:20px 36px 18px;margin-bottom:46px}
[data-bubble][data-shape=star]{padding:30px 44px;margin:26px 0 46px;margin-inline:calc(5% + 16px)}
h1[data-bubble]{--bubble-size:clamp(24px,3.4vw,40px)}
h2[data-bubble]{--bubble-size:var(--title-size)}
/* A title balloon straddles the top edge of its case, as in a comic, which saves height. */
.head [data-bubble]{margin-top:-32px}
.head [data-bubble][data-shape=cloud]{margin-top:-20px}
.head [data-bubble][data-shape=star]{margin-top:-14px}
/* A caption box set in a corner of its case, as a narrator's box in a comic. */
.caption{position:absolute;right:-3px;bottom:-3px;max-width:70%;padding:4px 10px;border:3px solid #111;background:#fff;color:#111;font-size:12px;line-height:1.3}
.caption.left{right:auto;left:-3px}
a.caption{font-weight:700;font-size:13px}
a.caption:hover{background:#111;color:#fff}
.inset{border:3px solid #111;background:#fff;color:#111}
.cover{border:3px solid #111;background:#35303A;color:#B9B1C2;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;aspect-ratio:3/4;box-sizing:border-box;padding:10px}
.today{display:inline-block;padding:1px 8px;border:2px solid #111;border-radius:6px;background:#fff;color:#111;font-weight:700}
.big{font-family:Fraunces,Georgia,serif;font-weight:800;line-height:1}
.bars{position:absolute;left:24px;right:24px;bottom:84px;top:-34px;display:flex;align-items:flex-end;gap:14px;pointer-events:none}
.bar{flex:1;border:3px solid #111;border-bottom:0;box-sizing:border-box;position:relative}
.bar .n{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;font-family:Fraunces,Georgia,serif;font-weight:800;font-size:18px}
.bar.out .n{bottom:auto;top:8px;padding:2px 8px;border:2px solid #111;background:#fff;color:#111}
.bar.out{box-shadow:5px 0 0 #111;z-index:5}
@media (max-width:700px){
  .page{gap:14px;padding-top:40px}
  .case{grid-column:1/-1}
  .top-in{gap:8px 12px}
  .tools{flex-basis:100%!important;max-width:none!important}
  .featured{grid-template-columns:96px minmax(0,1fr)!important}
  .featured .cover{margin-left:-14px!important}
}
</style>
<script src="../shared/mockup.js"></script>
<script src="../shared/comic-bubbles.js"></script>
<script src="../shared/comic-frames.js"></script>
</head>
<body>
<div id="mockup"></div>
<template id="view">
<div class="sheet" data-bubble-mode="{{bubbleMode}}" data-frame-mode="{{frameMode}}" style="--text-font: {{textFont}}; --lettering: {{font.family}}; --lettering-weight: {{font.weight}}; --lettering-spacing: {{font.spacing}}; --title-size: {{font.title}}">

  <header class="top"><div class="top-in">
    <a href="#" class="logo">BDthèque</a>
    <nav aria-label="Navigation principale" data-scroll-hint="" style="flex: 999 1 {{tools.navBasis}}; --hint-bg: #fff"><div data-scroll="">
      <div class="menu">
        <a href="#" aria-current="page">Accueil</a>
        <a href="#">Albums</a>
        <a href="#">Séries</a>
        <a href="#">Auteurs</a>
        <a href="#">Intentions d'achat</a>
      </div>
    </div></nav>
    <div class="tools" style="display: flex; align-items: center; gap: 8px; flex: {{tools.flex}}; max-width: 360px">
      <sc-if value="{{full}}">
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rechercher</label>
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="q" type="search" placeholder="Une série, un auteur…">
      </div>
      </sc-if>
      <button type="button" class="help" aria-label="Aide sur cette page" style="background: {{c.help}}">?</button>
    </div>
  </div></header>

  <main class="page">

    <sc-if value="{{vide}}">
    <section class="case" data-frame="" aria-labelledby="h-welcome" style="--span: 12; background: {{c.empty}}; --ink: {{ink}}; padding-bottom: 26px">
      <div class="head"><h1 id="h-welcome" data-bubble="exclamation">Les étagères attendent leur premier album !</h1></div>
      <div style="display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: flex-end">
        <div style="flex: 1 1 360px; min-width: 0">
          <p style="margin: 0 0 10px; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(19px, 2.2vw, 23px); line-height: 1.25">La collection ne compte encore aucune édition.</p>
          <p style="margin: 0 0 10px; max-width: 56ch">Le tableau de bord s'affichera dès la première édition entrée : l'édition à la une, les dernières arrivées, la valeur de la collection et ses statistiques.</p>
          <p style="margin: 0; max-width: 56ch; font-size: 13px">Les albums, séries et auteurs déjà présents dans la base restent consultables, même s'ils ne font pas encore partie de la collection.</p>
        </div>
        <div aria-hidden="true" style="flex: 1 1 320px; min-width: 0; display: flex; align-items: flex-end; justify-content: center; gap: 10px; height: 180px; padding: 0 12px; border-bottom: 6px solid #111">
          <span style="flex: none; display: flex; align-items: flex-end">
            <span style="width: 30px; height: 80px; background: #111; clip-path: polygon(70% 0, 100% 0, 100% 100%, 0 100%, 0 72%, 70% 72%)"></span>
            <span style="position: relative; margin-left: 12px; width: 32px; height: 146px; border: 3px solid #111; border-bottom: 0; box-sizing: border-box; background: {{c.tome}}; transform: rotate(-8deg); transform-origin: bottom left; display: flex; align-items: center; justify-content: center">
              <span style="writing-mode: vertical-rl; font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 13px; letter-spacing: .08em; color: #111">TOME 1</span>
            </span>
          </span>
          <sc-for list="{{slots}}" as="s">
            <span style="flex: 0 1 {{s.w}}; min-width: 14px; height: {{s.h}}; border: 2px dashed {{ink}}; border-bottom: 0; box-sizing: border-box"></span>
          </sc-for>
        </div>
      </div>
    </section>

    <section class="case" data-frame="" aria-labelledby="h-browse" style="--span: 5; background: {{c.browse}}; --ink: {{ink}}; padding-bottom: 28px">
      <div class="head"><h2 id="h-browse" data-bubble="question">On jette un œil quand même ?</h2></div>
      <p style="margin: 0 0 14px">La base documentaire se parcourt déjà : fiches d'albums, de séries et d'auteurs, et recherche avancée.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <a href="#" class="inset" style="padding: 5px 14px; border-radius: 999px; font-weight: 700">Albums</a>
        <a href="#" class="inset" style="padding: 5px 14px; border-radius: 999px; font-weight: 700">Séries</a>
        <a href="#" class="inset" style="padding: 5px 14px; border-radius: 999px; font-weight: 700">Auteurs</a>
      </div>
      <div style="display: flex; margin-top: 8px">
        <a href="#" class="inset" style="padding: 5px 14px; border-radius: 999px; font-weight: 700">Recherche avancée</a>
      </div>
    </section>

    <section class="case" data-frame="" aria-labelledby="h-admin" style="--span: 7; background: {{c.admin}}; --ink: {{ink}}; padding-bottom: 40px">
      <div class="head right"><h2 id="h-admin" data-bubble="question">C'est votre collection ?</h2></div>
      <p style="margin: 0 0 16px">Ajoutez une première édition, ou reprenez les données de l'application existante, depuis l'administration.</p>
      <a href="#" style="display: inline-block; padding: 9px 20px; border: 3px solid #111; background: #111; color: #fff; font-weight: 700; box-shadow: 4px 4px 0 #fff">Ouvrir l'administration →</a>
      <span class="caption">La connexion est demandée à l'ouverture.</span>
    </section>
    </sc-if>

    <sc-if value="{{full}}">
    <section class="case" data-frame="" aria-labelledby="h-hero" style="--span: 7; background: {{c.welcome}}; --ink: {{ink}}; display: flex; align-items: center; justify-content: center; padding: 22px 22px 8px">
      <h1 id="h-hero" data-bubble="{{heroKind}}" style="text-align: center">{{heroLine}}</h1>
    </section>

    <section class="case" data-frame="" aria-label="La collection en chiffres" style="--span: 5; background: {{c.counters}}; --ink: {{ink}}; display: flex; gap: 10px; align-items: center; padding: 22px 18px">
      <sc-for list="{{counters}}" as="k">
        <div class="inset" style="flex: 1 1 0; min-width: 0; padding: 10px 12px; transform: rotate({{k.rot}})">
          <div class="big" style="font-size: clamp(22px, 3.2vw, 38px)">{{k.n}}</div>
          <div style="margin-top: 4px; font-weight: 700">{{k.label}}</div>
        </div>
      </sc-for>
    </section>

    <section class="case" data-frame="" aria-labelledby="h-featured" style="--span: 5; background: {{c.featured}}; --ink: {{ink}}">
      <div class="head"><h2 id="h-featured" data-bubble="exclamation">À la une aujourd'hui !</h2></div>
      <a href="#" class="featured" style="display: grid; grid-template-columns: clamp(100px, 13vw, 150px) minmax(0, 1fr); gap: 16px; align-items: start">
        <!-- The cover breaks out of its case, over the left border: the page's eye-catcher. -->
        <div class="cover" style="margin-left: -34px; transform: rotate(-3deg); box-shadow: 6px 6px 0 #111">[Visuel de couverture]</div>
        <div style="min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <span style="font-family: Fraunces, Georgia, serif; font-size: clamp(19px, 2vw, 25px); font-weight: 800; line-height: 1.1">{{featured.album}}</span>
          <span style="font-size: 13px; font-weight: 700">{{featured.edition}}</span>
          <p style="margin: 4px 0 0; font-size: 14px">{{featured.summary}}</p>
        </div>
      </a>
    </section>

    <section class="case" data-frame="" aria-labelledby="h-recent" style="--span: 7; background: {{c.recents}}; --ink: {{ink}}; padding-bottom: 34px">
      <div class="head right"><h2 id="h-recent" data-bubble="exclamation">Tout juste arrivés !</h2></div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(96px, calc((100% - 2 * 12px) / 3)), 1fr)); gap: 14px 12px">
        <sc-for list="{{recents}}" as="r">
          <a href="#" style="display: flex; flex-direction: column; gap: 6px">
            <div class="cover" style="transform: rotate({{r.rot}})">[Visuel de couverture]</div>
            <span style="font-size: 13px; font-weight: 700; line-height: 1.2">{{r.label}}</span>
            <span style="font-size: 12px">{{r.meta}}</span>
          </a>
        </sc-for>
      </div>
      <a href="#" class="caption">Tous les albums →</a>
    </section>

    <section class="case" data-frame="" aria-labelledby="h-value" style="--span: 8; background: {{c.value}}; --ink: {{ink}}; padding-bottom: 40px">
      <div class="head"><h2 id="h-value" data-bubble="question">Ça vaut combien, tout ça ?</h2></div>
      <div style="display: flex; flex-wrap: wrap; gap: 12px">
        <sc-for list="{{totals}}" as="v">
          <div class="inset" style="flex: 1 1 220px; padding: 12px 16px">
            <div style="font-weight: 700">{{v.label}}</div>
            <div style="margin-top: 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px">
              <span class="big" style="font-size: clamp(26px, 3.4vw, 36px)">{{v.cur}}</span>
              <span class="today" style="font-size: 18px">{{v.today}}</span>
            </div>
            <p style="margin: 8px 0 0; font-size: 13px">{{v.note}}</p>
          </div>
        </sc-for>
      </div>
      <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px">
        <sc-for list="{{prices}}" as="p">
          <div style="padding: 8px 12px; border: 2px dashed {{ink}}; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 13px">{{p.label}}</span>
            <strong style="font-size: 18px">{{p.cur}}</strong>
            <span><span class="today" style="font-size: 13px">{{p.today}}</span></span>
          </div>
        </sc-for>
      </div>
      <p style="margin: 12px 0 0; font-size: 13px">Montants en € courants, ce que ça a coûté ; <span class="today" style="font-size: 12px">encadrés</span>, en € du jour, ce que ça représente aujourd'hui.</p>
      <span class="caption">12 montants non convertibles exclus · 25 éditions gratuites non valorisées.</span>
    </section>

    <!-- The regular albums outweigh the two other kinds: their bar breaks out of the top of the
         case, over the gutter, to stress its weight (only when it doubles the next one at least). -->
    <section class="case" data-frame="" aria-labelledby="h-type" style="--span: 4; background: {{c.type}}; --ink: {{ink}}; min-height: 330px; display: flex; flex-direction: column; padding-bottom: 34px">
      <div class="head right" style="position: relative; z-index: 6"><h2 id="h-type" data-bubble="question" style="max-width: 60%">Tomes, intégrales ou hors-séries ?</h2></div>
      <div role="img" aria-label="2 571 réguliers, 184 intégrales, 92 hors-séries" class="bars">
        <sc-for list="{{types}}" as="b">
          <div class="bar {{b.out}}" style="height: {{b.h}}; background: {{b.c}}"><span class="n">{{b.n}}</span></div>
        </sc-for>
      </div>
      <div style="margin-top: auto; display: flex; gap: 14px; padding: 0 6px; border-top: 4px solid {{ink}}; text-align: center; font-size: 14px">
        <sc-for list="{{types}}" as="b">
          <span style="flex: 1; padding-top: 6px"><strong>{{b.label}}</strong><br>{{b.pct}}</span>
        </sc-for>
      </div>
    </section>

    <section class="case" data-frame="" aria-labelledby="h-genre" style="--span: 4; background: {{c.genres}}; --ink: {{ink}}; padding-bottom: 36px">
      <div class="head"><h2 id="h-genre" data-bubble="question">Plutôt quel genre ?</h2></div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
        <sc-for list="{{genres}}" as="g">
          <a href="#" class="inset" style="display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 12px; border-radius: 999px; font-weight: 700; font-size: {{g.fs}}">{{g.name}} <span style="padding: 1px 8px; border-radius: 999px; background: #111; color: #fff; font-size: 12px">{{g.n}}</span></a>
        </sc-for>
      </div>
      <span class="caption">Un album peut cumuler plusieurs genres.</span>
    </section>

    <section class="case" data-frame="" aria-labelledby="h-pub" style="--span: 8; background: {{c.publishers}}; --ink: {{ink}}; padding-bottom: 36px">
      <div class="head"><h2 id="h-pub" data-bubble="question">Chez quels éditeurs ?</h2></div>
      <div style="display: flex; flex-direction: column; gap: 7px">
        <sc-for list="{{publishers}}" as="e">
          <div style="display: grid; grid-template-columns: 100px minmax(0, 1fr) 46px; align-items: center; gap: 12px; font-size: 14px">
            <span style="font-weight: 700">{{e.name}}</span>
            <span style="height: 16px; border: 2px solid #111; background: #fff; box-sizing: border-box"><span style="display: block; height: 100%; width: {{e.w}}; background: {{e.c}}; border-right: 2px solid #111; box-sizing: border-box"></span></span>
            <span style="text-align: right; font-variant-numeric: tabular-nums">{{e.n}}</span>
          </div>
        </sc-for>
      </div>
      <span class="caption">Éditions possédées.</span>
    </section>
    </sc-if>
  </main>

  <footer style="max-width: 1280px; margin: 0 auto; padding: 14px clamp(12px, 3vw, 24px) 24px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; font-size: 13px">
    <span><sc-if value="{{full}}">Montants convertis en euro (taux Frankfurter, inflation INSEE)</sc-if></span>
    <span aria-hidden="true" style="font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 15px">— 1 —</span>
    <a href="#" style="justify-self: end; font-weight: 700">Administration</a>
  </footer>
</div>
</template>
<script>
const HERO_LINES = [
  'Entrez donc, il y a de quoi lire !',
  'Installez-vous, la collection vous attend !',
  'Alors, on bouquine ?',
  'Encore de la place sur les étagères ? Pas sûr…',
  'Attention, ça déborde des étagères !'
];
// Case colours: seven hues (yellow, blue, coral, green, violet, pink, turquoise), most cases in
// their four-colour process version, about one in four in their softer "ligne claire" version. All
// are readable under black text. Balloons, insets and captions stay white.
const PALETTE = {
  ink: '#111',
  cases: ['#FFC93C', '#4FB0E6', '#F2775A', '#63C36A', '#A47AE0', '#F483AE', '#33C2B1'],
  soft: ['#F4D35E', '#8EC5E8', '#F2A07B', '#9FD39A', '#C9A7E3', '#F6B8C8', '#7FD1C7']
};
const FONTS = {
  manuscrit: { family: "'Patrick Hand', 'Comic Neue', cursive", weight: 400, spacing: '0.01em', title: '25px' },
  serif: { family: 'Fraunces, Georgia, serif', weight: 800, spacing: '0', title: '22px' }
};
// Running text: drawn enough to suit a comic page, plain enough to read at length.
const TEXT_FONT = "Delius, 'DM Sans', system-ui, sans-serif";
const FULL_CASES = ['welcome', 'counters', 'featured', 'recents', 'value', 'type', 'genres', 'publishers'];
const EMPTY_CASES = ['empty', 'browse', 'admin'];
const FEATURED = {
  album: 'Le Lotus bleu (Les Aventures de Tintin - T. 5)',
  edition: 'Casterman (Les Aventures de Tintin) [1946]',
  summary: "Invité en Chine, Tintin s'attaque à un réseau de trafiquants d'opium, déjoue les manœuvres de l'occupant et se lie d'amitié avec le jeune Tchang."
};
class View extends Mockup {
  componentDidMount() {
    // The colours of the cases are dealt anew at each display, in a shuffled order of the palette:
    // consecutive cases, side by side as one above the other, never share a colour.
    const order = [0, 1, 2, 3, 4, 5, 6];
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    // About one case in four takes the softer version of its hue.
    const soft = [...Array(FULL_CASES.length).keys()].sort(() => Math.random() - 0.5).slice(0, 2);
    this.setState({ heroIndex: Math.floor(Math.random() * HERO_LINES.length), order, soft });
  }
  renderVals() {
    const variant = PALETTE;
    const order = this.state?.order ?? [0, 1, 2, 3, 4, 5, 6];
    const vide = this.props.vide;
    const keys = vide ? EMPTY_CASES : FULL_CASES;
    const c = {};
    const soft = (this.state?.soft ?? []).slice(0, vide ? 1 : 2);
    keys.forEach((key, i) => {
      const hue = order[i % order.length];
      c[key] = (soft.includes(i) ? variant.soft : variant.cases)[hue];
    });
    const marks = variant.cases;
    // Marks of a chart never take the hue of their case, in either version.
    const hueOf = (colour) => Math.max(variant.cases.indexOf(colour), variant.soft.indexOf(colour));
    const other = (exclude, n) => marks.filter((_, hue) => hue !== hueOf(exclude)).slice(0, n);
    c.help = marks[order[1]];
    c.tome = marks[order[3]];
    // The narrow no-break space of the French thousands is missing from the display font.
    const fmt = (v) => v.toLocaleString('fr-FR').replace(/ /g, ' ');
    const heroLine = HERO_LINES[this.state?.heroIndex ?? 0];

    // A bar breaks out of its case only when it at least doubles the next one; the others keep
    // their true proportion to it. 220 px is the height of the bars' area inside the case.
    const types = [['réguliers', 2571, '90 %'], ['intégrales', 184, '6 %'], ['hors-séries', 92, '3 %']];
    const sorted = types.map((t) => t[1]).sort((a, b) => b - a);
    const breaksOut = sorted[0] >= 2 * sorted[1];
    const typeColors = other(c.type, 3);
    const area = 210;

    const genres = [['Aventure', 612], ['Humour', 488], ['Science-fiction', 341], ['Policier', 297], ['Fantastique', 254], ['Historique', 231], ['Western', 118], ['Autres', 506]];

    const pubColors = other(c.publishers, 6);
    return {
      vide,

      heroLine,
      heroKind: heroLine.includes('?') ? 'question' : 'exclamation',
      counters: [
        { n: fmt(2847), label: 'albums', rot: '-2deg' },
        { n: '412', label: 'séries', rot: '1.5deg' },
        { n: fmt(2913), label: 'éditions', rot: '-1deg' }
      ],
      featured: FEATURED,
      recents: [
        { label: 'Alors, tout tombe (Blacksad - T. 7)', meta: 'Dargaud · 3 oct.', rot: '-2deg' },
        { label: "L'Iris blanc (Astérix - T. 40)", meta: 'Albert René · 28 sept.', rot: '1.5deg' },

        { label: 'Mister Prairie (Undertaker - T. 7)', meta: 'Dargaud · 9 sept.', rot: '-1.5deg' },
        { label: 'Spirou et Fantasio - Hors-série 2', meta: 'Dupuis · 2 sept.', rot: '1deg' }
      ],
      totals: [
        { label: 'Valeur totale estimée', cur: '38 760 €', today: '55 230 €', note: 'Prix connus + estimation de 497 éditions sans prix.' },
        { label: 'Valeur totale connue', cur: '31 482 €', today: '44 910 €', note: 'Sur 2 391 éditions au prix renseigné.' }
      ],
      prices: [
        { label: 'Prix moyen', cur: '13,10 €', today: '18,70 €' },
        { label: 'Prix médian', cur: '11,90 €', today: '16,40 €' },
        { label: 'Le moins cher', cur: '0,90 €', today: '3,20 €' },
        { label: 'Le plus cher', cur: '189,00 €', today: '214,50 €' }
      ],
      types: types2,
      genres: genres.map(([name, v]) => ({ name, n: fmt(v), fs: (13 + Math.round(v / 612 * 5)) + 'px' })),
      publishers: pubs.map(([name, v], i) => ({ name, n: fmt(v), w: Math.round(v / 548 * 100) + '%', c: pubColors[i % pubColors.length] }))
    };
  }
}
