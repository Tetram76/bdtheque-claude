<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche d'univers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;family=Delius&amp;family=Anton&amp;family=Baloo+2:wght@600;700;800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;family=DM+Serif+Display:ital@0;1&amp;family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&amp;family=Karla:wght@400;500;700&amp;family=Libre+Franklin:ital,wght@0,400;0,600;0,800;1,800&amp;family=Nunito:wght@400;600;700&amp;family=Rubik+Mono+One&amp;family=Space+Grotesk:wght@400;500;700&amp;family=Inter+Tight:wght@400..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
input::placeholder{color:inherit}
:focus-visible{outline:3px solid currentColor;outline-offset:2px}
summary{cursor:pointer}
.cols{display:grid;grid-template-columns:5.25rem 6rem;column-gap:10px;align-items:center;flex:none;margin-right:var(--cols-end,0)}
.cols>.c-roles{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.cols>.c-state{justify-self:start}
.top-row{--cols-end:12px}
@media (max-width:640px){.cols{flex:1 1 100%;grid-template-columns:minmax(0,1fr) auto;margin:0 0 0 50px;--cols-end:0}.top-row{--cols-end:0;margin-left:88px}.cols>.c-state{justify-self:end}.cols>.c-roles{flex-wrap:nowrap}}
</style>
<script src="../shared/mockup.js"></script>
<script src="../shared/couverture-theme.js"></script>
<script src="../shared/comic-skin.js"></script>
<script src="../shared/comic-bubbles.js"></script>
<script src="../shared/comic-frames.js"></script>
</head>
<body>
<div id="mockup"></div>
<template id="view">
<div style="min-height: 100vh; background: {{t.bg}}; color: {{t.text}}; font-family: {{t.fb}}; font-size: 15px; line-height: 1.5">

  <header style="position: sticky; top: 0; z-index: 20; background: {{hintBg}}; color: {{t.hText}}; border-bottom: {{t.hLine}}">
    <div style="max-width: 1280px; margin: 0 auto; padding: 10px clamp(12px, 3vw, 24px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px">
      <a href="#" style="display: flex; align-items: center; gap: 10px; color: {{t.hText}}; text-decoration: none">
        <sc-if value="{{t.lgMark}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #E8604C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px">B</span></sc-if>
        <span style="display: inline-block; padding: {{t.lgPad}}; border-radius: {{t.lgR}}; background: {{t.lgBg}}; color: {{t.lgText}}; font: {{t.lgFont}}; line-height: 1.1; text-transform: {{t.lgTT}}; transform: rotate({{t.lgRot}}); box-shadow: {{t.lgSh}}; text-shadow: {{t.lgTSh}}">BDthèque<span style="color: {{t.lgDot}}">.</span></span>
      </a>
      <nav aria-label="Navigation principale" data-scroll-hint="" style="flex: 999 1 220px; --hint-bg: {{hintBg}}">
        <ul data-scroll="" style="margin: 0; padding: 0; list-style: none; display: flex; gap: 4px; white-space: nowrap">
          <sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
            <li style="flex: none"><a href="#" aria-current="{{n.current}}" style="display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: {{t.btnR}}; background: {{n.bg}}; color: {{n.fg}}; font-weight: 700; font-size: 14px; text-transform: {{t.navTT}}; text-decoration: {{n.deco}}; text-decoration-color: {{t.navLine}}; text-decoration-thickness: 3px; text-underline-offset: 6px">{{n.label}}</a></li>
          </sc-for>
        </ul>
      </nav>
      <div style="flex: 1 1 260px; max-width: 380px; min-width: 0; margin-left: auto; display: flex; justify-content: flex-end; align-items: center; gap: 8px">
        <label for="find" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Rechercher</label>
        <input id="find" type="search" placeholder="Un album, une série, un auteur…" style="flex: 1 1 220px; max-width: 320px; min-width: 0; height: 38px; padding: 0 14px; box-sizing: border-box; border: {{t.hInB}}; border-radius: {{t.inR}}; background: {{t.hInBg}}; color: {{t.hInText}}; font: inherit">
        <button type="button" aria-label="Aide sur cette page" style="width: 38px; height: 38px; flex: none; border: {{t.helpB}}; border-radius: {{t.helpR}}; background: {{t.helpBg}}; color: {{t.helpText}}; font-family: {{t.fd}}; font-weight: 700; font-size: 18px; cursor: pointer">?</button>
      </div>
    </div>
  </header>

  <div style="max-width: 1280px; margin: 0 auto; padding: 14px clamp(12px, 3vw, 24px) 32px; box-sizing: border-box">
    <nav aria-label="Fil d'Ariane" style="margin-bottom: 12px; font-size: 13px; color: {{t.muted}}">
      <span>Univers</span> <span aria-hidden="true">›</span> <sc-for list="{{ancestors}}" as="p" hint-placeholder-count="1"><a href="#" style="color: {{t.link}}; font-weight: 700">{{p.name}}</a> <span aria-hidden="true">›</span> </sc-for><span>{{a.name}}</span>
    </nav>

    <main style="display: flex; flex-direction: column; gap: 22px">

      <div>
      <span style="display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: {{t.muted}}">Univers</span>
      <div style="display: flex; align-items: flex-start; gap: 16px">
        <div aria-hidden="true" style="position: relative; flex: none; width: 52px; height: 52px; margin-top: 4px">
          <span style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 0; border: {{t.cvB}}; border-radius: {{mono.r}}; background: {{mono.bg}}; color: {{mono.fg}}; box-shadow: {{t.cvSh}}; transform: rotate({{t.cvRot}}); font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: 20px; text-transform: uppercase"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14a4 4 0 0 1-1-7.9A5 5 0 0 1 15.5 5a4.5 4.5 0 0 1 2.5 9zM7.5 18.2a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0-4.4 0M3 21.5a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0"></path></svg></span>
          <sc-if value="{{t.tape}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: -6px; left: 50%; width: 36px; height: 12px; margin-left: -18px; background: rgba(255,232,0,.75); transform: rotate(-4deg)"></span></sc-if>
          <sc-if value="{{t.shelf}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: -6px; right: -6px; bottom: -8px; height: 8px; background: #5B3A24; box-shadow: 0 3px 0 #3F2818"></span></sc-if>
        </div>
        <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <h1 style="margin: 0; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: {{t.h1size}}; line-height: 1.05; text-transform: {{t.fdTT}}; color: {{t.text}}">{{a.name}}</h1>
            </div>
          <ul aria-label="En bref" style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{facts}}" as="f" hint-placeholder-count="4">
              <li style="display: inline-flex; align-items: center; min-height: 26px; padding: 0 11px; box-sizing: border-box; border: {{f.bd}}; border-radius: {{t.btnR}}; background: {{f.bg}}; color: {{f.fg}}; font-weight: 700; font-size: 13px">{{f.label}}</li>
            </sc-for>
          </ul>
        </div>
      </div>
      </div>

      <sc-if value="{{a.hasDescription}}" hint-placeholder-val="{{false}}"><section aria-labelledby="a-bio" style="position: relative; margin-top: {{t.cTop}}; padding: {{t.cPad}}; border: {{t.cB}}; border-top: {{t.cBT}}; border-radius: {{t.cR}}; background: {{t.cBg}}; box-shadow: {{t.cSh}}; display: flex; flex-direction: column; gap: 12px">
        <span style="display: {{t.kDisp}}; position: {{t.kPos}}; top: {{t.kTop}}; left: {{t.kLeft}}; width: max-content; padding: {{t.kPad}}; border-radius: {{t.kR}}; background: {{t.kBg}}; color: {{t.kText}}; font-family: {{t.kFont}}; font-weight: {{t.kW}}; font-size: {{t.kSize}}; letter-spacing: {{t.kLS}}; text-transform: {{t.kTT}}">{{k.bio}}</span>
        <h2 id="a-bio" style="position: relative; align-self: flex-start; margin: {{t.h2lift}} 0 0; display: flex; align-items: center; gap: 12px; padding: {{t.h2pad}}; border-radius: {{t.h2r}}; border-bottom: {{t.h2line}}; background: {{t.h2bg}}; color: {{t.h2c}}; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-style: {{t.h2fs}}; font-size: {{t.h2size}}; line-height: 1.15; text-transform: {{t.h2tt}}; text-shadow: {{t.h2sh}}; transform: rotate({{t.h2rot}})"><span aria-hidden="true" style="display: {{t.mkDisp}}; flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 6px solid #1B2350; background: #FFFFFF"></span>De quoi s'agit-il ?<sc-if value="{{t.tail}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" data-tail="" style="position: absolute; left: 26px; bottom: -8px; width: 16px; height: 16px; border-radius: 0 0 14px 0; transform: skewX(-25deg); background: {{t.h2bg}}"></span></sc-if></h2>
        <p style="margin: 0; max-width: 80ch; font-size: 15px">{{a.description}}</p>
      </section></sc-if>

      <!-- Its sub-universes, a block of their own between its description and its series and albums: their tree at every
           level, drawn by its branches, each with what is attached to it, its own sub-universes included. -->
      <sc-if value="{{a.hasChildren}}" hint-placeholder-val="{{false}}"><section aria-labelledby="a-subs" style="position: relative; margin-top: {{t.cTop}}; padding: {{t.cPad}}; border: {{t.cB}}; border-top: {{t.cBT}}; border-radius: {{t.cR}}; background: {{t.cBg}}; box-shadow: {{t.cSh}}; display: flex; flex-direction: column; gap: 12px">
        <span style="display: {{t.kDisp}}; position: {{t.kPos}}; top: {{t.kTop}}; left: {{t.kLeft}}; width: max-content; padding: {{t.kPad}}; border-radius: {{t.kR}}; background: {{t.kBg}}; color: {{t.kText}}; font-family: {{t.kFont}}; font-weight: {{t.kW}}; font-size: {{t.kSize}}; letter-spacing: {{t.kLS}}; text-transform: {{t.kTT}}">{{k.subs}}</span>
        <h2 id="a-subs" style="position: relative; align-self: flex-start; margin: {{t.h2lift}} 0 0; display: flex; align-items: center; gap: 12px; padding: {{t.h2pad}}; border-radius: {{t.h2r}}; border-bottom: {{t.h2line}}; background: {{t.h2bg}}; color: {{t.h2c}}; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-style: {{t.h2fs}}; font-size: {{t.h2size}}; line-height: 1.15; text-transform: {{t.h2tt}}; text-shadow: {{t.h2sh}}; transform: rotate({{t.h2rot}})"><span aria-hidden="true" style="display: {{t.mkDisp}}; flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 6px solid #1B2350; background: #FFFFFF"></span>Quels sous-univers ?<sc-if value="{{t.tail}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" data-tail="" style="position: absolute; left: 26px; bottom: -8px; width: 16px; height: 16px; border-radius: 0 0 14px 0; transform: skewX(-25deg); background: {{t.h2bg}}"></span></sc-if></h2>
        <p style="margin: 0; font-size: 13px; color: {{t.muted}}">{{subsSummary}}</p>
        <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
          <sc-for list="{{subs}}" as="r" hint-placeholder-count="5">
            <li style="display: flex; align-items: stretch; min-height: 48px">
              <sc-for list="{{r.guides}}" as="g" hint-placeholder-count="1"><span aria-hidden="true" style="flex: none; width: 34px; position: relative"><span style="position: absolute; left: 16px; top: 0; bottom: 0; border-left: {{g.bd}}"></span></span></sc-for>
              <span aria-hidden="true" style="flex: none; width: 34px; position: relative"><span style="position: absolute; left: 16px; top: 0; height: {{r.stem}}; border-left: 2px solid {{t.line}}"></span><span style="position: absolute; left: 16px; top: 22px; width: 18px; border-top: 2px solid {{t.line}}"></span></span>
              <span style="position: relative; flex: 1 1 0; min-width: 0; display: flex; align-items: flex-start; gap: 10px; padding-block: 6px">
                <sc-if value="{{r.hasKids}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; left: 16px; top: 40px; bottom: 0; border-left: 2px solid {{t.line}}"></span></sc-if>
                <span aria-hidden="true" style="flex: none; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: {{t.cvB}}; border-radius: {{mono.r}}; background: {{mono.bg}}; color: {{mono.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14a4 4 0 0 1-1-7.9A5 5 0 0 1 15.5 5a4.5 4.5 0 0 1 2.5 9zM7.5 18.2a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0-4.4 0M3 21.5a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0"></path></svg></span>
                <span style="min-width: 0; display: flex; flex-direction: column; gap: 1px">
                  <a href="#" style="color: {{t.link}}; font-weight: 700; text-decoration: underline; text-underline-offset: .2em">{{r.name}}</a>
                  <span style="font-size: 13px; color: {{t.muted}}">{{r.meta}}</span>
                </span>
              </span>
            </li>
          </sc-for>
        </ul>
      </section></sc-if>

      <section aria-labelledby="a-biblio" style="position: relative; margin-top: {{t.cTop}}; padding: {{t.cPad}}; border: {{t.cB}}; border-top: {{t.cBT}}; border-radius: {{t.cR}}; background: {{t.cBg}}; box-shadow: {{t.cSh}}; display: flex; flex-direction: column; gap: 10px">
        <span style="display: {{t.kDisp}}; position: {{t.kPos}}; top: {{t.kTop}}; left: {{t.kLeft}}; width: max-content; padding: {{t.kPad}}; border-radius: {{t.kR}}; background: {{t.kBg}}; color: {{t.kText}}; font-family: {{t.kFont}}; font-weight: {{t.kW}}; font-size: {{t.kSize}}; letter-spacing: {{t.kLS}}; text-transform: {{t.kTT}}">{{k.biblio}}</span>
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: {{t.rowAlign}}; gap: 12px 16px">
          <h2 id="a-biblio" style="position: relative; margin: {{t.h2lift}} 0 0; display: flex; align-items: center; gap: 12px; padding: {{t.h2pad}}; border-radius: {{t.h2r}}; border-bottom: {{t.h2line}}; background: {{t.h2bg}}; color: {{t.h2c}}; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-style: {{t.h2fs}}; font-size: {{t.h2size}}; line-height: 1.15; text-transform: {{t.h2tt}}; text-shadow: {{t.h2sh}}; transform: rotate({{t.h2rot}})"><span aria-hidden="true" style="display: {{t.mkDisp}}; flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 6px solid #1B2350; background: #FFFFFF"></span>Quelles séries, quels albums ?<sc-if value="{{t.tail}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" data-tail="" style="position: absolute; left: 26px; bottom: -8px; width: 16px; height: 16px; border-radius: 0 0 14px 0; transform: skewX(-25deg); background: {{t.h2bg}}"></span></sc-if></h2>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <button type="button" onClick="{{openAll}}" style="min-height: 32px; padding: 0 12px; border: {{t.secB}}; border-radius: {{t.btnR}}; background: transparent; color: {{t.secText}}; font-family: {{t.fb}}; font-weight: 700; font-size: 13px; cursor: pointer">Tout déplier</button>
            <button type="button" onClick="{{closeAll}}" style="min-height: 32px; padding: 0 12px; border: {{t.secB}}; border-radius: {{t.btnR}}; background: transparent; color: {{t.secText}}; font-family: {{t.fb}}; font-weight: 700; font-size: 13px; cursor: pointer">Tout replier</button>
          </div>
        </div>
        <p style="margin: 0; font-size: 13px; color: {{t.muted}}">{{biblioSummary}}</p>

        <ul style="margin: 0; padding: 0; list-style: none; border-top: {{t.rowB}}">
          <sc-for list="{{entries}}" as="e" hint-placeholder-count="9">
            <li style="border-bottom: {{t.rowB}}">
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; min-height: 44px; padding: 4px 0; box-sizing: border-box">
                <sc-if value="{{e.noOpen}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 34px; flex: none"></span></sc-if>
                <sc-if value="{{e.canOpen}}" hint-placeholder-val="{{true}}"><button type="button" aria-expanded="{{e.expanded}}" aria-label="{{e.toggleLabel}}" onClick="{{e.toggle}}" style="width: 34px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; background: transparent; color: {{t.text}}; cursor: pointer"><span aria-hidden="true" style="width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: {{nest.bg}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate({{e.chevron}})"><path d="M9 6l6 6-6 6"></path></svg></span></button></sc-if>
                <sc-if value="{{e.isSeries}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="position: relative; width: 40px; height: 40px; flex: none">
                  <sc-for list="{{e.stack}}" as="c" hint-placeholder-count="3"><span style="position: absolute; left: {{c.left}}; top: {{c.top}}; width: 24px; height: 32px; border-radius: 3px; background: {{c.bg}}; box-shadow: 0 0 0 1.5px {{t.bg}}, 0 1px 3px rgba(0,0,0,.3); transform: rotate({{c.rot}})"></span></sc-for>
                </span></sc-if>
                <sc-if value="{{e.isAlbum}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 34px; flex: none"></span></sc-if>
                <sc-if value="{{e.isAlbum}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 40px; height: 40px; flex: none; display: inline-flex; align-items: center; justify-content: center"><span style="width: 30px; height: 40px; border-radius: 3px; background: {{e.cover}}; box-shadow: 0 1px 3px rgba(0,0,0,.3)"></span></span></sc-if>
                <span style="flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; line-height: 1.3">
                  <a href="#" style="align-self: flex-start; font-weight: 700; font-size: 15px; color: {{t.text}}">{{e.title}}</a>
                  <span style="font-size: 12px; color: {{t.muted}}">{{e.meta}}</span>
                </span>
                <span class="{{cols}}">
                  <span class="c-rating"><sc-if value="{{e.rated}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="{{e.ratingLabel}}" style="font-size: 13px; letter-spacing: 1px">{{e.stars}}</span></sc-if></span>
                  <span class="c-state"><sc-if value="{{e.isAlbum}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; box-sizing: border-box; border: {{e.badgeB}}; border-radius: {{t.btnR}}; background: {{e.badgeBg}}; color: {{e.badgeFg}}; font-weight: 700; font-size: 11px">{{e.badge}}</span></sc-if></span>
                </span>
              </div>
              <sc-if value="{{e.open}}" hint-placeholder-val="{{false}}">
                <ol aria-label="{{e.listLabel}}" style="margin: 0 0 8px clamp(18px, 5vw, 44px); padding: 2px 12px; list-style: none; border-left: 4px solid {{t.acc}}; border-radius: 0 {{nest.r}} {{nest.r}} 0; background: {{nest.bg}}">
                  <sc-for list="{{e.albums}}" as="b" hint-placeholder-count="4">
                    <li style="display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; min-height: 44px; padding: 4px 0; box-sizing: border-box; border-top: {{b.rowB}}">
                      <span aria-hidden="true" style="width: 40px; height: 40px; flex: none; display: inline-flex; align-items: center; justify-content: center"><span style="width: 30px; height: 40px; border-radius: 3px; background: {{b.cover}}; box-shadow: 0 1px 3px rgba(0,0,0,.3)"></span></span>
                      <span style="flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; line-height: 1.3">
                        <a href="#" style="align-self: flex-start; font-weight: 700; color: {{t.text}}">{{b.title}}</a>
                        <span style="font-size: 12px; color: {{t.muted}}">{{b.meta}}</span>
                      </span>
                      <span class="{{colsIn}}">
                        <span class="c-rating"><sc-if value="{{b.rated}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="{{b.ratingLabel}}" style="font-size: 13px; letter-spacing: 1px">{{b.stars}}</span></sc-if></span>
                        <span class="c-state"><span style="display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; box-sizing: border-box; border: {{b.badgeB}}; border-radius: {{t.btnR}}; background: {{b.badgeBg}}; color: {{b.badgeFg}}; font-weight: 700; font-size: 11px">{{b.badge}}</span></span>
                      </span>
                    </li>
                  </sc-for>
                </ol>
              </sc-if>
            </li>
          </sc-for>
        </ul>
      </section>
    </main>
  </div>

  <footer style="max-width: 1280px; margin: 0 auto; padding: 12px clamp(12px, 3vw, 24px) 24px; box-sizing: border-box; font-size: 12px; color: {{t.muted}}">
    <span>Univers créé le 2 février 2026, modifié le 9 mars 2026.</span>
  </footer>
</div>
</template>
<script>
// Shared defaults: each theme only states what its identity changes.
const BASE = {
  rowAlign: 'center',
  cTop: '0',
  h2lift: '0',
  kDisp: 'none', kPos: 'static', kTop: 'auto', kLeft: 'auto', kBg: 'transparent', kText: 'inherit', kPad: '0', kR: '0',
  kFont: 'inherit', kW: '700', kSize: '12px', kLS: '0', kTT: 'none', kPre: null,

// « La couverture du jour »: the colours of the day's featured cover, on the festival's rounded forms
// (shared/couverture-theme.js).
THEMES.couverture = { ...THEMES.festival, ...COUVERTURE_THEME };

// On a coloured header, the active entry takes the header's own highlight rather than the page accent.
const NAV_ACTIVE = { vignettes: ['#FFD23F', '#23323A'], couverture: ['#FFFFFF', '#14295A'] };

// The series and albums of the universe, its sub-universes included, in the order of the sort keys, series and albums
// without a series together, presented as the bibliography of an author, without roles: nobody is credited here.
// A series attached itself has all its albums; a series attached through some of its albums only has those.
// Album: [tome label, own title, roles, owned state, rating]; owned state 'own', 'no' or 'intent'.
const BIBLIOGRAPHY = [
  { title: 'Les Gardiens du phare', attached: true, seriesSize: 4,
    albums: Array.from({ length: 4 }, (_, i) => ['T. ' + (i + 1), ['La Lanterne noire', '', 'Marée haute', ''][i], [], i < 3 ? 'own' : 'intent', i === 0 ? 4 : 0]) },
  { album: true, title: 'Le Grand Livre d\'Ombrelune', roles: [], state: 'own', rating: 3 },
  { title: 'Les Passeurs de brume', attached: false, seriesSize: 5, albums: [['T. 2', 'Le Gué des ombres', [], 'own', 0], ['T. 4', '', [], 'no', 0]] },
  { album: true, title: 'Les Veilleurs d\'Ombrelune', roles: [], state: 'no', rating: 0 },
  { title: 'Vélis', attached: true, seriesSize: 9,
    albums: Array.from({ length: 9 }, (_, i) => ['T. ' + (i + 1), '', [], i < 7 ? 'own' : 'no', i === 1 ? 5 : 0]) }
];
const ROLE_LABELS = { scenario: 'Scénario', dessin: 'Dessin', couleurs: 'Couleurs' };
const ROLE_ORDER = ['scenario', 'dessin', 'couleurs'];
// A long series starts folded, so that one prolific series does not hide the rest of the bibliography.
const FOLD_ABOVE = 6;
const GENERIC_CARD = 'rgba(127,127,127,.35)';

class View extends Mockup {
  renderVals() {
    const key = this.props.theme ?? 'planche';
    const t = THEMES[key] ?? THEMES.planche;
    const kick = (i, label) => (t.kPre ? t.kPre(i, label) : label);
    const [navAcc, navOnAcc] = NAV_ACTIVE[key] ?? [t.acc, t.onAcc];
    const navItem = (label, current) => ({
      label,
      current: current ? 'page' : 'false',
      bg: current && !t.navUnderline ? navAcc : 'transparent',
      fg: current && !t.navUnderline ? navOnAcc : t.hText,
      deco: current && t.navUnderline ? 'underline' : 'none'
    });
    const defaults = Object.fromEntries(BIBLIOGRAPHY.map((e, i) => [i, !e.album && e.albums.length > 0 && e.albums.length <= FOLD_ABOVE]));
    const open = this.state?.open ?? defaults;
    // Each role keeps its colour across the page, so that a role reads at a glance in a long list.
    const roleChips = (roles) => ROLE_ORDER.filter((r) => roles.includes(r)).map((r) => {
      const [bg, fg] = t.pal[ROLE_ORDER.indexOf(r) % t.pal.length];
      return { label: ROLE_LABELS[r], bg, fg };
    });
    const badge = (state) => ({
      badge: state === 'own' ? 'Possédé' : (state === 'intent' ? 'Intention' : 'Catalogué'),
      badgeBg: state === 'own' ? t.colBg : 'transparent',
      badgeFg: state === 'own' ? t.colFg : t.text,
      badgeB: state === 'own' ? '0' : '2px dashed ' + t.line
    });
    const rating = (n) => ({
      rated: n > 0, stars: '★'.repeat(n) + '☆'.repeat(5 - n), ratingLabel: 'Appréciation : ' + n + ' sur 5'
    });
    const allAlbums = BIBLIOGRAPHY.flatMap((e) => (e.album ? [e.roles] : e.albums.map((a) => a[2])));
    const byRole = ROLE_ORDER.map((r) => [r, allAlbums.filter((roles) => roles.includes(r)).length]).filter(([, n]) => n > 0);
    const seriesCount = BIBLIOGRAPHY.filter((e) => !e.album).length;
    const loneCount = BIBLIOGRAPHY.length - seriesCount;
    // An author may be in the base without any credit yet: every count reads right at zero and at one.
    const count = (n, one, many, none) => (n === 0 ? none : n + ' ' + (n > 1 ? many : one));
    // The sub-universes of the universe, at every level, siblings by name; what each counts includes its own sub-universes.
    const TREE = [
      { name: 'Cité de Vélis', series: 1, albums: 4, children: [
        { name: 'Quartier des Lanternes', series: 0, albums: 1, children: [] }
      ] },
      { name: 'Phare de Kerdran', series: 2, albums: 7, children: [
        { name: 'Ordre des Gardiens', series: 1, albums: 3, children: [
          { name: 'Tour de la Vigie', series: 0, albums: 0, children: [] }
        ] }
      ] }
    ];
    // Flattened in the order of the hierarchy, each row with the branches that pass beside it: one per ancestor that still
    // has siblings to come below, then its own, which stops at it when it is the last of its siblings.
    const subs = [];
    let depth = 0;
    const walk = (nodes, guides) => nodes.forEach((n, i) => {
      const last = i === nodes.length - 1;
      depth = Math.max(depth, guides.length + 1);
      const what = [n.series > 0 ? count(n.series, 'série', 'séries', '') : '', n.albums > 0 ? count(n.albums, 'album', 'albums', '') : '']
        .filter(Boolean).join(' · ');
      subs.push({
        name: n.name,
        meta: what || 'Aucun album rattaché',
        guides: guides.map((more) => ({ bd: more ? '2px solid ' + t.line : '0' })),
        stem: last ? '23px' : '100%',
        hasKids: n.children.length > 0
      });
      walk(n.children, [...guides, !last]);
    });
    walk(TREE, []);
    const albumTotal = BIBLIOGRAPHY.reduce((n, e) => n + (e.album ? 1 : e.albums.length), 0);
    // Every album, in a series or not, is shown by its cover: only a series has a pile of covers.
    // A cover belongs to the album itself (entry, and volume within its series), never to its rank in this list.
    const cover = (entry, volume) => 'hsl(' + ((entry * 67 + volume * 29 + 200) % 360) + ', 42%, 36%)';
    const volumeOf = (tome) => Number(tome.replace(/^T\. /, '')) || 1;
    const entries = BIBLIOGRAPHY.map((e, i) => {
      const base = { title: e.title };
      if (e.album) {
        return {
          ...base, isAlbum: true, isSeries: false, canOpen: false, noOpen: false, open: false, cover: cover(i, 1),
          meta: '', roles: roleChips(e.roles), hasSeriesRoles: false, albums: [], ...rating(e.rating), ...badge(e.state)
        };
      }
      const hasAlbums = e.albums.length > 0;
      const isOpen = hasAlbums && Boolean(open[i]);
      const owned = e.albums.filter((a) => a[3] === 'own').length;
      // An album without its own title is named by its volume alone (« Tome 3 »).
      const albums = e.albums.map(([tome, title, roles, state, n], k) => ({
        title: title || tome.replace(/^T\. /, 'Tome '), meta: title ? tome : '', cover: cover(i, volumeOf(tome)),
        rowB: k === 0 ? '0' : t.rowB,
        roles: roleChips(roles), ...rating(n), ...badge(state)
      }));
      const inCollection = owned === 0 ? 'aucun dans la collection' : owned + ' dans la collection';
      const credited = e.attached
        // Attached itself: its albums in the collection out of all of them, « 0 sur X » included
        // (charte-graphique/convivialite-et-efficacite.md).
        ? owned + (owned > 1 ? ' albums' : ' album') + ' sur ' + e.seriesSize + ' dans la collection'
        : e.albums.length + (e.albums.length > 1 ? ' albums rattachés' : ' album rattaché') + ' sur ' + e.seriesSize + ' · ' + inCollection;
      return {
        ...base, isAlbum: false, isSeries: true, canOpen: hasAlbums, noOpen: !hasAlbums, open: isOpen, rated: false,
        listLabel: 'Albums de la série ' + e.title,
        // The pile shows the series itself, by the covers of its first volumes, whatever the author is credited on:
        // a series credited on itself only, with no album listed, has its pile too. It always keeps three cards, so
        // that a series never passes for a single album: a place beyond the volumes of the series is a generic card.
        stack: [
          { left: '14px', top: '0', rot: '8deg', bg: e.seriesSize >= 3 ? cover(i, 3) : GENERIC_CARD },
          { left: '8px', top: '5px', rot: '2deg', bg: e.seriesSize >= 2 ? cover(i, 2) : GENERIC_CARD },
          { left: '2px', top: '10px', rot: '-5deg', bg: e.seriesSize >= 1 ? cover(i, 1) : GENERIC_CARD }
        ],
        expanded: isOpen ? 'true' : 'false',
        chevron: isOpen ? '90deg' : '0deg',
        toggleLabel: (isOpen ? 'Replier ' : 'Déplier ') + e.title,
        toggle: () => this.setState({ open: { ...open, [i]: !isOpen } }),
        // « Série » is said only of a series credited on itself alone, that nothing else tells from an album.
        meta: credited,
        roles: [],
        hasSeriesRoles: false,
        albums
      };
    });
    const chip = { bg: 'transparent', fg: t.text, bd: t.tB === '0' ? '2px solid ' + t.line : t.tB };
    return {
      t,
      cols: 'cols top-row',
      colsIn: 'cols',
      // The scroll hint of the menu fades into what lies behind it: the header, or the page under a transparent one.
      hintBg: t.hBg === 'transparent' ? t.bg : t.hBg,
      a: {
        name: 'Archipel des Brumes',
        hasChildren: true,
        hasDescription: true,
        description: 'Un chapelet d\'îles battues par les vents, à l\'ouest des Royaumes d\'Ombrelune, où les phares sont tenus par des '
          + 'ordres de gardiens rivaux. Les récits s\'y déroulent sur près de trois siècles, de la fondation de Vélis à l\'extinction des '
          + 'derniers feux.'
      },
      ancestors: [{ name: 'Royaumes d\'Ombrelune' }],
      subs,
      subsSummary: count(subs.length, 'sous-univers', 'sous-univers', 'Aucun sous-univers') + ', sur ' + count(depth, 'niveau', 'niveaux', '')
        + ', chacun sous son parent, frères par ordre alphabétique.',
      mono: { bg: t.pal[0][0], fg: t.pal[0][1], r: t.cvR === '0' ? '50%' : t.cvR },
      // The albums of an unfolded series sit in a tinted box, so that the next entry, outside it, cannot pass for one of them.
      nest: {
        bg: t.tBg !== 'transparent' && t.tBg !== t.cBg ? t.tBg : 'rgba(127,127,127,.10)',
        r: t.tR === '0' ? '0' : '12px'
      },
      k: { bio: kick(1, 'Présentation'), subs: kick(2, 'Arborescence'), biblio: kick(3, 'Œuvres') },
      // A universe has no entry in the menu: none is current.
      nav: [navItem('Accueil', false), navItem('Albums', false), navItem('Séries', false), navItem('Auteurs', false), navItem("Intentions d'acquisition", false)],
      facts: [
        { label: count(seriesCount, 'série', 'séries', 'Aucune série'), bg: t.acc, fg: t.onAcc, bd: '2px solid ' + t.acc },
        { label: count(albumTotal, 'album', 'albums', 'Aucun album'), ...chip },
        { label: count(subs.length, 'sous-univers', 'sous-univers', 'Aucun sous-univers'), ...chip }
      ],
      biblioSummary: BIBLIOGRAPHY.length === 0
        ? 'Aucune série ni aucun album rattaché pour l\'instant.'
        : count(seriesCount, 'série', 'séries', 'Aucune série') + ' et ' + count(loneCount, 'album sans série', 'albums sans série', 'aucun album sans série')
          + ', rangés par ordre alphabétique.',
      entries,
      openAll: () => this.setState({ open: Object.fromEntries(BIBLIOGRAPHY.map((e, i) => [i, !e.album && e.albums.length > 0])) }),
      closeAll: () => this.setState({ open: {} })
    };
  }
}
