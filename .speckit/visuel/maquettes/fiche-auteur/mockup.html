<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche d'auteur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Baloo+2:wght@600;700;800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;family=DM+Serif+Display:ital@0;1&amp;family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&amp;family=Karla:wght@400;500;700&amp;family=Libre+Franklin:ital,wght@0,400;0,600;0,800;1,800&amp;family=Nunito:wght@400;600;700&amp;family=Rubik+Mono+One&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
input::placeholder{color:inherit}
:focus-visible{outline:3px solid currentColor;outline-offset:2px}
summary{cursor:pointer}
</style>
<script src="../shared/mockup.js"></script>
</head>
<body>
<div id="mockup"></div>
<template id="view">
<div style="min-height: 100vh; background: {{t.bg}}; color: {{t.text}}; font-family: {{t.fb}}; font-size: 15px; line-height: 1.5">

  <header style="position: sticky; top: 0; z-index: 20; background: {{hintBg}}; color: {{t.hText}}; border-bottom: {{t.hLine}}">
    <div style="max-width: 1280px; margin: 0 auto; padding: 10px clamp(12px, 3vw, 24px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px">
      <a href="#" style="display: flex; align-items: center; gap: 10px; color: {{t.hText}}; text-decoration: none">
        <sc-if value="{{t.lgMark}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #E8604C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px">B</span></sc-if>
        <span style="display: inline-block; padding: {{t.lgPad}}; border-radius: {{t.lgR}}; background: {{t.lgBg}}; color: {{t.lgText}}; font: {{t.lgFont}}; line-height: 1.1; text-transform: {{t.lgTT}}; transform: rotate({{t.lgRot}}); box-shadow: {{t.lgSh}}; text-shadow: {{t.lgTSh}}">BDthèque<span style="color: {{t.lgDot}}">.</span></span>
      </a>
      <nav aria-label="Navigation principale" data-scroll-hint="" style="flex: 999 1 220px; --hint-bg: {{hintBg}}">
        <ul data-scroll="" style="margin: 0; padding: 0; list-style: none; display: flex; gap: 4px; white-space: nowrap">
          <sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
            <li style="flex: none"><a href="#" aria-current="{{n.current}}" style="display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: {{t.btnR}}; background: {{n.bg}}; color: {{n.fg}}; font-weight: 700; font-size: 14px; text-transform: {{t.navTT}}; text-decoration: {{n.deco}}; text-decoration-color: {{t.navLine}}; text-decoration-thickness: 3px; text-underline-offset: 6px">{{n.label}}</a></li>
          </sc-for>
        </ul>
      </nav>
      <div style="flex: 1 1 260px; max-width: 380px; min-width: 0; margin-left: auto; display: flex; justify-content: flex-end; align-items: center; gap: 8px">
        <label for="find" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Rechercher</label>
        <input id="find" type="search" placeholder="Un album, une série, un auteur…" style="flex: 1 1 220px; max-width: 320px; min-width: 0; height: 38px; padding: 0 14px; box-sizing: border-box; border: {{t.hInB}}; border-radius: {{t.inR}}; background: {{t.hInBg}}; color: {{t.hInText}}; font: inherit">
        <button type="button" aria-label="Aide sur cette page" style="width: 38px; height: 38px; flex: none; border: {{t.helpB}}; border-radius: {{t.helpR}}; background: {{t.helpBg}}; color: {{t.helpText}}; font-family: {{t.fd}}; font-weight: 700; font-size: 18px; cursor: pointer">?</button>
      </div>
    </div>
  </header>

  <div style="max-width: 1280px; margin: 0 auto; padding: 14px clamp(12px, 3vw, 24px) 32px; box-sizing: border-box">
    <nav aria-label="Fil d'Ariane" style="margin-bottom: 12px; font-size: 13px; color: {{t.muted}}">
      <a href="#" style="color: {{t.link}}; font-weight: 700">Auteurs</a> <span aria-hidden="true">›</span> <span>{{a.name}}</span>
    </nav>

    <main style="display: flex; flex-direction: column; gap: 22px">

      <div style="display: flex; align-items: flex-start; gap: 16px">
        <div aria-hidden="true" style="position: relative; flex: none; width: 52px; height: 52px; margin-top: 4px">
          <span style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 0; border: {{t.cvB}}; border-radius: {{mono.r}}; background: {{mono.bg}}; color: {{mono.fg}}; box-shadow: {{t.cvSh}}; transform: rotate({{t.cvRot}}); font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: 20px; text-transform: uppercase">{{a.initials}}</span>
          <sc-if value="{{t.tape}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: -6px; left: 50%; width: 36px; height: 12px; margin-left: -18px; background: rgba(255,232,0,.75); transform: rotate(-4deg)"></span></sc-if>
          <sc-if value="{{t.shelf}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: -6px; right: -6px; bottom: -8px; height: 8px; background: #5B3A24; box-shadow: 0 3px 0 #3F2818"></span></sc-if>
        </div>
        <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: {{t.muted}}">Auteur</span>
            <h1 style="margin: 0; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: {{t.h1size}}; line-height: 1.05; text-transform: {{t.fdTT}}; color: {{t.text}}">{{a.name}}</h1>
            <sc-if value="{{a.hasRealName}}" hint-placeholder-val="{{false}}"><span style="font-size: 16px; color: {{t.muted}}">{{a.realName}}</span></sc-if>
          </div>
          <dl style="margin: 0; display: flex; flex-wrap: wrap; gap: 8px 32px">
            <div style="display: flex; gap: 10px; align-items: baseline">
              <dt style="font-weight: 700">Nationalité</dt>
              <dd style="margin: 0; color: {{a.nationalityColor}}">{{a.nationality}}</dd>
            </div>
          </dl>
          <ul aria-label="En bref" style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{facts}}" as="f" hint-placeholder-count="4">
              <li style="display: inline-flex; align-items: center; min-height: 26px; padding: 0 11px; box-sizing: border-box; border: {{f.bd}}; border-radius: {{t.btnR}}; background: {{f.bg}}; color: {{f.fg}}; font-weight: 700; font-size: 13px">{{f.label}}</li>
            </sc-for>
          </ul>
        </div>
      </div>

      <section aria-labelledby="a-bio" style="position: relative; padding: {{t.cPad}}; border: {{t.cB}}; border-top: {{t.cBT}}; border-radius: {{t.cR}}; background: {{t.cBg}}; box-shadow: {{t.cSh}}; display: flex; flex-direction: column; gap: 12px">
        <span style="display: {{t.kDisp}}; position: {{t.kPos}}; top: {{t.kTop}}; left: {{t.kLeft}}; width: max-content; padding: {{t.kPad}}; border-radius: {{t.kR}}; background: {{t.kBg}}; color: {{t.kText}}; font-family: {{t.kFont}}; font-weight: {{t.kW}}; font-size: {{t.kSize}}; letter-spacing: {{t.kLS}}; text-transform: {{t.kTT}}">{{k.bio}}</span>
        <h2 id="a-bio" style="position: relative; align-self: flex-start; margin: 0; display: flex; align-items: center; gap: 12px; padding: {{t.h2pad}}; border-radius: {{t.h2r}}; border-bottom: {{t.h2line}}; background: {{t.h2bg}}; color: {{t.h2c}}; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-style: {{t.h2fs}}; font-size: {{t.h2size}}; line-height: 1.15; text-transform: {{t.h2tt}}; text-shadow: {{t.h2sh}}; transform: rotate({{t.h2rot}})"><span aria-hidden="true" style="display: {{t.mkDisp}}; flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 6px solid #1B2350; background: #FFFFFF"></span>Qui est-ce ?<sc-if value="{{t.tail}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; left: 26px; bottom: -11px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 10px solid transparent; border-top: 12px solid {{t.h2bg}}"></span></sc-if></h2>
        <p style="margin: 0; max-width: 80ch; font-size: 15px; color: {{a.bioColor}}">{{a.bio}}</p>
      </section>

      <section aria-labelledby="a-biblio" style="position: relative; padding: {{t.cPad}}; border: {{t.cB}}; border-top: {{t.cBT}}; border-radius: {{t.cR}}; background: {{t.cBg}}; box-shadow: {{t.cSh}}; display: flex; flex-direction: column; gap: 10px">
        <span style="display: {{t.kDisp}}; position: {{t.kPos}}; top: {{t.kTop}}; left: {{t.kLeft}}; width: max-content; padding: {{t.kPad}}; border-radius: {{t.kR}}; background: {{t.kBg}}; color: {{t.kText}}; font-family: {{t.kFont}}; font-weight: {{t.kW}}; font-size: {{t.kSize}}; letter-spacing: {{t.kLS}}; text-transform: {{t.kTT}}">{{k.biblio}}</span>
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 16px">
          <h2 id="a-biblio" style="position: relative; margin: 0; display: flex; align-items: center; gap: 12px; padding: {{t.h2pad}}; border-radius: {{t.h2r}}; border-bottom: {{t.h2line}}; background: {{t.h2bg}}; color: {{t.h2c}}; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-style: {{t.h2fs}}; font-size: {{t.h2size}}; line-height: 1.15; text-transform: {{t.h2tt}}; text-shadow: {{t.h2sh}}; transform: rotate({{t.h2rot}})"><span aria-hidden="true" style="display: {{t.mkDisp}}; flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 6px solid #1B2350; background: #FFFFFF"></span>Sur quels albums ?<sc-if value="{{t.tail}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; left: 26px; bottom: -11px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 10px solid transparent; border-top: 12px solid {{t.h2bg}}"></span></sc-if></h2>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <button type="button" onClick="{{openAll}}" style="min-height: 32px; padding: 0 12px; border: {{t.secB}}; border-radius: {{t.btnR}}; background: transparent; color: {{t.secText}}; font-family: {{t.fb}}; font-weight: 700; font-size: 13px; cursor: pointer">Tout déplier</button>
            <button type="button" onClick="{{closeAll}}" style="min-height: 32px; padding: 0 12px; border: {{t.secB}}; border-radius: {{t.btnR}}; background: transparent; color: {{t.secText}}; font-family: {{t.fb}}; font-weight: 700; font-size: 13px; cursor: pointer">Tout replier</button>
          </div>
        </div>
        <p style="margin: 0; font-size: 13px; color: {{t.muted}}">{{biblioSummary}}</p>

        <ul style="margin: 0; padding: 0; list-style: none; border-top: {{t.rowB}}">
          <sc-for list="{{entries}}" as="e" hint-placeholder-count="9">
            <li style="border-bottom: {{t.rowB}}">
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; min-height: 44px; padding: 4px 0; box-sizing: border-box">
                <sc-if value="{{e.noOpen}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 34px; flex: none"></span></sc-if>
                <sc-if value="{{e.canOpen}}" hint-placeholder-val="{{true}}"><button type="button" aria-expanded="{{e.expanded}}" aria-label="{{e.toggleLabel}}" onClick="{{e.toggle}}" style="width: 34px; height: 36px; flex: none; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; background: transparent; color: {{t.text}}; cursor: pointer"><span aria-hidden="true" style="width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: {{nest.bg}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate({{e.chevron}})"><path d="M9 6l6 6-6 6"></path></svg></span></button></sc-if>
                <sc-if value="{{e.isSeries}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="position: relative; width: 40px; height: 40px; flex: none">
                  <sc-for list="{{e.stack}}" as="c" hint-placeholder-count="3"><span style="position: absolute; left: {{c.left}}; top: {{c.top}}; width: 24px; height: 32px; border-radius: 3px; background: {{c.bg}}; box-shadow: 0 0 0 1.5px {{t.bg}}, 0 1px 3px rgba(0,0,0,.3); transform: rotate({{c.rot}})"></span></sc-for>
                </span></sc-if>
                <sc-if value="{{e.isAlbum}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 34px; flex: none"></span></sc-if>
                <sc-if value="{{e.isAlbum}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 40px; height: 40px; flex: none; display: inline-flex; align-items: center; justify-content: center"><span style="width: 30px; height: 40px; border-radius: 3px; background: {{e.cover}}; box-shadow: 0 1px 3px rgba(0,0,0,.3)"></span></span></sc-if>
                <span style="flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; line-height: 1.3">
                  <a href="#" style="align-self: flex-start; font-weight: 700; font-size: 15px; color: {{t.text}}">{{e.title}}</a>
                  <span style="font-size: 12px; color: {{t.muted}}">{{e.meta}}</span>
                </span>
                <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px">
                  <sc-if value="{{e.hasSeriesRoles}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: {{t.muted}}">Sur la série :</span></sc-if>
                  <sc-for list="{{e.roles}}" as="r" hint-placeholder-count="1"><span style="display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; border-radius: {{t.btnR}}; background: {{r.bg}}; color: {{r.fg}}; font-weight: 700; font-size: 12px">{{r.label}}</span></sc-for>
                  <sc-if value="{{e.rated}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="{{e.ratingLabel}}" style="font-size: 13px; letter-spacing: 1px">{{e.stars}}</span></sc-if>
                  <sc-if value="{{e.isAlbum}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; box-sizing: border-box; border: {{e.badgeB}}; border-radius: {{t.btnR}}; background: {{e.badgeBg}}; color: {{e.badgeFg}}; font-weight: 700; font-size: 11px">{{e.badge}}</span></sc-if>
                </span>
              </div>
              <sc-if value="{{e.open}}" hint-placeholder-val="{{false}}">
                <ol aria-label="{{e.listLabel}}" style="margin: 0 0 8px clamp(18px, 5vw, 44px); padding: 2px 12px; list-style: none; border-left: 4px solid {{t.acc}}; border-radius: 0 {{nest.r}} {{nest.r}} 0; background: {{nest.bg}}">
                  <sc-for list="{{e.albums}}" as="b" hint-placeholder-count="4">
                    <li style="display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; min-height: 44px; padding: 4px 0; box-sizing: border-box; border-top: {{b.rowB}}">
                      <span aria-hidden="true" style="width: 40px; height: 40px; flex: none; display: inline-flex; align-items: center; justify-content: center"><span style="width: 30px; height: 40px; border-radius: 3px; background: {{b.cover}}; box-shadow: 0 1px 3px rgba(0,0,0,.3)"></span></span>
                      <span style="flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; line-height: 1.3">
                        <a href="#" style="align-self: flex-start; font-weight: 700; color: {{t.text}}">{{b.title}}</a>
                        <span style="font-size: 12px; color: {{t.muted}}">{{b.meta}}</span>
                      </span>
                      <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px">
                        <sc-for list="{{b.roles}}" as="r" hint-placeholder-count="1"><span style="display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; border-radius: {{t.btnR}}; background: {{r.bg}}; color: {{r.fg}}; font-weight: 700; font-size: 12px">{{r.label}}</span></sc-for>
                        <sc-if value="{{b.rated}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="{{b.ratingLabel}}" style="font-size: 13px; letter-spacing: 1px">{{b.stars}}</span></sc-if>
                        <span style="display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; box-sizing: border-box; border: {{b.badgeB}}; border-radius: {{t.btnR}}; background: {{b.badgeBg}}; color: {{b.badgeFg}}; font-weight: 700; font-size: 11px">{{b.badge}}</span>
                      </span>
                    </li>
                  </sc-for>
                </ol>
              </sc-if>
            </li>
          </sc-for>
        </ul>
      </section>
    </main>
  </div>

  <footer style="max-width: 1280px; margin: 0 auto; padding: 12px clamp(12px, 3vw, 24px) 24px; box-sizing: border-box; font-size: 12px; color: {{t.muted}}">
    <span>Auteur créé le 2 février 2026, modifié le 2 février 2026.</span>
  </footer>
</div>
</template>
<script>
// Shared defaults: each theme only states what its identity changes.
const BASE = {
  kDisp: 'none', kPos: 'static', kTop: 'auto', kLeft: 'auto', kBg: 'transparent', kText: 'inherit', kPad: '0', kR: '0',
  kFont: 'inherit', kW: '700', kSize: '12px', kLS: '0', kTT: 'none', kPre: null,
  mkDisp: 'none', lgMark: false, lgSh: 'none', lgTSh: 'none', lgRot: '0deg', lgPad: '0', lgR: '0', lgBg: 'transparent',
  h2fs: 'normal', h2sh: 'none', h2tt: 'none', h2line: '0', h2pad: '0', h2r: '0', h2bg: 'transparent', h2rot: '0deg', tail: false,
  fdTT: 'none', navTT: 'none', navLine: 'transparent', navUnderline: false, h1size: 'clamp(24px, 3.2vw, 38px)', cSh: 'none',
  cvPad: '0', cvB: '0', cvR: '0', cvBg: 'transparent', cvSh: 'none', cvRot: '0deg', imgR: '0', tape: false, shelf: false
};

// « Cases et bulles » comes in two tints that only differ by their purple shades.
const CASES_INKS = ['#4FD1C5', '#FF7A6B', '#B69CFF', '#9BE07A', '#7FB8FF', '#F7A8D0', '#FFD166'];
const cases = (c) => ({
  ...BASE,
  bg: c.bg, text: '#FBF3EA', muted: c.muted, line: c.border,
  acc: '#FFB547', onAcc: c.bg, link: '#FFB547', colBg: '#9BE07A', colFg: c.bg,
  fd: 'Fraunces, Georgia, serif', fdw: '800', fb: "'DM Sans', system-ui, sans-serif",
  cBg: c.panel, cB: '2px solid ' + c.border, cBT: '2px solid ' + c.border, cR: '26px 16px 28px 18px', cPad: 'clamp(14px, 2.2vw, 22px)',
  tBg: c.bg, tB: '2px solid ' + c.border, tR: '18px 12px 20px 14px', rowB: '1px solid ' + c.border,
  inR: '999px', btnR: '999px', secB: '2px solid ' + c.soft, secText: '#FBF3EA', chipR: '999px',
  hBg: 'transparent', hText: '#FBF3EA', hLine: '0', hInBg: c.panel, hInB: '2px solid ' + c.border, hInText: '#FBF3EA',
  helpBg: '#4FD1C5', helpText: c.bg, helpR: '50% 50% 50% 12%', helpB: '0',
  lgBg: '#FBF3EA', lgText: c.bg, lgPad: '5px 14px', lgR: '22px 26px 24px 8px', lgRot: '-2deg', lgFont: '800 20px Fraunces, Georgia, serif', lgTT: 'none', lgDot: '#FFB547',
  h2c: c.bg, h2bg: '#FBF3EA', h2pad: '5px 16px', h2r: '26px 30px 28px 22px', h2size: '18px', h2rot: '-1.5deg', tail: true,
  cvPad: '10px', cvB: '0', cvR: '16px 10px 18px 12px', cvBg: '#4FD1C5', cvRot: '-2.5deg', cvSh: '0 16px 30px rgba(0,0,0,.35)', imgR: '8px 4px 10px 6px',
  pal: CASES_INKS.map((x) => [x, c.bg])
});

// Text set on a coloured fill keeps a 4.5:1 contrast: where a theme's own ink would not reach it,
// another ink of the same theme carries the text or the fill.
const THEMES = {
  violine: cases({ bg: '#2B1030', panel: '#3A1641', border: '#6A3375', soft: '#EBD3EF', muted: '#CFA9D6' }),
  mure: cases({ bg: '#1F1033', panel: '#2A1844', border: '#533A78', soft: '#DCD1EE', muted: '#B9A8D8' }),
  gazette: {
    ...BASE,
    bg: '#FBF3EA', text: '#2B1030', muted: '#5E3F63', line: '#D9C6CF',
    acc: '#2B1030', onAcc: '#FBF3EA', link: '#9A3D12', colBg: '#FFB547', colFg: '#2B1030',
    fd: 'Fraunces, Georgia, serif', fdw: '800', fb: "'DM Sans', system-ui, sans-serif",
    cBg: 'transparent', cB: '0', cBT: '2px solid #2B1030', cR: '0', cPad: '14px 0 0',
    tBg: 'transparent', tB: '1px solid #D9C6CF', tR: '0', rowB: '1px solid #D9C6CF',
    inR: '999px', btnR: '999px', secB: '2px solid #2B1030', secText: '#2B1030', chipR: '0',
    hBg: 'transparent', hText: '#2B1030', hLine: '4px double #2B1030', hInBg: 'transparent', hInB: '2px solid #2B1030', hInText: '#2B1030',
    helpBg: '#2B1030', helpText: '#FBF3EA', helpR: '50%', helpB: '0',
    lgText: '#2B1030', lgFont: '800 26px Fraunces, Georgia, serif', lgTT: 'none', lgDot: '#FFB547',
    navUnderline: true, navLine: '#FFB547',
    h2c: '#2B1030', h2size: '22px', h2fs: 'italic',
    kDisp: 'block', kText: '#5E3F63', kSize: '12px', kLS: '.1em', kTT: 'uppercase',
    cvPad: '8px', cvB: '1px solid #2B1030', cvBg: '#FFFFFF', cvRot: '-1.5deg', cvSh: '6px 6px 0 #D9C6CF',

// On a coloured header, the active entry takes the header's own highlight rather than the page accent.
const NAV_ACTIVE = { vignettes: ['#FFD23F', '#23323A'] };

// Bibliography in the order of the sort keys, series and albums without a series together
// (« Les 30 ans de Soleil » sorts as « 30 ans de Soleil [Les] », under #).
// Album: [tome label, own title, roles, owned state, rating]; owned state 'own', 'no' or 'intent'.
const D = ['dessin'], DC = ['dessin', 'couleurs'];
const ythaq = Array.from({ length: 16 }, (_, i) => {
  const n = i + 1;
  return ['T. ' + n, '', n <= 3 ? DC : D, n === 15 ? 'no' : n === 16 ? 'intent' : 'own', 0];
});
const BIBLIOGRAPHY = [
  { album: true, title: 'Les 30 ans de Soleil', roles: D, state: 'own', rating: 0 },
  { title: 'Les amis de…', seriesRoles: [], seriesSize: 3, albums: [['T. 2', '', D, 'own', 0]] },
  { album: true, title: 'Carnet de croquis', roles: ['scenario', 'dessin'], state: 'no', rating: 0 },
  { title: 'Cixi de Troy', seriesRoles: [], seriesSize: 3, albums: [['T. 3', 'Le Secret de Cixi - 3e partie', D, 'own', 2]] },
  { title: 'Les fil.le.s de Soleil', seriesRoles: [], seriesSize: 12, albums: [['T. 4', '', D, 'own', 0]] },
  { title: 'Krashmonsters', seriesRoles: [], seriesSize: 2, albums: [['T. 1', 'Mosca Argnus Siestae', DC, 'own', 0]] },
  { title: "Les Naufragés d'Ythaq", seriesRoles: D, seriesSize: 18, albums: ythaq },
  { title: 'Sangre', seriesRoles: D, seriesSize: 6, albums: Array.from({ length: 6 }, (_, i) => ['T. ' + (i + 1), '', D, 'own', i === 0 ? 4 : 0]) },
  { title: 'Slhoka', seriesRoles: DC, seriesSize: 5, albums: Array.from({ length: 5 }, (_, i) => ['T. ' + (i + 1), '', DC, i < 4 ? 'own' : 'no', 0]) },
  // Credited on the series itself only: the series is listed, with no album to unfold.
  { title: 'Les Terres de Troy', seriesRoles: D, seriesSize: 4, albums: [] }
];
const ROLE_LABELS = { scenario: 'Scénario', dessin: 'Dessin', couleurs: 'Couleurs' };
const ROLE_ORDER = ['scenario', 'dessin', 'couleurs'];
// A long series starts folded, so that one prolific series does not hide the rest of the bibliography.
const FOLD_ABOVE = 6;
const GENERIC_CARD = 'rgba(127,127,127,.35)';

class View extends Mockup {
  renderVals() {
    const key = this.props.theme ?? 'violine';
    const t = THEMES[key] ?? THEMES.violine;
    const kick = (i, label) => (t.kPre ? t.kPre(i, label) : label);
    const [navAcc, navOnAcc] = NAV_ACTIVE[key] ?? [t.acc, t.onAcc];
    const navItem = (label, current) => ({
      label,
      current: current ? 'page' : 'false',
      bg: current && !t.navUnderline ? navAcc : 'transparent',
      fg: current && !t.navUnderline ? navOnAcc : t.hText,
      deco: current && t.navUnderline ? 'underline' : 'none'
    });
    const defaults = Object.fromEntries(BIBLIOGRAPHY.map((e, i) => [i, !e.album && e.albums.length > 0 && e.albums.length <= FOLD_ABOVE]));
    const open = this.state?.open ?? defaults;
    // Each role keeps its colour across the page, so that a role reads at a glance in a long list.
    const roleChips = (roles) => ROLE_ORDER.filter((r) => roles.includes(r)).map((r) => {
      const [bg, fg] = t.pal[ROLE_ORDER.indexOf(r) % t.pal.length];
      return { label: ROLE_LABELS[r], bg, fg };
    });
    const badge = (state) => ({
      badge: state === 'own' ? 'Dans la collection' : (state === 'intent' ? "Intention d'achat" : 'Hors collection'),
      badgeBg: state === 'own' ? t.colBg : 'transparent',
      badgeFg: state === 'own' ? t.colFg : t.text,
      badgeB: state === 'own' ? '0' : '2px dashed ' + t.line
    });
    const rating = (n) => ({
      rated: n > 0, stars: '★'.repeat(n) + '☆'.repeat(5 - n), ratingLabel: 'Appréciation : ' + n + ' sur 5'
    });
    const allAlbums = BIBLIOGRAPHY.flatMap((e) => (e.album ? [e.roles] : e.albums.map((a) => a[2])));
    const byRole = ROLE_ORDER.map((r) => [r, allAlbums.filter((roles) => roles.includes(r)).length]).filter(([, n]) => n > 0);
    const seriesCount = BIBLIOGRAPHY.filter((e) => !e.album).length;
    const loneCount = BIBLIOGRAPHY.length - seriesCount;
    // An author may be in the base without any credit yet: every count reads right at zero and at one.
    const count = (n, one, many, none) => (n === 0 ? none : n + ' ' + (n > 1 ? many : one));
    const credits = allAlbums.length === 0
      ? 'Crédité sur aucun album'
      : 'Crédité sur ' + allAlbums.length + (allAlbums.length > 1 ? ' albums' : ' album');
    // Every album, in a series or not, is shown by its cover: only a series has a pile of covers.
    // A cover belongs to the album itself (entry, and volume within its series), never to its rank in this list.
    const cover = (entry, volume) => 'hsl(' + ((entry * 67 + volume * 29 + 200) % 360) + ', 42%, 36%)';
    const volumeOf = (tome) => Number(tome.replace(/^T\. /, '')) || 1;
    const entries = BIBLIOGRAPHY.map((e, i) => {
      const base = { title: e.title };
      if (e.album) {
        return {
          ...base, isAlbum: true, isSeries: false, canOpen: false, noOpen: false, open: false, cover: cover(i, 1),
          meta: 'Album sans série', roles: roleChips(e.roles), hasSeriesRoles: false, albums: [], ...rating(e.rating), ...badge(e.state)
        };
      }
      const hasAlbums = e.albums.length > 0;
      const isOpen = hasAlbums && Boolean(open[i]);
      const owned = e.albums.filter((a) => a[3] === 'own').length;
      // An album without its own title is named by its volume alone (« Tome 3 »).
      const albums = e.albums.map(([tome, title, roles, state, n], k) => ({
        title: title || tome.replace(/^T\. /, 'Tome '), meta: e.title + ' · ' + tome, cover: cover(i, volumeOf(tome)),
        rowB: k === 0 ? '0' : t.rowB,
        roles: roleChips(roles), ...rating(n), ...badge(state)
      }));
      const credited = hasAlbums
        ? 'crédité sur ' + e.albums.length + (e.albums.length > 1 ? ' albums' : ' album') + ' sur ' + e.seriesSize + ' · ' + owned + ' dans la collection'
        : 'crédité sur la série seulement, sur aucun de ses ' + e.seriesSize + ' albums';
      return {
        ...base, isAlbum: false, isSeries: true, canOpen: hasAlbums, noOpen: !hasAlbums, open: isOpen, rated: false,
        listLabel: 'Albums de la série ' + e.title,
        // The pile shows the series itself, by the covers of its first volumes, whatever the author is credited on:
        // a series credited on itself only, with no album listed, has its pile too. It always keeps three cards, so
        // that a series never passes for a single album: a place beyond the volumes of the series is a generic card.
        stack: [
          { left: '14px', top: '0', rot: '8deg', bg: e.seriesSize >= 3 ? cover(i, 3) : GENERIC_CARD },
          { left: '8px', top: '5px', rot: '2deg', bg: e.seriesSize >= 2 ? cover(i, 2) : GENERIC_CARD },
          { left: '2px', top: '10px', rot: '-5deg', bg: e.seriesSize >= 1 ? cover(i, 1) : GENERIC_CARD }
        ],
        expanded: isOpen ? 'true' : 'false',
        chevron: isOpen ? '90deg' : '0deg',
        toggleLabel: (isOpen ? 'Replier ' : 'Déplier ') + e.title,
        toggle: () => this.setState({ open: { ...open, [i]: !isOpen } }),
        meta: 'Série · ' + credited,
        roles: roleChips(e.seriesRoles),
        hasSeriesRoles: e.seriesRoles.length > 0,
        albums
      };
    });
    const chip = { bg: 'transparent', fg: t.text, bd: t.tB === '0' ? '2px solid ' + t.line : t.tB };
    return {
      t,
      // The scroll hint of the menu fades into what lies behind it: the header, or the page under a transparent one.
      hintBg: t.hBg === 'transparent' ? t.bg : t.hBg,
      a: {
        name: 'Adrien Floch', initials: 'AF', hasRealName: false, realName: '',
        nationality: 'Non renseignée', nationalityColor: t.muted,
        bio: "Aucune biographie pour l'instant.", bioColor: t.muted
      },
      mono: { bg: t.pal[0][0], fg: t.pal[0][1], r: t.cvR === '0' ? '50%' : t.cvR },
      // The albums of an unfolded series sit in a tinted box, so that the next entry, outside it, cannot pass for one of them.
      nest: {
        bg: t.tBg !== 'transparent' && t.tBg !== t.cBg ? t.tBg : 'rgba(127,127,127,.10)',
        r: t.tR === '0' ? '0' : '12px'
      },
      k: { bio: kick(1, 'Portrait'), biblio: kick(2, 'Bibliographie') },
      nav: [navItem('Accueil', false), navItem('Albums', false), navItem('Séries', false), navItem('Auteurs', true), navItem("Intentions d'achat", false)],
      facts: [
        { label: credits, bg: t.acc, fg: t.onAcc, bd: '2px solid ' + t.acc },
        ...byRole.map(([r, n]) => ({ label: ROLE_LABELS[r] + ' · ' + n, ...chip }))
      ],
      biblioSummary: BIBLIOGRAPHY.length === 0
        ? 'Aucune série ni aucun album crédité pour l\'instant.'
        : count(seriesCount, 'série', 'séries', 'Aucune série') + ' et ' + count(loneCount, 'album sans série', 'albums sans série', 'aucun album sans série')
          + ', rangés par ordre alphabétique ; chaque album indique le ou les rôles tenus.',
      entries,
      openAll: () => this.setState({ open: Object.fromEntries(BIBLIOGRAPHY.map((e, i) => [i, !e.album && e.albums.length > 0])) }),
      closeAll: () => this.setState({ open: {} })
    };
  }
}

Mockup.mount(View, {"theme": {"label": "Thème", "editor": "enum", "options": ["violine", "mure", "gazette", "sommaire", "festival", "riso", "librairie", "vignettes"], "default": "violine"}});
</script>
