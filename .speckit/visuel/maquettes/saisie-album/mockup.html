<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saisie d'un album — administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Baloo+2:wght@600;700;800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;family=DM+Serif+Display:ital@0;1&amp;family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&amp;family=Karla:wght@400;500;700&amp;family=Libre+Franklin:ital,wght@0,400;0,600;0,800;1,800&amp;family=Nunito:wght@400;600;700&amp;family=Rubik+Mono+One&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
/* A placeholder keeps the contrast of muted text rather than fading it with an opacity. */
input::placeholder,textarea::placeholder{color:var(--placeholder);opacity:1}
/* The focus ring is drawn outside the control, over a band of the page colour: it stands out from the
   control, coloured or not, and from the surface around it. */
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 2px var(--focus-gap)}
.adm-search{flex:1 1 260px;max-width:400px;margin-left:auto}
/* A single column: the album's editions have their own page, reached from the list of albums. */
.sa-layout{display:grid;grid-template-columns:minmax(0,878px);gap:22px}
.sa-role{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 14px;align-items:start}
.sa-status-sm{display:none}
/* Volume numbering and publication date: two unrelated settings, in two blocks side by side. */
.sa-duo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:stretch}
@media (max-width: 640px){
  .adm-search{order:3;flex-basis:100%;max-width:none;margin-left:0}
  .adm-actions{margin-left:auto}
  .adm-consult-label,.adm-menu-label,.sa-hide-sm{display:none}
  .adm-menu{width:38px;padding:0 !important;justify-content:center}
  .adm-tag{padding:2px 8px !important;font-size:11px !important}
  .sa-role{grid-template-columns:minmax(0,1fr)}
  .sa-duo{grid-template-columns:minmax(0,1fr)}
  /* The save bar keeps to one line: the status shrinks to a word. */
  .sa-status{display:none}
  .sa-status-sm{display:inline}
  .sa-bar{flex-wrap:nowrap !important}
}
</style>
<script src="../shared/mockup.js"></script>
</head>
<body>
<div id="mockup"></div>
<template id="view">
<div style="--placeholder: {{t.muted}}; --focus: {{t.text}}; --focus-gap: {{t.bg}}; min-height: 100vh; background: {{t.bg}}; color: {{t.text}}; font-family: {{t.fb}}; font-size: 15px; line-height: 1.5">

  <header style="--placeholder: {{hdrMuted}}; --focus: {{t.hText}}; --focus-gap: {{hdrBg}}; position: sticky; top: 0; z-index: 20; background: {{hdrBg}}; color: {{t.hText}}; border-bottom: {{t.hLine}}">
    <div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 10px clamp(12px, 3vw, 24px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px">
      <a href="#" style="display: flex; align-items: center; gap: 10px; color: {{t.hText}}; text-decoration: none">
        <sc-if value="{{t.lgMark}}"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #E8604C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px">B</span></sc-if>
        <span style="display: inline-block; padding: {{t.lgPad}}; border-radius: {{t.lgR}}; background: {{t.lgBg}}; color: {{t.lgText}}; font: {{t.lgFont}}; line-height: 1.1; text-transform: {{t.lgTT}}; transform: rotate({{t.lgRot}}); box-shadow: {{t.lgSh}}; text-shadow: {{t.lgTSh}}">BDthèque<span style="color: {{t.lgDot}}">.</span></span>
      </a>
      <span class="adm-tag" style="padding: 4px 12px; border: {{t.tagB}}; border-radius: {{t.tagR}}; background: {{t.tagBg}}; color: {{t.tagText}}; font-weight: 700; font-size: 13px; text-transform: {{t.tagTT}}; letter-spacing: {{t.tagLS}}">Administration</span>
      <div class="adm-search" style="min-width: 0; display: flex; align-items: center; gap: 8px">
        <label for="find" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Retrouver une fiche</label>
        <input id="find" type="search" placeholder="Retrouver une fiche à modifier…" style="flex: 1 1 auto; min-width: 0; height: 38px; padding: 0 14px; box-sizing: border-box; border: {{t.hInB}}; border-radius: {{t.inR}}; background: {{t.hInBg}}; color: {{t.hInText}}; font: inherit">
        <button type="button" aria-label="Aide sur cette page" style="width: 38px; height: 38px; flex: none; border: {{t.helpB}}; border-radius: {{t.helpR}}; background: {{t.helpBg}}; color: {{t.helpText}}; font-family: {{t.fd}}; font-weight: 700; font-size: 18px; cursor: pointer">?</button>
      </div>
      <div class="adm-actions" style="display: flex; align-items: center; gap: 8px">
      <a href="#" aria-label="Aller à la consultation" style="display: inline-flex; align-items: center; gap: 6px; height: 38px; flex: none; padding: 0 6px; color: {{t.hText}}; font-weight: 700; font-size: 14px"><span class="adm-consult-label">Aller à la consultation</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7 M9 7h8v8"></path></svg></a>
      <button type="button" aria-label="Menu" aria-expanded="{{menuExpanded}}" aria-controls="admin-menu" onClick="{{toggleMenu}}" class="adm-menu" style="display: inline-flex; align-items: center; gap: 8px; height: 38px; flex: none; padding: 0 12px; border: {{t.hInB}}; border-radius: {{t.btnR}}; background: {{t.hInBg}}; color: {{t.hInText}}; font-family: {{t.fb}}; font-weight: 700; font-size: 14px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg><span class="adm-menu-label">Menu</span></button>
      </div>

      <sc-if value="{{menuOpen}}">
    <button type="button" tabindex="-1" aria-label="Fermer le menu" onClick="{{closeMenu}}" style="position: fixed; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: transparent; cursor: default"></button>
    <nav id="admin-menu" aria-label="Plan de l'administration" style="--focus: {{t.text}}; --focus-gap: {{panelBg}}; position: absolute; top: calc(100% + 8px); right: 24px; width: min(340px, calc(100% - 48px)); max-height: 80vh; overflow-y: auto; overscroll-behavior: contain; padding: 14px 14px 12px; border: {{panelB}}; border-radius: {{t.cR}}; background: {{panelBg}}; color: {{t.text}}; box-shadow: {{panelSh}}; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: {{t.rowB}}">
        <span style="padding-left: 10px; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: 16px; text-transform: {{t.fdTT}}">Menu</span>
        <button type="button" aria-label="Fermer le menu" onClick="{{toggleMenu}}" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: {{t.secB}}; border-radius: {{t.btnR}}; background: transparent; color: {{t.secText}}; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <sc-for list="{{menu}}" as="g">
        <div style="display: flex; flex-direction: column; gap: 1px">
          <span style="padding: 0 10px 2px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: {{t.muted}}">{{g.label}}</span>
          <sc-for list="{{g.items}}" as="m">
            <a href="#" aria-current="{{m.current}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; padding: 0 10px; font-size: 14px; border-radius: {{t.btnR}}; background: {{m.bg}}; color: {{m.fg}}; font-weight: {{m.fw}}">
              <span>{{m.label}}</span>
              <span style="font-size: 13px; font-variant-numeric: tabular-nums; opacity: .85">{{m.n}}</span>
            </a>
          </sc-for>
        </div>
      </sc-for>
      <div style="padding-top: 8px; border-top: {{t.rowB}}">
        <button type="button" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 0 10px; border: 0; border-radius: {{t.btnR}}; background: transparent; color: {{t.text}}; font-family: {{t.fb}}; font-weight: 700; font-size: 14px; text-align: left; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4 M10 8l-4 4 4 4 M6 12h10"></path></svg>Se déconnecter</button>
      </div>
    </nav>
      </sc-if>
    </div>
  </header>

  <div style="max-width: 1280px; margin: 0 auto; padding: 14px clamp(12px, 3vw, 24px) 24px; box-sizing: border-box">
    <main style="display: flex; flex-direction: column; gap: 18px">

      <div style="display: flex; flex-direction: column; gap: 6px">
        <nav aria-label="Fil d'Ariane" style="font-size: 13px; color: {{t.muted}}; overflow-wrap: anywhere">
          <a href="#" style="color: {{t.link}}; font-weight: 700">Administration</a>
          <span aria-hidden="true" style="margin: 0 6px">›</span>
          <a href="#" style="color: {{t.link}}; font-weight: 700">Albums</a>
          <span aria-hidden="true" style="margin: 0 6px">›</span>
          <span aria-current="page">{{x.crumb}}</span>
        </nav>
        <div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 16px">
          <div style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <h1 style="margin: 0; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: {{t.h1size}}; line-height: 1.05; text-transform: {{t.fdTT}}; color: {{t.text}}">{{x.heading}}</h1>
            <span style="font-size: 14px; color: {{t.muted}}"><span style="font-weight: 700; color: {{t.text}}">{{label}}</span> {{x.labelNote}}</span>
          </div>
        </div>
      </div>

      <sc-if value="{{err}}">
        <div role="alert" style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 2px {{err.style}} {{err.border}}; border-left-width: 8px; border-radius: {{t.tR}}; background: {{err.bg}}; color: {{err.fg}}">
          <span aria-hidden="true" style="width: 30px; height: 30px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: {{err.iconBg}}; color: {{err.iconFg}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{err.icon}}"></path></svg></span>
          <div style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase">{{err.kind}}</span>
            <strong style="font-size: 15px">{{err.title}}</strong>
            <span style="font-size: 14px">{{err.text}}</span>
            <sc-if value="{{err.action}}"><span style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px"><button type="button" style="height: 34px; padding: 0 14px; border: 2px solid currentColor; border-radius: {{t.btnR}}; background: transparent; color: inherit; font-family: {{t.fb}}; font-weight: 700; font-size: 13px; cursor: pointer">{{err.action}}</button><sc-if value="{{err.action2}}"><button type="button" style="height: 34px; padding: 0 14px; border: 0; border-radius: {{t.btnR}}; background: transparent; color: inherit; font-family: {{t.fb}}; font-weight: 700; font-size: 13px; text-decoration: underline; cursor: pointer">{{err.action2}}</button></sc-if></span></sc-if>
          </div>
        </div>
      </sc-if>

      <div class="sa-layout">
        <form style="min-width: 0; display: flex; flex-direction: column; gap: 22px" onSubmit="{{noSubmit}}">

          <section aria-labelledby="s-ident" style="{{block}}">
            <span style="{{kickStyle}}">{{k.ident}}</span>
            <h2 id="s-ident" style="{{h2}}"><span aria-hidden="true" style="{{mark}}"></span><span aria-hidden="true" style="{{tail}}"></span>L'album</h2>

            <div style="display: flex; flex-direction: column; gap: 4px">
              <label for="f-series" style="{{lbl}}">Série</label>
              <div style="position: relative">
                <input id="f-series" type="text" value="{{x.series}}" placeholder="Aucune série : album isolé" autocomplete="off" style="{{inp}} padding-right: 76px">
                <span style="position: absolute; right: 8px; top: 7px; display: flex; gap: 2px">
                  <sc-if value="{{x.series}}"><button type="button" aria-label="Retirer la série" style="{{iconBtn}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></sc-if>
                  <span aria-hidden="true" style="{{iconBtn}} color: {{t.muted}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="{{icons.search}}"></path></svg></span>
                </span>
              </div>
              <span style="{{help}}">{{x.seriesHelp}}</span>
            </div>

            <div style="display: flex; flex-direction: column; gap: 4px">
              <label for="f-title" style="{{lbl}}">Titre <span style="font-weight: 400; color: {{t.muted}}">{{x.titleNote}}</span></label>
              <input id="f-title" type="text" value="{{x.title}}" placeholder="{{x.titlePh}}" aria-invalid="{{titleInvalid}}" aria-describedby="f-title-err" style="{{inp}} border: {{titleBorder}}">
              <sc-if value="{{titleError}}"><span id="f-title-err" style="display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; color: {{t.del}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6 M12 17h.01"></path></svg>{{titleError}}</span></sc-if>
            </div>

            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px">
                <label for="f-key" style="{{lbl}}">Clé de tri</label>
                <span style="padding: 0 8px; border: {{keyBadgeB}}; border-radius: {{t.btnR}}; background: {{keyBadgeBg}}; color: {{keyBadgeFg}}; font-weight: 700; font-size: 11px; letter-spacing: .04em; text-transform: uppercase">{{keyMode}}</span>
                <sc-if value="{{keyManual}}"><button type="button" style="padding: 0; border: 0; background: transparent; color: {{t.link}}; font-family: {{t.fb}}; font-weight: 700; font-size: 13px; cursor: pointer">Réinitialiser</button></sc-if>
              </span>
              <input id="f-key" type="text" value="{{x.key}}" placeholder="{{x.keyPh}}" style="{{inp}}">
              <span style="{{help}}">{{keyHelp}}</span>
            </div>
          </section>

          <div class="sa-duo">
          <section aria-labelledby="s-volume" style="{{block}}">
            <span style="{{kickStyle}}">{{k.volume}}</span>
            <h2 id="s-volume" style="{{h2}}"><span aria-hidden="true" style="{{mark}}"></span><span aria-hidden="true" style="{{tail}}"></span>Tomaison</h2>

            <div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px 28px">
              <fieldset style="margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                <legend style="{{lbl}} padding: 0 0 4px">Type</legend>
                <div style="display: flex; align-items: center; gap: 18px; height: 38px">
                  <sc-for list="{{flags}}" as="f">
                    <label style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer">
                      <input type="checkbox" checked="{{f.checked}}" onChange="{{f.toggle}}" style="width: 18px; height: 18px; margin: 0; accent-color: {{t.acc}}; cursor: pointer">{{f.label}}
                    </label>
                  </sc-for>
                </div>
              </fieldset>
              <div style="display: flex; flex-direction: column; gap: 4px">
                <label for="f-tome" style="{{lbl}}">{{tomeLabel}}</label>
                <input id="f-tome" type="text" inputmode="numeric" maxlength="4" value="{{x.tome}}" style="{{num}} width: 64px">
              </div>
              <sc-if value="{{omnibus}}">
                <fieldset aria-describedby="f-range-help" style="margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                  <legend style="{{lbl}} padding: 0 0 4px">Tomes couverts</legend>
                  <div style="display: flex; align-items: center; gap: 8px">
                    <label for="f-from" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Du tome</label>
                    <input id="f-from" type="text" inputmode="numeric" maxlength="4" value="{{x.from}}" style="{{num}} width: 64px">
                    <span aria-hidden="true" style="font-size: 14px; color: {{t.muted}}">à</span>
                    <label for="f-to" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Au tome</label>
                    <input id="f-to" type="text" inputmode="numeric" maxlength="4" value="{{x.to}}" style="{{num}} width: 64px">
                  </div>
                  <span id="f-range-help" style="{{help}}">Les deux, ou aucun.</span>
                </fieldset>
              </sc-if>
            </div>
          </section>

          <section aria-labelledby="s-date" style="{{block}}">
            <span style="{{kickStyle}}">{{k.date}}</span>
            <h2 id="s-date" style="{{h2}}"><span aria-hidden="true" style="{{mark}}"></span><span aria-hidden="true" style="{{tail}}"></span>Parution</h2>
              <fieldset aria-describedby="f-date-help" style="margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                <legend style="{{lbl}} padding: 0 0 4px">Première publication</legend>
                <div style="display: flex; align-items: center; gap: 8px">
                  <label for="f-month" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Mois</label>
                  <span style="position: relative; display: block"><select id="f-month" style="{{num}} width: 138px; text-align: left; padding: 0 30px 0 12px; appearance: none"><sc-for list="{{months}}" as="m"><option selected="{{m.selected}}">{{m.label}}</option></sc-for></select><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 11px; top: 13px; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg></span>
                  <label for="f-year" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Année</label>
                  <input id="f-year" type="text" inputmode="numeric" maxlength="4" value="{{x.year}}" placeholder="aaaa" style="{{num}} width: 76px">
                </div>
                <span id="f-date-help" style="{{help}}">Mois facultatif ; jamais le jour.</span>
              </fieldset>
          </section>
          </div>

          <section aria-labelledby="s-credits" style="{{block}}">
            <span style="{{kickStyle}}">{{k.credits}}</span>
            <h2 id="s-credits" style="{{h2}}"><span aria-hidden="true" style="{{mark}}"></span><span aria-hidden="true" style="{{tail}}"></span>Les auteurs</h2>
            <sc-if value="{{x.copied}}">
              <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: {{t.tR}}; background: {{t.nBg}}; color: {{t.nFg}}; font-size: 13px">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M8 8h11v11H8z M5 16V5h11"></path></svg>
                <span>Repris de la série <strong>{{x.series}}</strong>, l'album n'ayant encore aucun auteur. Ils sont à l'album désormais : les modifier ne touche pas la série.</span>
              </div>
            </sc-if>
            <div style="display: flex; flex-direction: column">
              <sc-for list="{{roles}}" as="r">
                <div class="sa-role" style="padding: 10px 0; border-bottom: {{t.rowB}}">
                  <span style="{{lbl}} padding-top: 6px">{{r.label}}</span>
                  <div style="min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
                    <sc-for list="{{r.people}}" as="p">
                      <span style="{{chip}}">{{p}}<button type="button" aria-label="Retirer {{p}} ({{r.label}})" style="{{chipX}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span>
                    </sc-for>
                    <sc-if value="{{r.none}}"><span style="font-size: 13px; color: {{t.muted}}">Personne</span></sc-if>
                    <button type="button" style="{{addBtn}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Ajouter</button>
                  </div>
                </div>
              </sc-for>
            </div>
            <span style="{{help}}">Un auteur se trouve en tapant son nom ; s'il n'existe pas encore, il se crée sur place.</span>
          </section>

          <section aria-labelledby="s-tags" style="{{block}}">
            <span style="{{kickStyle}}">{{k.tags}}</span>
            <h2 id="s-tags" style="{{h2}}"><span aria-hidden="true" style="{{mark}}"></span><span aria-hidden="true" style="{{tail}}"></span>Genres et univers</h2>
            <sc-for list="{{tagGroups}}" as="g">
              <div style="display: flex; flex-direction: column; gap: 6px">
                <span style="{{lbl}}">{{g.label}}</span>
                <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
                  <sc-for list="{{g.own}}" as="p">
                    <span style="{{chip}}">{{p}}<button type="button" aria-label="Retirer {{p}}" style="{{chipX}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></span>
                  </sc-for>
                  <sc-if value="{{g.noneOwn}}"><span style="font-size: 13px; color: {{t.muted}}">Aucun</span></sc-if>

    icon: ICONS.business, style: 'solid', border: t.del, bg: 'transparent', fg: t.text, iconBg: t.del, iconFg: t.bg === '#2B1030' || t.bg === '#1F1033' ? t.bg : '#FFFFFF', action: null
  }),
  fonctionnelle: (t) => ({
    kind: 'Modifiée entre-temps', title: 'Cette fiche a été modifiée depuis que vous l\'avez ouverte.', text: 'Vos changements ne sont pas enregistrés, pour ne pas écraser l\'autre modification. Rechargez la fiche, puis reportez-les.',
    icon: ICONS.functional, style: 'dashed', border: t.infoBg, bg: 'transparent', fg: t.text, iconBg: t.infoBg, iconFg: t.infoFg, action: 'Recharger la fiche', action2: 'Voir mes changements'
  }),
  technique: (t) => ({
    kind: 'Problème technique', title: 'L\'enregistrement n\'a pas pu aboutir.', text: 'L\'application n\'a pas répondu. Vos changements sont toujours là : réessayez dans un instant.',
    icon: ICONS.technical, style: 'dotted', border: t.muted, bg: 'transparent', fg: t.text, iconBg: t.nBg, iconFg: t.nFg, action: 'Réessayer'
  })
};

const RATING_LABELS = ['Pas encore noté', 'Très mauvais', 'Mauvais', 'Moyen', 'Bien', 'Très bien'];

class View extends Mockup {
  renderVals() {
    const t = THEMES[this.props.theme] ?? THEMES.violine;
    const x = EXAMPLES[this.props.exemple] ?? EXAMPLES.modification;
    const menuOpen = this.state?.menuOpen ?? (this.props.menuOpen ?? false);
    const type = this.state?.type ?? x.type;
    const hs = this.state?.hs ?? x.hs;
    const rating = this.state?.rating ?? x.rating;
    const keyManual = this.props.cleManuelle && Boolean(x.manualKey);
    const errorKey = this.props.erreur;
    document.documentElement.style.overflow = menuOpen ? 'hidden' : '';
    const panelBg = t.cBg === 'transparent' ? t.bg : t.cBg;
    const panelB = t.cB !== '0' ? t.cB : (t.cBT !== '0' ? t.cBT : '2px solid ' + t.line);
    const panelSh = '0 18px 40px rgba(0,0,0,.28)';
    const hdrBg = t.hBg === 'transparent' ? t.bg : t.hBg;
    const kick = (i, label) => (t.kPre ? t.kPre(i, label) : label);
    const menuItem = (label, n, current) => ({
      label, n, current: current ? 'page' : 'false',
      bg: current ? t.acc : 'transparent', fg: current ? t.onAcc : t.text, fw: current ? '700' : '500'
    });
    const omnibus = type === 'omnibus';
    const err = ERRORS[errorKey] ? ERRORS[errorKey](t) : null;
    // A business error points at the field to correct, besides the banner at the top.
    const titleError = errorKey === 'metier' ? 'Obligatoire pour un album sans série.' : null;
    // The label is rebuilt as the form changes, in the format set for the application.
    const tomeText = omnibus
      ? (x.title ? 'INT.' : 'Intégrale') + (hs ? (x.title ? 'HS' : ' hors-série') : '') + (x.tome ? ' - ' + x.tome : '') + (x.from && x.to ? ' [' + x.from + ' à ' + x.to + ']' : '')
      : (hs ? (x.title ? 'HS' : 'Hors-série') : (x.title ? 'T.' : 'Tome')) + (x.tome ? ' ' + x.tome : '');
    const hasTome = omnibus || hs || x.tome;
    let label;
    if (!x.title && !x.series) label = '<Sans titre>';
    else if (!x.title) label = x.series + (hasTome ? ' - ' + tomeText : '');
    else if (!x.series) label = x.title + (hasTome ? ' (' + tomeText + ')' : '');
    else label = x.title + ' (' + x.series + (hasTome ? ' - ' + tomeText : '') + ')';
    const field = 'width: 100%; box-sizing: border-box; border: ' + t.inB + '; border-radius: ' + t.inR + '; background: ' + t.inBg + '; color: ' + t.text + '; font: inherit; font-size: 15px;';
    const barBg = t.cBg === 'transparent' ? t.bg : (t.cBg === '#FFFFFF' || t.cBg === '#FFFBEF' || t.cBg === '#FBF7EE' ? t.cBg : t.cBg);
    return {
      t, x, label,
      icons: ICONS,
      hdrBg, hdrMuted: t.hMuted ?? t.muted,
      menuOpen, menuExpanded: menuOpen ? 'true' : 'false',
      panelBg, panelB, panelSh,
      toggleMenu: () => this.setState({ menuOpen: !menuOpen }),
      closeMenu: () => this.setState({ menuOpen: false }),
      // A click anywhere outside an open menu closes it.
      noSubmit: (e) => e.preventDefault(),
      // The mention above a block title says what kind of data the block holds, never the title again.
      k: { ident: kick(1, 'Identification'), volume: kick(2, 'Dans la série'), date: kick(3, 'Calendrier'), credits: kick(4, 'Contributions'), tags: kick(5, 'Classement'), texts: kick(6, 'Lecture') },
      block: 'position: relative; margin-top: ' + (t.cTop ?? '0') + '; padding: ' + t.cPad + '; border: ' + t.cB + '; border-top: ' + t.cBT + '; border-radius: ' + t.cR + '; background: ' + t.cBg + '; box-shadow: ' + t.cSh + '; display: flex; flex-direction: column; gap: 14px; --focus-gap: ' + panelBg + ';',
      kickStyle: 'display: ' + t.kDisp + '; position: ' + t.kPos + '; top: ' + t.kTop + '; left: ' + t.kLeft + '; width: max-content; margin-bottom: -6px; padding: ' + t.kPad + '; border-radius: ' + t.kR + '; background: ' + t.kBg + '; color: ' + t.kText + '; font-family: ' + t.kFont + '; font-weight: ' + t.kW + '; font-size: ' + t.kSize + '; letter-spacing: ' + t.kLS + '; text-transform: ' + t.kTT + ';',
      h2: 'position: relative; align-self: ' + (t.h2line !== '0' ? 'stretch' : 'flex-start') + '; margin: ' + (t.h2lift ?? '0') + ' 0 0; transform: rotate(' + (t.h2rot ?? '0deg') + '); display: flex; align-items: center; gap: 12px; padding: ' + t.h2pad + '; border-radius: ' + t.h2r + '; border-bottom: ' + t.h2line + '; background: ' + t.h2bg + '; color: ' + t.h2c + '; font-family: ' + t.fd + '; font-weight: ' + t.fdw + '; font-style: ' + t.h2fs + '; font-size: ' + t.h2size + '; line-height: 1.15; text-transform: ' + t.h2tt + '; text-shadow: ' + t.h2sh + ';',
      // As on the dashboard, a speech bubble straddles the top edge of its panel; administration keeps it without a tail.
      tail: t.tail ? 'position: absolute; left: 26px; bottom: -11px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 10px solid transparent; border-top: 12px solid ' + t.h2bg + ';' : 'display: none;',
      mark: 'display: ' + t.mkDisp + '; flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 6px solid #1B2350; background: #FFFFFF;',
      lbl: 'font-weight: 700; font-size: 13px;',
      help: 'font-size: 12px; color: ' + t.muted + ';',
      inp: field + ' height: 42px; padding: 0 14px;',
      // A field sized to what it holds: a few digits for a volume or a year, a month name.
      num: field + ' height: 38px; padding: 0 8px; text-align: center; font-variant-numeric: tabular-nums;',
      area: field + ' padding: 10px 14px; resize: vertical; line-height: 1.5;',
      iconBtn: 'width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 50%; background: transparent; color: ' + t.text + '; cursor: pointer;',
      chip: 'display: inline-flex; align-items: center; gap: 4px; min-height: 30px; padding: 0 4px 0 12px; box-sizing: border-box; border-radius: ' + t.btnR + '; background: ' + t.nBg + '; color: ' + t.nFg + '; font-weight: 700; font-size: 13px;',
      chipX: 'width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 50%; background: transparent; color: inherit; cursor: pointer;',
      addBtn: 'display: inline-flex; align-items: center; gap: 4px; min-height: 30px; padding: 0 12px; box-sizing: border-box; border: 2px dashed ' + t.line + '; border-radius: ' + t.btnR + '; background: transparent; color: ' + t.text + '; font-family: ' + t.fb + '; font-weight: 700; font-size: 13px; cursor: pointer;',
      menuBtn: 'display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 10px; border: 0; border-radius: ' + t.btnR + '; background: transparent; color: ' + t.text + '; font-family: ' + t.fb + '; font-weight: 700; font-size: 14px; text-align: left; cursor: pointer;',
      err,
      titleError,
      titleInvalid: titleError ? 'true' : 'false',
      titleBorder: titleError ? '2px solid ' + t.del : t.inB,
      keyManual,
      keyMode: keyManual ? 'Manuelle' : 'Auto',
      keyBadgeBg: keyManual ? t.acc : 'transparent',
      keyBadgeFg: keyManual ? t.onAcc : t.muted,
      keyBadgeB: keyManual ? '2px solid ' + t.acc : '2px solid ' + t.line,
      keyHelp: keyManual
        ? 'Saisie à la main : elle ne suit plus le titre. « Réinitialiser » la recalcule à partir du titre.'
        : (x.title || !x.series ? 'Calculée à partir du titre, article reporté à la fin ; la modifier la fige.' : 'Sans titre propre, l\'album est rangé à la clé de sa série.'),
      // Both are yes-or-no: an album is regular unless it is an omnibus, and either may be a special issue.
      flags: [
        { label: 'Intégrale', checked: omnibus, toggle: () => this.setState({ type: omnibus ? 'regular' : 'omnibus' }) },
        { label: 'Hors-série', checked: hs, toggle: () => this.setState({ hs: !hs }) }
      ],
      omnibus,
      tomeLabel: omnibus ? 'Numéro' : 'Tome',
      months: MONTHS.map((m, i) => ({ label: m, selected: i === x.month })),
      roles: Object.entries(x.credits).map(([role, people]) => ({ label: role, people, none: people.length === 0 })),
      tagGroups: [
        { label: 'Genres', own: x.genres, noneOwn: x.genres.length === 0, inherited: x.genresSeries },
        { label: 'Univers', own: x.universes, noneOwn: x.universes.length === 0, inherited: x.universesSeries }
      ],
      stars: [1, 2, 3, 4, 5].map((n) => ({
        glyph: n <= rating ? '★' : '☆', fg: n <= rating ? t.acc : t.muted, label: n + ' sur 5 : ' + RATING_LABELS[n],
        checked: n === rating ? 'true' : 'false', pick: () => this.setState({ rating: n })
      })),
      rated: rating > 0,
      ratingLabel: RATING_LABELS[rating],
      clearRating: () => this.setState({ rating: 0 }),
      barBg,
      barB: t.cBT !== '0' ? t.cBT : '2px solid ' + t.line,
      menu: [
        { label: 'Accueil', items: [menuItem('Tableau de bord', '', false), menuItem('Nouvelle édition', '', false)] },
        { label: 'Collection', items: [menuItem('Albums', '2 847', true), menuItem('Séries', '412', false), menuItem('Éditions', '2 913', false), menuItem("Intentions d'achat", '18', false)] },
        { label: 'Auteurs et éditeurs', items: [menuItem('Auteurs', '1 106', false), menuItem('Éditeurs', '96', false)] },
        { label: 'Référentiels', items: [menuItem('Genres', '24', false), menuItem('Univers', '37', false)] },
        { label: 'Réglages', items: [menuItem('Paramétrage', '', false), menuItem('Statistiques privées', '', false)] }
      ]
    };
  }
}

Mockup.mount(View, {
  theme: { label: 'Thème', editor: 'enum', options: ['violine', 'mure', 'gazette', 'sommaire', 'festival', 'riso', 'librairie', 'vignettes'], default: 'violine' },
  exemple: { label: 'Exemple', editor: 'enum', options: ['modification', 'creation', 'integrale'], default: 'modification' },
  cleManuelle: { label: 'Clé de tri manuelle', editor: 'boolean', default: false },
  erreur: { label: 'Erreur', editor: 'enum', options: ['aucune', 'metier', 'fonctionnelle', 'technique'], default: 'aucune' },
  menuOpen: { label: 'Menu ouvert', editor: 'boolean', default: false }
});
</script>
</body>
</html>
