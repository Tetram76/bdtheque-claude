<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche d'album</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Baloo+2:wght@600;700;800&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=DM+Sans:wght@400;500;700&amp;family=DM+Serif+Display:ital@0;1&amp;family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&amp;family=Karla:wght@400;500;700&amp;family=Libre+Franklin:ital,wght@0,400;0,600;0,800;1,800&amp;family=Nunito:wght@400;600;700&amp;family=Rubik+Mono+One&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
input::placeholder{color:inherit}
:focus-visible{outline:3px solid currentColor;outline-offset:2px}
summary{cursor:pointer}
</style>
<script src="../shared/mockup.js"></script>
</head>
<body>
<div id="mockup"></div>
<template id="view">
<div style="min-height: 100vh; background: {{t.bg}}; color: {{t.text}}; font-family: {{t.fb}}; font-size: 15px; line-height: 1.5">

  <header style="position: sticky; top: 0; z-index: 20; background: {{hintBg}}; color: {{t.hText}}; border-bottom: {{t.hLine}}">
    <div style="max-width: 1280px; margin: 0 auto; padding: 10px clamp(12px, 3vw, 24px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px">
      <a href="#" style="display: flex; align-items: center; gap: 10px; color: {{t.hText}}; text-decoration: none">
        <sc-if value="{{t.lgMark}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #E8604C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px">B</span></sc-if>
        <span style="display: inline-block; padding: {{t.lgPad}}; border-radius: {{t.lgR}}; background: {{t.lgBg}}; color: {{t.lgText}}; font: {{t.lgFont}}; line-height: 1.1; text-transform: {{t.lgTT}}; transform: rotate({{t.lgRot}}); box-shadow: {{t.lgSh}}; text-shadow: {{t.lgTSh}}">BDthèque<span style="color: {{t.lgDot}}">.</span></span>
      </a>
      <nav aria-label="Navigation principale" data-scroll-hint="" style="flex: 999 1 220px; --hint-bg: {{hintBg}}">
        <ul data-scroll="" style="margin: 0; padding: 0; list-style: none; display: flex; gap: 4px; white-space: nowrap">
          <sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
            <li style="flex: none"><a href="#" aria-current="{{n.current}}" style="display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: {{t.btnR}}; background: {{n.bg}}; color: {{n.fg}}; font-weight: 700; font-size: 14px; text-transform: {{t.navTT}}; text-decoration: {{n.deco}}; text-decoration-color: {{t.navLine}}; text-decoration-thickness: 3px; text-underline-offset: 6px">{{n.label}}</a></li>
          </sc-for>
        </ul>
      </nav>
      <div style="flex: 1 1 260px; max-width: 380px; min-width: 0; margin-left: auto; display: flex; justify-content: flex-end; align-items: center; gap: 8px">
        <label for="find" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Rechercher</label>
        <input id="find" type="search" placeholder="Un album, une série, un auteur…" style="flex: 1 1 220px; max-width: 320px; min-width: 0; height: 38px; padding: 0 14px; box-sizing: border-box; border: {{t.hInB}}; border-radius: {{t.inR}}; background: {{t.hInBg}}; color: {{t.hInText}}; font: inherit">
        <button type="button" aria-label="Aide sur cette page" style="width: 38px; height: 38px; flex: none; border: {{t.helpB}}; border-radius: {{t.helpR}}; background: {{t.helpBg}}; color: {{t.helpText}}; font-family: {{t.fd}}; font-weight: 700; font-size: 18px; cursor: pointer">?</button>
      </div>
    </div>
  </header>

  <div style="max-width: 1280px; margin: 0 auto; padding: 14px clamp(12px, 3vw, 24px) 32px; box-sizing: border-box">
    <nav aria-label="Fil d'Ariane" style="margin-bottom: 12px; font-size: 13px; color: {{t.muted}}">
      <a href="#" style="color: {{t.link}}; font-weight: 700">Albums</a> <span aria-hidden="true">›</span> <a href="#" style="color: {{t.link}}; font-weight: 700">Corto Maltese</a> <span aria-hidden="true">›</span> <span>Lointaines îles du vent</span>
    </nav>

    <main style="display: flex; flex-direction: column; gap: 22px">

      <div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 32px">

        <section aria-label="Visuels de l'édition" style="flex: 0 1 280px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 0 auto">
          <div style="width: clamp(160px, 42vw, 250px); margin-bottom: {{t.shelfGap}}; box-sizing: border-box; position: relative; padding: {{t.cvPad}}; border: {{t.cvB}}; border-radius: {{t.cvR}}; background: {{t.cvBg}}; box-shadow: {{t.cvSh}}; transform: rotate({{t.cvRot}})">
            <sc-if value="{{t.tape}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: -12px; left: 50%; width: 96px; height: 26px; margin-left: -48px; background: rgba(255,232,0,.75); transform: rotate(-4deg)"></span></sc-if>
            <div role="img" aria-label="{{vis.alt}}" style="display: block; width: 100%; aspect-ratio: 3 / 4; overflow: hidden; border-radius: {{t.imgR}}; background: #FFFFFF">
              <sc-if value="{{vis.isCover}}" hint-placeholder-val="{{true}}">
                <svg viewBox="0 0 300 400" width="100%" height="100%" aria-hidden="true" style="display: block">
                  <rect width="300" height="400" fill="{{art.sky}}"></rect>
                  <circle cx="214" cy="176" r="46" fill="{{art.sun}}"></circle>
                  <rect y="262" width="300" height="138" fill="{{art.sea}}"></rect>
                  <path d="M0 268 C40 240 70 236 104 250 C130 226 162 222 184 246 C204 240 222 252 236 266 Z" fill="{{art.ink}}"></path>
                  <path d="M150 330 h70 l-10 14 h-50 z M184 330 v-48 l26 40 z" fill="{{art.ink}}"></path>
                  <path d="M20 300 q20 -8 40 0 t40 0 M120 362 q20 -8 40 0 t40 0 M210 300 q16 -6 32 0 t32 0" fill="none" stroke="{{art.sky}}" stroke-width="3" stroke-linecap="round"></path>
                  <rect x="0" y="0" width="300" height="104" fill="{{art.band}}"></rect>
                  <text x="150" y="50" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="30" letter-spacing="2" fill="{{art.title}}">CORTO MALTESE</text>
                  <text x="150" y="84" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="19" fill="{{art.title}}">Lointaines îles du vent</text>
                  <text x="150" y="388" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="3" fill="{{art.sky}}">HUGO PRATT</text>
                </svg>
              </sc-if>
              <sc-if value="{{vis.isDed}}" hint-placeholder-val="{{false}}">
                <svg viewBox="0 0 300 400" width="100%" height="100%" aria-hidden="true" style="display: block">
                  <rect width="300" height="400" fill="#F7F1E3"></rect>
                  <path d="M70 140 c20 -40 50 -30 40 0 s-30 50 10 40 s40 -60 60 -30 s10 40 40 10" fill="none" stroke="#1F2A30" stroke-width="3" stroke-linecap="round"></path>
                  <path d="M96 236 c30 -60 60 40 90 -20 c10 -20 30 -10 20 10 c-10 30 30 20 40 0" fill="none" stroke="#1F2A30" stroke-width="4" stroke-linecap="round"></path>
                  <path d="M150 290 c-30 10 -40 40 -10 50 c30 10 50 -20 30 -40" fill="none" stroke="#2F6F8F" stroke-width="3" stroke-linecap="round"></path>
                </svg>
              </sc-if>
              <sc-if value="{{vis.isGarde}}" hint-placeholder-val="{{false}}">
                <svg viewBox="0 0 300 400" width="100%" height="100%" aria-hidden="true" style="display: block">
                  <rect width="300" height="400" fill="{{art.sea}}"></rect>
                  <path d="M-10 60 q25 -14 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 M-10 130 q25 -14 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 M-10 200 q25 -14 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 M-10 270 q25 -14 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 M-10 340 q25 -14 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="{{art.sky}}" stroke-width="4" stroke-linecap="round" opacity=".7"></path>
                </svg>
              </sc-if>
              <sc-if value="{{vis.isBack}}" hint-placeholder-val="{{false}}">
                <svg viewBox="0 0 300 400" width="100%" height="100%" aria-hidden="true" style="display: block">
                  <rect width="300" height="400" fill="{{art.band}}"></rect>
                  <text x="30" y="62" font-family="Georgia, serif" font-weight="700" font-size="20" fill="{{art.title}}">Corto Maltese</text>
                  <rect x="30" y="92" width="240" height="7" rx="3" fill="{{art.title}}" opacity=".55"></rect>
                  <rect x="30" y="110" width="226" height="7" rx="3" fill="{{art.title}}" opacity=".55"></rect>
                  <rect x="30" y="128" width="236" height="7" rx="3" fill="{{art.title}}" opacity=".55"></rect>
                  <rect x="30" y="146" width="180" height="7" rx="3" fill="{{art.title}}" opacity=".55"></rect>
                  <rect x="30" y="180" width="232" height="7" rx="3" fill="{{art.title}}" opacity=".55"></rect>
                  <rect x="30" y="198" width="214" height="7" rx="3" fill="{{art.title}}" opacity=".55"></rect>
                  <rect x="30" y="216" width="140" height="7" rx="3" fill="{{art.title}}" opacity=".55"></rect>
                  <rect x="182" y="300" width="88" height="62" fill="#FFFFFF"></rect>
                  <path d="M190 308 v40 M194 308 v40 M199 308 v40 M202 308 v40 M208 308 v40 M211 308 v40 M216 308 v40 M221 308 v40 M224 308 v40 M230 308 v40 M235 308 v40 M238 308 v40 M244 308 v40 M249 308 v40 M253 308 v40 M258 308 v40 M262 308 v40" stroke="#111111" stroke-width="2"></path>
                </svg>
              </sc-if>
              <sc-if value="{{vis.isPlA}}" hint-placeholder-val="{{false}}">
                <svg viewBox="0 0 300 400" width="100%" height="100%" aria-hidden="true" style="display: block">
                  <rect width="300" height="400" fill="#FFFDF8"></rect>
                  <g fill="{{art.sky}}" stroke="{{art.ink}}" stroke-width="3"><rect x="14" y="14" width="132" height="120"></rect><rect x="154" y="14" width="132" height="120"></rect><rect x="14" y="142" width="272" height="110"></rect><rect x="14" y="260" width="86" height="126"></rect><rect x="107" y="260" width="86" height="126"></rect><rect x="200" y="260" width="86" height="126"></rect></g>
                  <rect x="15.5" y="200" width="269" height="50.5" fill="{{art.sea}}"></rect>
                  <ellipse cx="80" cy="50" rx="44" ry="22" fill="#FFFFFF" stroke="{{art.ink}}" stroke-width="2"></ellipse>
                  <circle cx="230" cy="90" r="18" fill="{{art.sun}}"></circle>
                </svg>
              </sc-if>
              <sc-if value="{{vis.isPlB}}" hint-placeholder-val="{{false}}">
                <svg viewBox="0 0 300 400" width="100%" height="100%" aria-hidden="true" style="display: block">
                  <rect width="300" height="400" fill="#FFFDF8"></rect>
                  <g fill="{{art.sky}}" stroke="{{art.ink}}" stroke-width="3"><rect x="14" y="14" width="170" height="238"></rect><rect x="192" y="14" width="94" height="115"></rect><rect x="192" y="137" width="94" height="115"></rect><rect x="14" y="260" width="272" height="126"></rect></g>
                  <path d="M60 252 v-90 l30 -40 l30 40 v90 z" fill="{{art.ink}}"></path>
                  <ellipse cx="236" cy="48" rx="34" ry="18" fill="#FFFFFF" stroke="{{art.ink}}" stroke-width="2"></ellipse>
                  <rect x="15.5" y="330" width="269" height="54.5" fill="{{art.sea}}"></rect>
                </svg>
              </sc-if>
              <sc-if value="{{vis.isPlC}}" hint-placeholder-val="{{false}}">
                <svg viewBox="0 0 300 400" width="100%" height="100%" aria-hidden="true" style="display: block">
                  <rect width="300" height="400" fill="#FFFDF8"></rect>
                  <g fill="{{art.sky}}" stroke="{{art.ink}}" stroke-width="3"><rect x="14" y="14" width="132" height="118"></rect><rect x="154" y="14" width="132" height="118"></rect><rect x="14" y="140" width="132" height="118"></rect><rect x="154" y="140" width="132" height="118"></rect><rect x="14" y="266" width="132" height="120"></rect><rect x="154" y="266" width="132" height="120"></rect></g>
                  <circle cx="80" cy="200" r="26" fill="{{art.sun}}"></circle>
                  <ellipse cx="220" cy="300" rx="40" ry="20" fill="#FFFFFF" stroke="{{art.ink}}" stroke-width="2"></ellipse>
                </svg>
              </sc-if>
            </div>
            <sc-if value="{{t.shelf}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; left: -14px; right: -14px; bottom: -14px; height: 14px; background: #5B3A24; box-shadow: 0 4px 0 #3F2818"></span></sc-if>
          </div>
          <div style="width: 100%; max-width: 280px; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px">
            <button type="button" aria-label="Visuel précédent" onClick="{{prevVis}}" style="width: 34px; height: 34px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: {{t.secB}}; border-radius: {{t.btnR}}; background: transparent; color: {{t.secText}}; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
            <span aria-live="polite" style="display: flex; flex-direction: column; align-items: center; text-align: center; font-size: 13px; line-height: 1.3">
              <strong>{{vis.type}}</strong>
              <span style="color: {{t.muted}}">{{vis.pos}}</span>
            </span>
            <button type="button" aria-label="Visuel suivant" onClick="{{nextVis}}" style="width: 34px; height: 34px; flex: none; display: inline-flex; align-items: center; justify-content: center; border: {{t.secB}}; border-radius: {{t.btnR}}; background: transparent; color: {{t.secText}}; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
          </div>
          <div style="width: 100%; max-width: 280px; overflow-x: auto; scroll-snap-type: x proximity">
            <ul aria-label="Tous les visuels de l'édition" style="margin: 0; padding: 2px 2px 6px; list-style: none; display: flex; gap: 4px; width: max-content">
              <sc-for list="{{visuals}}" as="v" hint-placeholder-count="13">
                <li style="scroll-snap-align: start"><button type="button" aria-label="{{v.type}}" aria-pressed="{{v.pressed}}" onClick="{{v.pick}}" style="width: 38px; padding: 2px 2px 1px; display: flex; flex-direction: column; align-items: center; gap: 2px; border: {{v.thumbB}}; border-radius: 6px; background: transparent; color: {{v.thumbFg}}; font-family: {{t.fb}}; cursor: pointer">
                  <span aria-hidden="true" style="display: block; width: 30px; height: 40px; overflow: hidden; border-radius: 3px; box-shadow: 0 0 0 1px {{t.line}}">
                    <sc-if value="{{v.isCover}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 30 40" width="30" height="40" style="display: block"><rect width="30" height="40" fill="{{art.sky}}"></rect><rect y="27" width="30" height="13" fill="{{art.sea}}"></rect><rect width="30" height="10" fill="{{art.band}}"></rect><circle cx="21" cy="18" r="4.5" fill="{{art.sun}}"></circle></svg></sc-if>
                    <sc-if value="{{v.isGarde}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 30 40" width="30" height="40" style="display: block"><rect width="30" height="40" fill="{{art.sea}}"></rect><path d="M0 12 q4 -2 8 0 t8 0 t8 0 t8 0 M0 24 q4 -2 8 0 t8 0 t8 0 t8 0" fill="none" stroke="{{art.sky}}" stroke-width="1.5"></path></svg></sc-if>
                    <sc-if value="{{v.isPlanche}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 30 40" width="30" height="40" style="display: block"><rect width="30" height="40" fill="#FFFDF8"></rect><g fill="{{art.sky}}" stroke="{{art.ink}}" stroke-width="1"><rect x="2" y="2" width="12" height="11"></rect><rect x="16" y="2" width="12" height="11"></rect><rect x="2" y="15" width="26" height="10"></rect><rect x="2" y="27" width="12" height="11"></rect><rect x="16" y="27" width="12" height="11"></rect></g></svg></sc-if>
                    <sc-if value="{{v.isDed}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 30 40" width="30" height="40" style="display: block"><rect width="30" height="40" fill="#F7F1E3"></rect><path d="M6 22 c4 -8 8 4 12 -3 c2 -3 5 -1 6 2" fill="none" stroke="#1F2A30" stroke-width="1.5"></path></svg></sc-if>
                    <sc-if value="{{v.isBack}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 30 40" width="30" height="40" style="display: block"><rect width="30" height="40" fill="{{art.band}}"></rect><path d="M4 8 h22 M4 12 h20 M4 16 h21 M4 20 h14" stroke="{{art.title}}" stroke-width="1.5" opacity=".6"></path><rect x="17" y="29" width="10" height="7" fill="#FFFFFF"></rect></svg></sc-if>
                  </span>
                  <span style="font-size: 10px; font-weight: 700; line-height: 1.2">{{v.short}}</span>
                </button></li>
              </sc-for>
            </ul>
          </div>
          <a href="#" style="font-weight: 700; font-size: 13px; color: {{t.link}}">Voir l'image originale</a>
        </section>

        <div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <a href="#" style="align-self: flex-start; font-weight: 700; font-size: 15px; color: {{t.link}}">Corto Maltese</a>
            <h1 style="margin: 0; font-family: {{t.fd}}; font-weight: {{t.fdw}}; font-size: {{t.h1size}}; line-height: 1.05; text-transform: {{t.fdTT}}; color: {{t.text}}">Lointaines îles du vent</h1>
          </div>

          <ul aria-label="En bref" style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{facts}}" as="f" hint-placeholder-count="4">
              <li style="display: inline-flex; align-items: center; min-height: 26px; padding: 0 11px; box-sizing: border-box; border: {{f.bd}}; border-radius: {{t.btnR}}; background: {{f.bg}}; color: {{f.fg}}; font-weight: 700; font-size: 13px">{{f.label}}</li>
            </sc-for>
          </ul>

          <div style="display: flex; align-items: center; gap: 10px">
            <span style="display: inline-flex; gap: 2px; color: {{t.muted}}" role="img" aria-label="Appréciation : pas encore notée">
              <sc-for list="{{stars}}" as="s" hint-placeholder-count="5"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.3L12 17.5 6.5 20.4l1-6.3L3 9.7l6.2-.9z"></path></svg></sc-for>
            </span>
            <span style="font-size: 13px; color: {{t.muted}}">Pas encore noté</span>
          </div>

          <div style="display: flex; flex-direction: column; gap: 2px; padding: 4px 14px; border: {{t.tB}}; border-radius: {{t.tR}}; background: {{t.tBg}}">
            <span style="padding-top: 6px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: {{t.muted}}">{{creditsTotal}}</span>
            <dl style="margin: 0">
              <sc-for list="{{credits}}" as="c" hint-placeholder-count="3">
                <div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 6px 0; border-bottom: {{c.rowB}}">
                  <dt style="flex: 0 0 96px; font-weight: 700">{{c.role}} <span style="font-weight: 400; color: {{t.muted}}">{{c.count}}</span></dt>
                  <dd style="flex: 1 1 220px; min-width: 0; margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px">
                    <sc-for list="{{c.shown}}" as="p" hint-placeholder-count="6"><a href="#" style="display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; box-sizing: border-box; border: 1px solid {{t.line}}; border-radius: {{t.btnR}}; color: {{t.text}}; font-weight: 700; font-size: 13px">{{p.name}}</a></sc-for>
                    <sc-if value="{{c.none}}" hint-placeholder-val="{{false}}"><span style="color: {{t.muted}}">Non crédité</span></sc-if>
                    <sc-if value="{{c.more}}" hint-placeholder-val="{{false}}"><button type="button" aria-expanded="{{c.expanded}}" onClick="{{c.toggle}}" style="min-height: 26px; padding: 0 8px; border: 0; border-radius: {{t.btnR}}; background: transparent; color: {{t.link}}; font-family: {{t.fb}}; font-weight: 700; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">{{c.moreLabel}}</button></sc-if>
                  </dd>
                </div>
              </sc-for>
            </dl>
          </div>

          <dl style="margin: 0; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px">
              <dt style="min-width: 80px; font-weight: 700">Genres</dt>
              <dd style="margin: 0; display: flex; flex-wrap: wrap; gap: 8px">
                <sc-for list="{{genres}}" as="g" hint-placeholder-count="2"><a href="#" style="display: inline-flex; align-items: center; min-height: 26px; padding: 0 11px; border-radius: {{t.chipR}}; background: {{g.bg}}; color: {{g.fg}}; font-weight: 700; font-size: 13px">{{g.label}}</a></sc-for>
              </dd>
            </div>
            <div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 14px">
              <dt style="min-width: 80px; min-height: 26px; display: flex; align-items: center; font-weight: 700">Univers</dt>
              <dd style="margin: 0; display: flex; flex-direction: column; gap: 8px">
                <sc-for list="{{universes}}" as="u" hint-placeholder-count="2">
                  <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px">
                    <sc-for list="{{u.path}}" as="p" hint-placeholder-count="3">
                      <sc-if value="{{p.sep}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="color: {{t.muted}}">›</span></sc-if>

const NAV_ACTIVE = { vignettes: ['#FFD23F', '#23323A'] };

// Visuals: [full name, kind, short label under the thumbnail].
const PLANCHES = Array.from({ length: 10 }, (_, i) => ['Planche ' + (i + 1), 'planche', String(i + 1)]);

// Four editions of the same album, one of them only wished for; the cover art only differs by its colours.

    visuals: [['Couverture', 'cover', 'Couv.'], ['Dédicace', 'ded', 'Déd.'], ['4e de couverture', 'back', '4e']],
    objet: [

// The usual case, and a collective album credited to some twenty artists (two of them in two roles).
const CREDITS = {
  courantes: { scenario: ['Hugo Pratt'], dessin: ['Hugo Pratt'], couleurs: [] },
  nombreuses: {
    scenario: ['Hugo Pratt', 'Léa Ferrand', 'Malo Kerbrat'],
    dessin: ['Hugo Pratt', 'Inès Vasseur', 'Tom Arribas', 'Clara Benmansour', 'Yann Le Goff', 'Sacha Morel', 'Nina Okafor', 'Paul Delorme', 'Jade Rinaldi', 'Hugo Marchetti', 'Élise Caradec', 'Romain Vidal', 'Agathe Leroux', 'Samir Haddad'],
    couleurs: ['Inès Vasseur', 'Lou Tessier', 'Bastien Royer', 'Maëlle Guérin', 'Noé Faure']
  }
};
const ROLES = [['scenario', 'Scénario'], ['dessin', 'Dessin'], ['couleurs', 'Couleurs']];
// Beyond this many names a role is folded, so that a collective album does not push the rest of the page down.
const SHOWN_PER_ROLE = 6;

// Each universe shown with its ancestors, root first: the album is attached to the last one.
const UNIVERSES = [
  ['Univers Hugo Pratt', 'Corto Maltese', 'Les Antilles'],
  ['Amérique du Sud']
];

const SERIES = [
  'La Jeunesse', 'La Ballade de la mer salée', 'Sous le signe du Capricorne', 'Toujours un peu plus loin', 'Lointaines îles du vent',
  'Les Celtiques', 'Les Éthiopiques', 'Corto Maltese en Sibérie', 'Fable de Venise', 'La Maison dorée de Samarkand',
  'Tango', 'Les Helvétiques', 'Mû', 'Sous le soleil de minuit', 'Equatoria'
];
// Tomes 13 and 15 are catalogued without being owned: the series list still shows them.
const NOT_OWNED = [12, 14];

class View extends Mockup {
  renderVals() {
    const key = this.props.theme ?? 'violine';
    const t = THEMES[key] ?? THEMES.violine;
    const edIndex = this.state?.edition ?? 0;
    const visIndex = this.state?.visual ?? 0;
    const ed = EDITIONS[edIndex];
    const visCount = ed.visuals.length;
    const vi = Math.min(visIndex, visCount - 1);
    const [visType, visKind] = ed.visuals[vi];
    const people = CREDITS[this.props.contributions] ?? CREDITS.nombreuses;
    const distinct = new Set(ROLES.flatMap(([role]) => people[role])).size;
    const unfolded = this.state?.unfolded ?? {};
    // Three page layouts alternate, so that consecutive plates do not look identical.
    const plate = visKind === 'planche' ? vi % 3 : -1;
    const kick = (i, label) => (t.kPre ? t.kPre(i, label) : label);
    const [navAcc, navOnAcc] = NAV_ACTIVE[key] ?? [t.acc, t.onAcc];
    const navItem = (label, current) => ({
      label,
      current: current ? 'page' : 'false',
      bg: current && !t.navUnderline ? navAcc : 'transparent',
      fg: current && !t.navUnderline ? navOnAcc : t.hText,
      deco: current && t.navUnderline ? 'underline' : 'none'
    });
    // An empty value stays visible: the reader sees what is not known rather than a missing line.
    const row = ([k, v, kind, sub]) => ({
      k,
      v: v || 'Non renseigné',
      // Only a publisher with a known website is a link, to that site (fonctionnel.md § Structure de l'application).
      isLink: Boolean(v) && kind.startsWith('http'),
      href: kind,
      isText: !v || !kind.startsWith('http'),
      color: v ? t.text : t.muted,
      sub: sub ?? '',
      hasSub: Boolean(sub)
    });
    const pick = (selected) => ({
      bg: selected ? t.acc : 'transparent',
      fg: selected ? t.onAcc : t.text,
      bd: selected ? '2px solid ' + t.acc : (t.tB === '0' ? '2px solid ' + t.line : t.tB)
    });
    return {
      t,
      // The scroll hint of the menu fades into what lies behind it: the header, or the page under a transparent one.
      hintBg: t.hBg === 'transparent' ? t.bg : t.hBg,
      art: ed.art,
      k: { recit: kick(1, 'Le récit'), editions: kick(2, 'Les éditions'), serie: kick(3, 'La série') },
      nav: [navItem('Accueil', false), navItem('Albums', true), navItem('Séries', false), navItem('Auteurs', false), navItem("Intentions d'achat", false)],
      facts: [
        { label: 'T. 5', ...pick(true) },
        { label: 'Paru en novembre 1970', ...pick(false) },
        { label: 'Dans la collection, en 3 éditions', bg: t.colBg, fg: t.colFg, bd: '2px solid ' + t.colBg }
      ],
      stars: [1, 2, 3, 4, 5],
      creditsTotal: distinct > 1 ? distinct + ' auteurs crédités' : 'Auteur',
      credits: ROLES.map(([role, label], r) => {
        const all = people[role];
        const open = Boolean(unfolded[role]);
        const hidden = all.length - SHOWN_PER_ROLE;
        return {
          role: label,
          count: all.length > 1 ? '(' + all.length + ')' : '',
          shown: (open ? all : all.slice(0, SHOWN_PER_ROLE)).map((name) => ({ name })),
          none: all.length === 0,
          more: hidden > 0,
          expanded: open ? 'true' : 'false',
          moreLabel: open ? 'Réduire' : 'et ' + hidden + (hidden > 1 ? ' autres' : ' autre'),
          toggle: () => this.setState({ unfolded: { ...unfolded, [role]: !open } }),
          rowB: r < ROLES.length - 1 ? t.rowB : '0'
        };
      }),
      genres: [{ label: 'Aventure', bg: t.pal[0][0], fg: t.pal[0][1] }, { label: 'Historique', bg: t.pal[0][0], fg: t.pal[0][1] }],
      universes: UNIVERSES.map((chain) => ({
        bg: t.pal[1][0], fg: t.pal[1][1],
        path: chain.map((name, i) => ({ name, sep: i > 0, leaf: i === chain.length - 1, parent: i < chain.length - 1 }))
      })),
      vis: {
        type: visType,
        pos: (vi + 1) + ' sur ' + visCount,
        alt: visType + ' de l’édition ' + ed.label,
        isCover: visKind === 'cover', isDed: visKind === 'ded', isGarde: visKind === 'garde', isBack: visKind === 'back',
        isPlA: plate === 0, isPlB: plate === 1, isPlC: plate === 2
      },
      visuals: ed.visuals.map(([type, kind, short], i) => ({
        type, short, pressed: i === vi ? 'true' : 'false',
        thumbB: i === vi ? '3px solid ' + t.acc : '3px solid transparent',
        thumbFg: i === vi ? t.text : t.muted,
        isCover: kind === 'cover', isGarde: kind === 'garde', isPlanche: kind === 'planche', isDed: kind === 'ded', isBack: kind === 'back',
        pick: () => this.setState({ visual: i })
      })),
      prevVis: () => this.setState({ visual: (vi + visCount - 1) % visCount }),
      nextVis: () => this.setState({ visual: (vi + 1) % visCount }),
      editions: EDITIONS.map((e, i) => ({
        label: e.label, pressed: i === edIndex ? 'true' : 'false', ...pick(i === edIndex),
        badge: e.owned ? 'Dans la collection' : "Intention d'achat",
        badgeBg: e.owned ? t.colBg : 'transparent',
        badgeFg: e.owned ? t.colFg : (i === edIndex ? t.onAcc : t.text),
        badgeB: e.owned ? '0' : '2px dashed currentColor',
        // Switching edition also shows its own visuals, from its cover.
        pick: () => this.setState({ edition: i, visual: 0 })
      })),
      groups: [
        { title: "L'édition", rows: ed.objet.map(row) },
        { title: "L'exemplaire", rows: ed.exemplaire.map(row) }
      ],
      cur: { meta: ed.meta },
      seriesAlbums: SERIES.map((title, i) => {
        const owned = !NOT_OWNED.includes(i);
        return {
          tome: 'T. ' + (i + 1), title, current: i === 4, other: i !== 4,
          own: owned ? 'Possédé' : 'Pas dans la collection', ownColor: owned ? t.muted : t.link
        };
      })
    };
  }
}

Mockup.mount(View, {"theme": {"label": "Thème", "editor": "enum", "options": ["violine", "mure", "gazette", "sommaire", "festival", "riso", "librairie", "vignettes"], "default": "violine"}, "contributions": {"label": "Contributions", "editor": "enum", "options": ["nombreuses", "courantes"], "default": "nombreuses"}});
</script>
